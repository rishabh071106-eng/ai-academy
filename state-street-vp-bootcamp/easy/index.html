    {e:`💰`, t:`Finance`, s:`Treasure: evidence. Bring numbers that hold up — get funding continuity.`}]}},
  {h:`Meetings are theatre; decisions happen before`,
   b:`<p>The golden rule of big organizations: <b>a decision meeting should CONFIRM a decision, not discover the question.</b></p>`,
   d:{type:`flow`, steps:[
    {e:`☕`, t:`Pre-talk each key person`, s:`15 minutes each: share the idea, hear objections`},
    {e:`🔧`, t:`Absorb one concern each`, s:`Now it's partly THEIR proposal`},
    {e:`📄`, t:`Short memo, sent early`, s:`Everyone reads before, not during`},
    {e:`✅`, t:`Meeting confirms`, s:`Decision recorded: what, who, when`}]},
   b2:`<div class="callout">💡 This is called <b>pre-wiring</b>, and it's the single highest-return habit at your level. Surprising senior people in meetings feels dramatic and works never. And always write decisions down — unrecorded decisions get re-argued in three months.</div>`},
  {h:`When you clash (you will)`,
   b:`<p>Two rules keep conflict healthy:</p>
   <ul>
   <li>🤝 <b>Never escalate a surprise.</b> If you must take a disagreement upward, write the options TOGETHER with the person you disagree with — one page, shared facts, both options fairly stated — and go to the bosses jointly. It's respected, it's fast, and the relationship survives.</li>
   <li>📝 <b>Never accept an unrecorded decision.</b> "We agreed in the hallway" is worth nothing in a bank.</li>
   </ul>
   <p><b>Week 2 in one line:</b> you learned what to build (strategy), in what order (priorities), for whom (users), on which platform bones (permissions, alerts, documents) — and today, how to get a giant organization to actually let you build it. That's the craft. Next week: the technology under it all — in plain words.</p>`},
 ],
 words:[
  {w:`Stakeholder`, d:`Anyone whose yes, no, or shrug affects your product — inside or outside the company.`},
  {w:`Pre-wiring`, d:`Talking to key people one-on-one BEFORE a decision meeting, so the meeting confirms rather than debates.`},
  {w:`Escalation`, d:`Taking a stuck disagreement to more senior people — best done jointly, never as an ambush.`},
  {w:`Compliance`, d:`The team ensuring the bank follows laws and rules. Involve early = partner; involve late = blocker.`},
  {w:`Decision log`, d:`The written record of what was decided, by whom, when. The antidote to eternal re-arguing.`}],
 quiz:[
  {q:`Compliance keeps "blocking" your launches. The usual root cause?`,
   o:[`They dislike innovation`, `They're being surprised late — involve them at the idea stage instead`, `Their team is too small`], a:1,
   why:`"No surprises" is their currency. Early involvement turns the blocker into a co-designer.`},
  {q:`Pre-wiring means…`,
   o:[`installing meeting-room cables`, `aligning key people 1-on-1 before the meeting, so it confirms instead of debates`, `emailing slides during the meeting`], a:1,
   why:`Decisions are made in the corridors; meetings ratify them. Work the corridors kindly.`},
  {q:`You and Ops still disagree after real effort. Best move?`,
   o:[`Secretly convince the boss first`, `Write one page TOGETHER — shared facts, both options — and escalate jointly`, `Drop it forever`], a:1,
   why:`Joint escalation on shared facts is fast, fair, and keeps the relationship — the opposite of the ambush.`}]},
/* ============ WEEK 3 — THE TECH ============ */
{n:15, e:`🔌`, t:`APIs: when machines order for themselves`, tag:`Your biggest clients don't want your website at all`,
 deep:`week-3-technology-and-data/day-15-apis-and-api-products.md`,
 imagine:{e:`🍽️`, h:`Imagine a restaurant with a waiter — and a delivery hatch`,
  p:`Humans dine in the restaurant: menus, waiters, ambiance. But the supermarket next door doesn't want a table — it wants a hatch where its truck collects 500 meals daily, automatically, no chit-chat. An <b>API</b> is that hatch: a standard way for one computer system to request things from another. Your biggest clients' systems collect data through your hatch thousands of times a day — the portal is for humans, APIs are for their machines.`},
 secs:[
  {h:`How the hatch works`,
   b:`<p>An API is a set of standard requests with standard answers. No magic:</p>`,
   d:{type:`flow`, steps:[
    {e:`🤖`, t:`Client's system asks`, s:`"Give me all of account 4021's failed trades"`},
    {e:`🪪`, t:`Yours checks ID`, s:`Valid credentials? Entitled to THAT account? (Day 11!)`},
    {e:`📦`, t:`Answers in a standard shape`, s:`Machine-readable list, always the same format`},
    {e:`🔁`, t:`Repeats all day`, s:`Every few minutes, no human, no phone call`}]},
   b2:`<div class="callout">💡 There's also the reverse flavor: a <b>webhook</b>, where YOUR system calls THEIRS the moment something happens ("trade 8812 just failed!"). Ask vs be-told. T+1 deadlines (Day 3) made the be-told flavor precious.</div>`},
  {h:`An API is a PROMISE (that's the hard part)`,
   b:`<p>Once 40 client firms build their systems against your hatch, its shape is a promise. Rename one field and you break real companies' operations overnight — a relationship crisis, not a bug.</p>
   <ul>
   <li>➕ <b>Adding</b> new info: fine anytime — nobody breaks.</li>
   <li>✂️ <b>Changing or removing</b>: build the new version alongside, then give clients <b>12–18 months</b> to move. Yes, months. Institutions change slowly, and forcing speed converts your release into their emergency.</li>
   </ul>
   <p>Guarding this discipline against every team that "just wants to fix" a field is genuinely a VP-level duty.</p>`},
  {h:`Treat the API like a product, not plumbing`,
   b:`<p>Since clients' engineers are users too, they deserve product thinking:</p>
   <ul>
   <li>📚 <b>Great docs</b> — clear, current, with copy-paste examples.</li>
   <li>🧪 <b>A sandbox</b> — a practice environment with realistic fake data, so clients build safely before touching real accounts.</li>
   <li>⏱️ <b>One north-star metric: time-to-first-success</b> — how long from "we'd like access" to their first working request. Banks take weeks; every day you shave off is felt differentiation.</li>
   <li>📈 <b>Usage telemetry</b> — you can SEE which clients call what. Gold for product decisions, and for spotting a client whose usage quietly stopped (early warning!).</li>
   </ul>`},
 ],
 words:[
  {w:`API`, d:`A standard way for one system to request data or actions from another. The delivery hatch.`},
  {w:`Webhook`, d:`The reverse: your system proactively notifies theirs the instant something happens.`},
  {w:`Breaking change`, d:`Any API change that stops existing users' systems working. In this world: a relationship event.`},
  {w:`Sandbox`, d:`A safe practice copy of your API with fake data, for clients to build and test against.`},
  {w:`Deprecation`, d:`The polite, LONG process of retiring an old API version — announce, support both, give 12–18 months.`}],
 quiz:[
  {q:`Why do your most sophisticated clients barely use the portal?`,
   o:[`It's badly designed`, `Their own systems consume your data via APIs — machines don't need screens`, `They can't afford logins`], a:1,
   why:`Portals serve humans; APIs serve the client's machines. For big firms the API IS the product.`},
  {q:`A team wants to rename a field in a live API. Correct answer?`,
   o:[`Fine, ship Friday`, `New version alongside the old, then 12–18 months for clients to migrate`, `Never change anything ever`], a:1,
   why:`The shape is a promise 40 firms built against. Breaking changes get versions and long, kind runways.`},
  {q:`The best single health metric for an API product:`,
   o:[`Lines of code`, `Time from "we want access" to a client's first successful request`, `Number of fields returned`], a:1,
   why:`Time-to-first-success measures the whole experience: docs, sandbox, onboarding, design.`}]},

{n:16, e:`🏗️`, t:`Old systems, new systems, one bank`, tag:`Renovating a house you can never stop living in`,
 deep:`week-3-technology-and-data/day-16-microservices-and-enterprise-architecture.md`,
 imagine:{e:`🏚️`, h:`Imagine renovating a mansion... that can never close`,
  p:`The bank's technology is a 200-year-old mansion: some wings are brand new, some wiring is from the 1980s and still works brilliantly — and the residents (trillions of dollars of daily activity) can NEVER move out during renovations. You can't demolish and rebuild. You renovate room by room, keeping the lights on. Today: how that's actually done, and the words architects use for it.`},
 secs:[
  {h:`The floors of the building`,
   b:`<p>Almost every big bank's tech looks like this from the side:</p>`,
   d:{type:`stack`, layers:[
    {e:`📱`, t:`Screens and hatches (YOU)`, s:`Portal, apps, APIs — what clients touch`},
    {e:`🔀`, t:`The adapter layer`, s:`Translates between friendly modern shapes and the old cores`},
    {e:`⚙️`, t:`Services by specialty`, s:`Separate mid-size systems: settlements, corporate actions, cash…`},
    {e:`🏛️`, t:`Core ledgers (often decades old)`, s:`The books of record. Ancient, ultra-reliable, everything depends on them`}]},
   b2:`<div class="callout">💡 Big insight for your job: the old cores often update in <b>overnight batches</b>. So your beautiful "live" screen may show data that is truly "as of 6am." Never fake freshness — label it (Day 10's rule) and know which floor your data comes from.</div>`},
  {h:`One big machine, or many small ones?`,
   b:``,
   d:{type:`split`,
    a:{h:`🧩 Many small services (modern)`, items:[`Each specialty is its own system`,`Teams change their piece without touching others`,`One piece failing ≠ everything failing`,`BUT: many moving parts to coordinate`]},
    b:{h:`🗿 One giant system (classic)`, items:[`Everything in one huge codebase`,`Simple when small…`,`…but any change risks everything, so change slows to a crawl`,`One failure can take it ALL down`]}},
   b2:`<p>The industry moved to "many small" (called <b>microservices</b>) mostly for the speed-of-change and blast-radius reasons. Your practical takeaway: features that span many services take longer than they look — coordination is the hidden cost.</p>`},
  {h:`The strangler fig (best renovation trick ever)`,
   b:`<p>There's a jungle tree that grows AROUND an old tree until it can stand alone, and the old one fades inside it. Replacing an old system works the same way:</p>`,
   d:{type:`flow`, steps:[
    {e:`🌱`, t:`New system starts small`, s:`Takes over ONE screen or function`},
    {e:`🌿`, t:`Grows page by page`, s:`Users drift over gradually; both run in parallel`},
    {e:`🌳`, t:`New carries everything`, s:`Old system quietly idle`},
    {e:`🍂`, t:`Old one retired`, s:`Nobody noticed a "migration day" — that's success`}]},
   b2:`<p>The tempting alternative — build the whole replacement in secret for 3 years, then switch everything one big weekend — is called big-bang, and it's how banks end up in the news. When someone proposes it, reach for the fig.</p>`},
 ],
 words:[
  {w:`Architecture`, d:`The floor plan of the systems: what exists, what talks to what, where data lives.`},
  {w:`Mainframe`, d:`The decades-old, ultra-reliable computers still running many core ledgers.`},
  {w:`Batch`, d:`Processing work in big overnight chunks rather than instantly — why some data is "as of 6am."`},
  {w:`Microservices`, d:`Building from many small specialist systems instead of one giant one.`},
  {w:`Strangler fig`, d:`Replacing an old system by growing the new one around it, piece by piece, until the old fades away.`},
  {w:`Blast radius`, d:`How much else breaks when one thing fails. Good architecture keeps it small.`}],
 quiz:[
  {q:`Your "live" positions screen actually shows 6am data. Why?`,
   o:[`The internet is slow`, `The core ledger updates in overnight batches — so label freshness honestly`, `Someone forgot to refresh`], a:1,
   why:`Know which floor your data comes from. Batch cores mean as-of labels, not fake real-time.`},
  {q:`Why did banks split giant systems into many small ones?`,
   o:[`Small systems are cheaper to license`, `Faster change and smaller blast radius when something fails`, `Fashion`], a:1,
   why:`Independent pieces = teams can move without fear, and one failure doesn't sink everything.`},
  {q:`Replacing a 20-year-old portal: which approach?`,
   o:[`Big-bang: build 3 years in secret, switch one weekend`, `Strangler fig: new one takes over page by page, in parallel`, `Keep the old one forever`], a:1,
   why:`Gradual replacement de-risks everything. Big-bang cutovers are how banks make headlines.`}]},

{n:17, e:`📨`, t:`Events: the bank's group chat`, tag:`Systems that announce news instead of waiting to be asked`,
 deep:`week-3-technology-and-data/day-17-event-driven-architecture.md`,
 imagine:{e:`📢`, h:`Imagine a family group chat`,
  p:`When your cousin gets engaged, she doesn't phone 40 relatives one by one — she posts once in the group chat, and everyone who cares reacts: mom starts planning, uncle checks flights. In a bank, things HAPPEN constantly — a trade settles, a deadline nears, a NAV publishes — and dozens of systems care. So modern banks run a giant internal group chat: systems <b>post events</b> once, and every interested system reacts. It's called event-driven architecture.`},
 secs:[
  {h:`Why the group chat beats phone calls`,
   b:``,
   d:{type:`split`,
    a:{h:`📢 Post events (modern)`, items:[`Announce once — "trade 8812 settled!"`,`Any number of systems react instantly`,`New listeners join without changing the announcer`,`News travels in seconds`]},
    b:{h:`☎️ Ask constantly (old way)`, items:[`Every system phones every other: "anything new? now? now?"`,`Wasteful, slow, tangled`,`Adding a listener = rewiring the source`,`News waits until someone asks`]}},
   b2:`<p>Look how much of your world is literally reactions to one event post: a trade fails → the portal status flips, an alert fires (Day 12), the client's webhook triggers (Day 15), the ops queue gets a task. One post, four reactions. This chat is the nervous system your products sit on.</p>`},
  {h:`The two gotchas (know these and impress architects)`,
   b:`<ul>
   <li>👯 <b>Messages can arrive TWICE.</b> The network guarantees "at least once" delivery — occasionally that means twice. If systems don't check "have I seen event #8812 before?", a client sees the same fail listed twice or gets the same alert twice. The check is called being <b>idempotent</b>, and it's why you should ask any team building on events: "what happens on a duplicate?"</li>
   <li>🔀 <b>Messages can arrive OUT OF ORDER.</b> "Settled" might arrive before "matched." Screens must handle a status going seemingly backwards without confusing the user.</li>
   </ul>
   <div class="callout">💡 These two questions — duplicates and ordering — are 80% of what a product exec needs to probe in any event-driven design review. Ask them and watch engineers smile.</div>`},
  {h:`The chat has rules`,
   b:`<p>A real group chat needs etiquette; so does this one:</p>
   <ul>
   <li>📖 <b>Every event type has an owner and a defined shape.</b> If the settlements team changes what their event contains, every listener is affected — so changes are versioned and announced (exactly like APIs on Day 15 — an event IS a contract).</li>
   <li>🗃️ <b>The chat keeps history.</b> New systems can "scroll up" and replay past events to catch up — enormously useful.</li>
   <li>🚑 <b>Failed messages go to a rescue queue</b> (the "dead letter" queue) where humans investigate — nothing silently vanishes.</li>
   </ul>`},
 ],
 words:[
  {w:`Event`, d:`A small announcement that something happened: "trade 8812 settled at 14:02." Facts, not requests.`},
  {w:`Publish/subscribe`, d:`The group-chat pattern: one system posts, any number listen. Nobody phones anybody.`},
  {w:`Kafka`, d:`The most popular technology for running this giant internal group chat. You'll hear the name weekly.`},
  {w:`Idempotent`, d:`Safe against duplicates — processing the same message twice changes nothing the second time.`},
  {w:`Dead letter queue`, d:`The rescue bin for messages that failed processing, so humans can investigate — nothing vanishes.`},
  {w:`Replay`, d:`Re-reading past events from the chat's history to rebuild or catch up a system.`}],
 quiz:[
  {q:`Event-driven means…`,
   o:[`systems constantly ask each other "anything new?"`, `systems announce news once and all interested systems react`, `everything runs on a timer`], a:1,
   why:`Post once, many react — the group chat. Faster, cleaner, and easy to add listeners.`},
  {q:`The same "trade failed" event arrives twice. A well-built consumer…`,
   o:[`shows the fail twice — the data said so`, `recognizes event #8812 was already processed and ignores the copy`, `crashes safely`], a:1,
   why:`At-least-once delivery makes duplicates normal. Idempotent consumers are the fix — always ask about this.`},
  {q:`Why do event shapes need owners and versions?`,
   o:[`For documentation beauty`, `Because an event is a contract — changing it affects every listener, like changing an API`, `Regulators audit chat logs`], a:1,
   why:`Day 15's promise-discipline applies here too. Contracts everywhere machines depend on each other.`}]},

{n:18, e:`🗄️`, t:`The data library (and Snowflake)`, tag:`Where numbers go to become answers`,
 deep:`week-3-technology-and-data/day-18-data-platforms-snowflake-and-sql.md`,
 imagine:{e:`📚`, h:`Imagine a library that photocopies itself for guests`,
  p:`The bank's operational systems are like busy kitchens — great at cooking, terrible places to sit and read. So every night, copies of all the numbers flow into one giant, beautifully organized library: the <b>data warehouse</b>. Analysts ask it questions, dashboards read from it — and the modern twist (this is Snowflake's party trick) — you can grant a client's own analysts a reading desk with a live view of THEIR shelf, no photocopying, no couriers.`},
 secs:[
  {h:`Why a separate library?`,
   b:`<ul>
   <li>🍳 <b>Kitchens must cook.</b> Heavy analytical questions ("compare all fails across 100 markets for 2 years") would slow the systems doing real-time work. So analysis happens on copies, in the library.</li>
   <li>🗂️ <b>One organized place.</b> Data from settlements, corporate actions, cash — all arranged consistently, so questions can span everything.</li>
   <li>🕰️ <b>History lives here.</b> Operational systems care about NOW; the library keeps years — that's where trends come from.</li>
   </ul>`,
   d:{type:`flow`, steps:[
    {e:`⚙️`, t:`Operational systems`, s:`The busy kitchens (Days 16–17)`},
    {e:`🌙`, t:`Nightly copy-in`, s:`Data flows to the library, cleaned and arranged`},
    {e:`🗄️`, t:`The warehouse`, s:`One organized, historical, question-ready store`},
    {e:`📊`, t:`Everyone reads`, s:`Dashboards, reports, clients' feeds, AI — all one source`}]}},
  {h:`Snowflake, and the trick that matters commercially`,
   b:`<p><b>Snowflake</b> is a popular cloud warehouse. Two things about it are worth an executive's memory:</p>
   <ul>
   <li>💸 <b>You pay for questions, not shelves.</b> Storing data is cheap; computing answers is billed by use. Great economics — but a badly written monster-query burns real money, so cost governance is a thing.</li>
   <li>🤝 <b>Secure data sharing.</b> Instead of exporting nightly files to clients (fragile, slow, endless plumbing), you grant their Snowflake account a live, permission-controlled view of their own data. No copies, always current, entitlements enforced. Clients literally evaluate custodians on this in RFPs now — a data-plumbing feature became a <b>selling point</b>.</li>
   </ul>`},
  {h:`SQL: the question language (read-only tour)`,
   b:`<p>Questions to the library are written in <b>SQL</b> — closer to structured English than to programming. You never need to write it; being able to READ a line builds real credibility:</p>
   <p style="font-family:monospace;background:color-mix(in srgb,var(--wc) 8%,var(--card));padding:12px 14px;border-radius:10px;font-size:14px">SELECT market, COUNT(*)<br>FROM failed_trades<br>WHERE fail_date &gt; '2026-01-01'<br>GROUP BY market<br>ORDER BY COUNT(*) DESC;</p>
   <p>Read aloud: <i>"Count failed trades since January, grouped by market, biggest first."</i> That's it. Ten minutes of pattern-recognition, not a career change.</p>
   <div class="callout">💡 One number, everywhere: the portal, the data share, the monthly report and the sales deck must all read from the SAME library shelf. Two channels showing different "fail counts" is the most credibility-destroying incident in client analytics — Day 20 shows the machinery that prevents it.</div>`},
 ],
 words:[
  {w:`Data warehouse`, d:`The organized library where copies of all the bank's numbers go for analysis and reporting.`},
  {w:`Snowflake`, d:`A leading cloud data warehouse — pay-per-question pricing and built-in secure data sharing.`},
  {w:`SQL`, d:`The near-English language for asking a database questions. Reading it is a superpower; writing it is optional.`},
  {w:`Pipeline`, d:`The automated nightly flow that copies, cleans and arranges data into the warehouse.`},
  {w:`Data sharing`, d:`Granting a client's own systems a live, permission-controlled view of their data — no file exports.`},
  {w:`Data freshness`, d:`How current the library copy is. Usually "as of last night" — and must be labeled (Day 10!).`}],
 quiz:[
  {q:`Why analyze in a warehouse instead of the live systems?`,
   o:[`Live systems have no data`, `Heavy questions would slow the systems doing real-time work — so analysis runs on organized copies`, `Warehouses are more secure`], a:1,
   why:`Kitchens cook; libraries answer questions. Separating the two protects both.`},
  {q:`Snowflake data sharing replaces nightly files with…`,
   o:[`bigger nightly files`, `a live, permission-controlled view of the client's own data in their own account`, `USB sticks`], a:1,
   why:`No copies, always current, entitlements enforced — and clients now score custodians on it.`},
  {q:`Portal says 14 fails, monthly report says 12. Root cause is usually…`,
   o:[`someone lied`, `two channels reading from different sources or times — the "one library shelf" rule was broken`, `rounding`], a:1,
   why:`Consistency across channels is THE trust requirement. One governed source, all channels read it.`}]},

{n:19, e:`📊`, t:`Dashboards that actually get used`, tag:`Turning the library into pictures people act on`,
 deep:`week-3-technology-and-data/day-19-bi-tableau-and-analytics-products.md`,
 imagine:{e:`🚗`, h:`Imagine a car dashboard designed by committee`,
  p:`Your car shows speed, fuel and a red light when something's wrong. Now imagine a car with 45 dials: tire temperatures, per-cylinder pressure, average speed since purchase... You'd miss the red light in the noise. Most corporate dashboards are that second car. Today: making the first kind — and the special challenge of dashboards clients see.`},
 secs:[
  {h:`Five rules that separate used from ignored`,
   b:`<ul>
   <li>❓ <b>Answer a question.</b> A dashboard's title should basically be one: "Are we settling on time — and where are we failing?" If nobody can name its question, it's a data dump.</li>
   <li>⏱️ <b>Pass the 5-second test.</b> Status obvious at a glance: a few headline numbers with targets, color meaning something (red = act, not decoration).</li>
   <li>🚨 <b>Exceptions first</b> (Day 10's rule, now for charts). Show the 12 failing things, not a pie chart celebrating the 98% fine.</li>
   <li>⛏️ <b>Let people dig.</b> Every summary number must open into its details — market → client → the actual records. A number you can't dig into gets rebuilt in Excel within a week.</li>
   <li>🕐 <b>Show freshness and definitions.</b> "As of 06:00," and hovering a metric explains exactly how it's calculated.</li>
   </ul>`},
  {h:`One definition to rule them all`,
   b:`<p>Silent killer of analytics trust: five teams compute "fail rate" five slightly different ways (count or value? include cancels?), so two executives present different numbers for the same month. Nobody lied — definitions drifted.</p>
   <p>The fix is boring and vital: a <b>shared metric dictionary</b>. Each metric defined ONCE — formula, inclusions, owner — and every dashboard, report and API reads that definition. When a client asks "how exactly is this computed?", the answer is a click, not an archaeology project.</p>
   <div class="callout">💡 Tools you'll hear named: <b>Tableau</b> and <b>Power BI</b> — the leading dashboard-building suites. Fine tools; the five rules and the dictionary matter far more than the logo.</div>`},
  {h:`Client-facing analytics: build or embed?`,
   b:`<p>Internal dashboards can be assembled in Tableau by analysts. But when analytics go INTO your portal for clients, the bar jumps — your brand, your performance, your permissions (only THEIR rows — Day 11). Two routes:</p>`,
   d:{type:`split`,
    a:{h:`🏗️ Build charts natively`, items:[`Your look, your speed, part of the workflow`,`Click a bar → open those failed trades → act`,`More effort — you own every feature`,`Right for the standard experience everyone gets`]},
    b:{h:`📦 Embed a BI tool`, items:[`Rich exploration features immediately`,`Per-user licensing costs at client scale — do the math BEFORE the demo`,`Feels slightly "bolted on"`,`Right for the deep-analysis tier for data-hungry clients`]}},
   b2:`<p>Mature answer: native for the standard tier, embedded for the analytical tier — and both reading the same library and metric dictionary so the numbers can never disagree.</p>`},
 ],
 words:[
  {w:`Dashboard`, d:`A screen of charts and numbers meant to answer a specific question at a glance.`},
  {w:`BI`, d:`"Business Intelligence" — the tools and practice of turning data into charts and analysis (Tableau, Power BI).`},
  {w:`KPI`, d:`Key Performance Indicator — a headline number tracked against a target.`},
  {w:`Metric dictionary`, d:`The shared, owned definitions of every metric — the cure for "two numbers disagree."`},
  {w:`Drill down`, d:`Clicking a summary to see what's inside — total → by market → by client → the records.`},
  {w:`Embedded analytics`, d:`Placing a BI tool's charts inside your own portal instead of building charts natively.`}],
 quiz:[
  {q:`The first question to ask of any dashboard:`,
   o:[`Which charting tool built it?`, `What question does it answer?`, `How many charts fit?`], a:1,
   why:`No question = data dump. The title should basically be the question.`},
  {q:`Two executives show different "fail rates" for the same month. Most likely cause?`,
   o:[`One is lying`, `Slightly different metric definitions drifted apart — no shared dictionary`, `Currency conversion`], a:1,
   why:`Definition drift is the silent killer. One dictionary, everyone reads it.`},
  {q:`Analytics inside the client portal must ALWAYS…`,
   o:[`use animation`, `filter to exactly the client's own entitled rows (Day 11) and match every other channel's numbers`, `be built in Tableau`], a:1,
   why:`Entitlements + consistency are non-negotiable when clients see it. Tool choice is secondary.`}]},

{n:20, e:`✅`, t:`Can we trust this number?`, tag:`Data governance: owners, quality and the paper trail`,
 deep:`week-3-technology-and-data/day-20-data-governance-and-collibra.md`,
 imagine:{e:`🥫`, h:`Imagine food labels for data`,
  p:`At the supermarket, every product tells you what's inside, where it came from, and when it expires — and someone is legally responsible for that label being true. Now picture the bank's data the same way: every important number should have an ingredient list (where it came from), a freshness date, and a named person responsible. That practice is called <b>data governance</b> — and for a company whose product IS accurate records, it's close to being the whole game.`},
 secs:[
  {h:`Every important number gets an owner`,
   b:`<p>Governance sounds abstract; it's actually three job titles:</p>`,
   d:{type:`grid`, cards:[
    {e:`👑`, t:`Data owner`, s:`A senior business person accountable for a domain ("head of settlements owns settlement data"). The neck on the line.`},
    {e:`🔧`, t:`Data steward`, s:`The named expert doing the daily work: definitions, quality issues, access questions.`},
    {e:`💻`, t:`Data custodian`, s:`The tech teams running the systems that store and move it. (The role — not the bank!)`}]},
   b2:`<div class="callout">💡 Why you care: when a client challenges a number on your portal, the steward is who you call. When you want to ADD a data field to a screen, the owner's team approves the definition. Build these steps into your process and they take days; skip them and every launch ends in a data-quality escalation.</div>`},
  {h:`The paper trail (lineage) — your best friend in a dispute`,
   b:`<p>A client emails: "Your portal says 14 failed trades, our own file says 12. Explain." With a documented trail of where the number travels, this is an hour's work, not a week's:</p>`,
   d:{type:`flow`, steps:[
    {e:`🏛️`, t:`Book of record`, s:`The settlement system's truth`},
    {e:`📨`, t:`Event stream`, s:`Day 17's group chat carries updates`},
    {e:`🗄️`, t:`Warehouse`, s:`Day 18's library, loaded nightly at 05:00`},
    {e:`📖`, t:`Metric dictionary`, s:`Day 19's shared definition of "fail"`},
    {e:`📊`, t:`Portal AND file`, s:`Both read the same shelf... but cut at different times!`}]},
   b2:`<p>Mystery solved by the trail: the file was generated at 05:00, the portal refreshed at 07:00, and two fails were fixed in between. Nobody was wrong — and you can PROVE it, calmly, with receipts. That's what lineage buys: fast, confident answers instead of panicked archaeology.</p>`},
  {h:`Quality is measured, not assumed`,
   b:`<p>"Good data" gets specific with simple checks — is it <b>accurate</b> (matches reality), <b>complete</b> (nothing missing), <b>timely</b> (there when needed), <b>consistent</b> (same everywhere), <b>unique</b> (no duplicates), <b>valid</b> (right format)? Scores get tracked on scorecards; failures become tickets for stewards.</p>
   <p>One sneaky-important case: <b>reference data</b> — the shared "address books" (security identifiers, client records, delivery instructions). A single wrong entry there quietly breaks dozens of downstream things (remember failed trades from bad SSIs on Day 3?). Half of operational breaks trace back to reference data — which is why governance programs obsess over it.</p>
   <p>Tools exist for all this (you'll hear <b>Collibra</b> — a catalog of what data exists, who owns it, and how it flows). The tool is the map; the owners and stewards are the territory.</p>`},
 ],
 words:[
  {w:`Data governance`, d:`The discipline of named ownership, quality measurement and traceability for important data.`},
  {w:`Data owner`, d:`The senior business person accountable for a data domain's accuracy and definitions.`},
  {w:`Steward`, d:`The named expert handling a domain's daily data questions and quality issues.`},
  {w:`Lineage`, d:`The documented journey of a number from source system to screen — your receipts in any dispute.`},
  {w:`Reference data`, d:`The shared address books: security IDs, client records, delivery instructions. Small errors, huge blast radius.`},
  {w:`Collibra`, d:`A popular tool that catalogs what data exists, what it means, who owns it and where it flows.`}],
 quiz:[
  {q:`A client challenges a number on your portal. Your first call is to…`,
   o:[`the CEO`, `the data steward for that domain — with the lineage trail as your map`, `the client's lawyer`], a:1,
   why:`Named ownership plus lineage turns disputes into an hour of calm receipts, not a week of archaeology.`},
  {q:`Portal (07:00 refresh) and client file (05:00 cut) disagree by two trades. This is…`,
   o:[`a scandal`, `a timing difference — explainable and provable via lineage`, `impossible`], a:1,
   why:`Not all differences are errors. The trail lets you explain WHICH kind you're looking at, fast.`},
  {q:`Why does bad reference data cause outsized damage?`,
   o:[`It's stored on old servers`, `It's shared by everything — one wrong "address book" entry breaks dozens of downstream processes`, `It's expensive to buy`], a:1,
   why:`Upstream of everything = blast radius of everything. Half of ops breaks trace back here.`}]},

{n:21, e:`🤖`, t:`AI in a bank (hype-free)`, tag:`Powerful intern, needs supervision — plus your Week 3 wrap`,
 deep:`week-3-technology-and-data/day-21-ai-in-financial-services-and-week-3-capstone.md`,
 imagine:{e:`🧑‍🎓`, h:`Imagine a brilliant intern with no fear of being wrong`,
  p:`New AI tools are like a dazzling intern: reads a 40-page document in seconds, drafts beautifully, never tires. One flaw: when unsure, it sometimes <b>answers confidently anyway</b> — invented, fluent, wrong. In most offices that's embarrassing. In a bank, telling a client a wrong number is an incident with a capital I. So banks use the intern where it shines, and never let it speak to clients unsupervised.`},
 secs:[
  {h:`Where AI genuinely helps in custody today`,
   b:``,
   d:{type:`grid`, cards:[
    {e:`📄`, t:`Reading documents`, s:`Corporate-action notices (Day 5) arrive as messy text. AI extracts terms fast; humans verify.`},
    {e:`🧩`, t:`Matching breaks`, s:`Two records SHOULD match but don't quite. AI spots the likely pair; humans confirm.`},
    {e:`🚨`, t:`Smelling anomalies`, s:`"Tonight's NAV move looks unusual" (Day 4) — a smarter tolerance check.`},
    {e:`✍️`, t:`Drafting service replies`, s:`AI drafts from account data; a human edits and SENDS. Minutes become seconds.`},
    {e:`💬`, t:`Answering client questions`, s:`"Why did my position drop?" — answered from the client's own data. Careful mode only (below).`}]}},
  {h:`The safety pattern to memorize: grounded + supervised`,
   b:`<p>How do you let AI answer client questions without inventing? Two locks:</p>
   <ul>
   <li>📚 <b>Grounding:</b> the AI may only answer FROM documents and data you hand it — the client's own records — and must show citations. Like an open-book exam where every claim needs a page reference. (And it may only be handed data this user is entitled to see — Day 11 applies to robots too!)</li>
   <li>👀 <b>Human-in-the-loop:</b> for anything consequential, a person reviews before it takes effect.</li>
   </ul>
   <p>Also know: banks have long-standing formal rules for anything model-driven (inventory, validation, monitoring — "model risk management"). It's why an AI feature takes longer to ship in a bank than a startup — not obstruction, just the fire code. Plan the timeline for it.</p>`},
  {h:`Week 3, assembled`,
   b:`<p>Look what you now understand, in one flow:</p>`,
   d:{type:`flow`, steps:[
    {e:`⚙️`, t:`Systems do work`, s:`Old cores + small services (Day 16)`},
    {e:`📢`, t:`Events announce it`, s:`The group chat (Day 17)`},
    {e:`🔌`, t:`APIs serve machines`, s:`Client systems self-serve (Day 15)`},
    {e:`🗄️`, t:`The library collects`, s:`Warehouse + data shares (Day 18)`},
    {e:`📊`, t:`Dashboards answer`, s:`With one metric dictionary (Day 19)`},
    {e:`✅`, t:`Governance guarantees`, s:`Owners, quality, lineage (Day 20)`},
    {e:`🤖`, t:`AI accelerates`, s:`Grounded and supervised (today)`}]},
   b2:`<div class="callout">🎓 You can now hold a real conversation with any architect or data leader in the building. Next week, the final act: leading — your first 90 days, your bosses, your clients, your metrics, your career.</div>`},
 ],
 words:[
  {w:`GenAI / LLM`, d:`AI that reads and writes language — the brilliant intern. Powerful at drafting and extracting; can invent when unsure.`},
  {w:`Hallucination`, d:`AI confidently stating something false. THE risk to control in client-facing uses.`},
  {w:`Grounding (RAG)`, d:`Restricting AI to answer only from supplied trusted documents, with citations. The open-book exam.`},
  {w:`Human-in-the-loop`, d:`A person reviews AI output before it takes effect. Default for anything consequential in a bank.`},
  {w:`Model risk management`, d:`The bank's formal regime for anything model-driven: register it, validate it, monitor it. The fire code for AI.`}],
 quiz:[
  {q:`The #1 risk of client-facing AI in a bank:`,
   o:[`It's too slow`, `Confident, fluent, WRONG answers (hallucination)`, `It's too expensive`], a:1,
   why:`A wrong number told to a client is an incident. Everything in the safety pattern exists for this.`},
  {q:`"Grounding" means the AI…`,
   o:[`runs on physical servers`, `may only answer from supplied, entitled documents — with citations`, `is turned off at night`], a:1,
   why:`Open-book exam with page references — and only the books this user may read (Day 11 for robots).`},
  {q:`Why does shipping AI take longer in a bank than a startup?`,
   o:[`Bank engineers are slower`, `Formal model-risk rules: registration, validation, monitoring — the fire code`, `AI dislikes finance`], a:1,
   why:`Not obstruction — governed deployment. Budget the timeline for it and compliance becomes a partner (Day 14!).`}]},
/* ============ WEEK 4 — THE LEADER ============ */
{n:22, e:`🚀`, t:`Your first 90 days`, tag:`Learn, then aim, then deliver — in that order`,
 deep:`week-4-executive-playbook/day-22-first-90-days.md`,
 imagine:{e:`🧑‍🍳`, h:`Imagine taking over a famous kitchen`,
  p:`A new head chef doesn't rewrite the menu on day one. First they taste everything, watch the line at rush hour, learn who really runs things, and hear what regulars love and hate. THEN they change the menu — starting with one dish everyone agrees needs fixing, executed perfectly. New executives who skip the tasting phase cook confidently for customers they don't know. 90 days, three acts: taste, aim, cook.`},
 secs:[
  {h:`The three acts`,
   b:``,
   d:{type:`flow`, steps:[
    {e:`👂`, t:`Days 1–30: LISTEN`, s:`Meet everyone, use the products, visit the ops floor. Judge nothing yet.`},
    {e:`🎯`, t:`Days 31–60: AIM`, s:`Write what you've learned, pick 2–3 quick wins, sketch your direction`},
    {e:`🔨`, t:`Days 61–90: DELIVER`, s:`Ship a visible win, present your plan, adjust the team if needed`}]},
   b2:`<div class="callout">💡 The order is the whole secret. Loud opinions in week 2 make you sound smart and land wrong — you don't know the history yet. Quiet in week 10 makes people wonder why you came. Early = ears; later = voice.</div>`},
  {h:`Act 1: who to meet, and what to actually ask`,
   b:`<p>Meet in this order: your own team (1-on-1s first), your boss (what does success look like in a year?), operations floor (shadow real work for a full day — non-negotiable, instant credibility), client service (they hear all the pain first), 2–3 real clients (just listen), then compliance, sales and architecture.</p>
   <p>Questions that unlock people:</p>
   <ul>
   <li>"What's the <b>dumbest thing</b> we make clients do?" (instant roadmap gold)</li>
   <li>"What did the last leader try that <b>didn't work</b> — and why?" (buried landmines, mapped)</li>
   <li>"If you had my job for a month, what's the <b>first thing</b> you'd change?"</li>
   <li>"What promises have already been made to clients?" (commitments you're silently carrying)</li>
   </ul>`},
  {h:`Act 2 and 3: choosing wins that build trust`,
   b:`<p>Your first delivery is a trust-builder, so choose it by these filters — visible to clients AND ops, shippable in under 90 days, low risk, and ideally something everyone already agrees is broken. From your month of learning, classics include: deadline alerts that escalate (Day 12), honest data-freshness labels (Days 10/16), or killing the top "where is it?" phone call with a status screen (Day 3).</p>
   <p>Then at day ~90, present the plan: <i>here's what I learned (people recognize their words), here's what we shipped already (proof), here's where we're going (direction), here's what I need (the ask)</i>. Learned → shipped → going → need. That structure never fails.</p>
   <div class="callout">⚠️ The three classic traps: rebuilding everything at once (big-bang — Day 16 warned you), promising sales dates to seem helpful (Day 9 warned you), and mistaking meeting-attendance for credibility (shipping is credibility).</div>`},
 ],
 words:[
  {w:`Listening tour`, d:`Your first-month circuit of structured conversations — collecting truth before forming opinions.`},
  {w:`Quick win`, d:`A small, visible, low-risk improvement delivered fast to build trust for bigger things.`},
  {w:`Ops shadowing`, d:`Sitting with operations staff watching real work for a day. The fastest credibility-builder that exists.`},
  {w:`Stakeholder map`, d:`Your who's-who: who decides, who influences, who must never be surprised (Day 14's cast).`},
  {w:`In-flight commitments`, d:`Promises to clients already made before you arrived. Find them in month one — you own them now.`}],
 quiz:[
  {q:`Weeks 1–4 of a new VP role are best spent…`,
   o:[`announcing your vision with energy`, `listening, shadowing ops and using the products — judging nothing yet`, `reorganizing the team`], a:1,
   why:`Taste before you cook. Early opinions sound smart and land wrong; early ears earn the right to aim.`},
  {q:`The best FIRST delivery is…`,
   o:[`the boldest idea you brought from outside`, `something visible, fast, low-risk, that everyone already agrees is broken`, `a portal-wide redesign`], a:1,
   why:`Quick wins are trust-builders. Consensus pain + fast ship = credibility for the bigger bets.`},
  {q:`"What did the last leader try that didn't work?" exists to…`,
   o:[`gossip`, `map the buried landmines and history you'd otherwise step on`, `criticize predecessors`], a:1,
   why:`Organizations remember. Knowing what failed and why saves you from re-running the failure.`}]},

{n:23, e:`🗣️`, t:`Speaking executive`, tag:`Answer first — everything else follows`,
 deep:`week-4-executive-playbook/day-23-executive-communication.md`,
 imagine:{e:`📰`, h:`Imagine a newspaper that buried its headlines`,
  p:`No paper prints "Various events occurred; motives were considered; more inside." The headline states the news; details follow for whoever wants them. Now recall the last status update you saw: three background slides, four "context" charts, conclusion on slide 9. Executives read like newspaper readers — headline first, details optional. Learning to write and speak that way is the highest-return communication skill in corporate life.`},
 secs:[
  {h:`The pyramid: one rule, endless mileage`,
   b:`<p><b>Start with the answer.</b> Then the 2–3 reasons. Then the evidence, for whoever wants it.</p>`,
   d:{type:`stack`, layers:[
    {e:`🎯`, t:`THE ANSWER (say it first)`, s:`"We should delay launch by 3 weeks."`},
    {e:`🧱`, t:`The reasons (2–3, grouped)`, s:`"Testing found entitlement bugs · a top client asked for the window · the fix removes launch risk"`},
    {e:`📚`, t:`The evidence (on request)`, s:`Bug lists, client email, revised plan`}]},
   b2:`<div class="callout">💡 Why it feels wrong at first: school taught buildup-then-conclusion. But executives decide dozens of things daily — answer-first respects their reality, and mid-story interruptions can't hurt you when the conclusion already landed in sentence one.</div>`},
  {h:`Status reports that build trust`,
   b:`<p>The instinct is to lead with sunshine and whisper the risks. Reverse it — <b>lead with the risks</b>:</p>
   <ul>
   <li>🟢🟡🔴 Use honest traffic lights. A project that's "green, green, green, RED-surprise!" destroys your credibility permanently. An early yellow with a plan attached ("yellow: vendor slipped 2 weeks; recovery: X; need: nothing yet") builds it.</li>
   <li>📉 Bad news travels UP fast, from you, with a plan. Bosses forgive problems; they never forgive being blindsided in front of THEIR bosses (it's Day 14's no-surprises rule, pointed upward).</li>
   </ul>`},
  {h:`Meetings and the 10-minute deck`,
   b:`<p>Presenting upward, you'll get 10 minutes of a 30-minute slot. Build for that:</p>
   <ul>
   <li>1️⃣ Slide 1 = the answer and the ask. If the meeting ended now, the decision could still happen.</li>
   <li>📊 One chart, one message — the chart's title states the finding ("Fails concentrated in one market"), not the dataset ("Fails by market").</li>
   <li>🅿️ Hostile question you can't answer? Park it honestly: "I don't know — I'll have it to you by Thursday." (Far stronger than improvising, and everyone knows it.)</li>
   <li>☕ And the biggest lever isn't in the room: <b>pre-wire</b> (Day 14). Big meetings go well when they were decided before they started.</li>
   </ul>`},
 ],
 words:[
  {w:`Pyramid principle`, d:`Answer first, then grouped reasons, then evidence. The executive-communication master rule.`},
  {w:`BLUF`, d:`"Bottom Line Up Front" — military shorthand for the same idea. Great for emails: first line = the point.`},
  {w:`RAG status`, d:`Red/Amber/Green project health. Only works if yellow is used honestly and early.`},
  {w:`The ask`, d:`What you need from the audience — a decision, money, air cover. Every upward communication has one; state it.`},
  {w:`Parking`, d:`Deferring a question honestly with a committed follow-up date, instead of improvising an answer.`}],
 quiz:[
  {q:`The pyramid principle says to open with…`,
   o:[`background and history`, `the answer/recommendation itself`, `an icebreaker`], a:1,
   why:`Headline first. Details exist for whoever wants them — and interruptions can't hurt you.`},
  {q:`Your project hit a real problem. You…`,
   o:[`keep it green and quietly fix it`, `flag yellow early, WITH a recovery plan attached`, `wait for the boss to notice`], a:1,
   why:`Early honest yellow = trust. Green-green-RED = a reputation that never fully recovers.`},
  {q:`Asked something you don't know in front of executives:`,
   o:[`improvise confidently`, `"I don't know — you'll have it by Thursday," then deliver Thursday`, `change the subject`], a:1,
   why:`Honest parking with a kept promise reads as strength. Improvised wrong answers read forever.`}]},

{n:24, e:`🧭`, t:`Decisions and delegation`, tag:`Doors that swing back — and outcomes, not task lists`,
 deep:`week-4-executive-playbook/day-24-leadership-and-decision-frameworks.md`,
 imagine:{e:`🚪`, h:`Imagine two kinds of doors`,
  p:`Some doors swing both ways — walk through, dislike the room, walk back. Others lock behind you. Most decisions are swing-doors: a dashboard layout, a pilot with one client — if wrong, adjust. A few lock: a public API promise (Day 15!), a platform choice, a key hire. The most common executive mistake isn't bad judgment — it's treating swing-doors with lock-door caution (everything slows to committee-speed) or lock-doors with swing-door speed (ouch).`},
 secs:[
  {h:`Sort by door, then act accordingly`,
   b:``,
   d:{type:`split`,
    a:{h:`🔄 Swing-door (most decisions)`, items:[`Reversible if wrong`,`Decide FAST, with ~70% of the information`,`Push the decision DOWN to the closest team`,`Cost of slow deciding exceeds cost of wrong deciding`]},
    b:{h:`🔒 Lock-door (the few)`, items:[`Hard or impossible to reverse`,`Slow down deliberately: options, data, devil's advocate`,`Decide at the right level, senior eyes on it`,`Examples: public API contracts, platform bets, key hires`]}},
   b2:`<div class="callout">💡 Add two upgrades: for lock-doors, run a <b>pre-mortem</b> ("it's next year and this failed — why?" — permission to voice doubts, catches blind spots). For every decision: name ONE decider, a date, and write it down (Day 14's decision log). Committees advise; a person decides.</div>`},
  {h:`Delegation: hand over outcomes, not chores`,
   b:`<p>You now deliver through others. Two ways to hand work over:</p>
   <ul>
   <li>📋 <b>Task list</b> (weak): "Do these ten things." You become the bottleneck for thing eleven; they learn compliance.</li>
   <li>🎯 <b>Outcome + guardrails</b> (strong): "Cut fail-related client calls 30% this quarter. Guardrails: within budget, compliance approves anything client-facing, flag surprises early. HOW is yours."</li>
   </ul>
   <p>People rise startlingly to owned outcomes — and calibrate the leash to the person AND the task: a veteran gets headline-only check-ins; someone new to the domain gets weekly coaching. Same person may need different modes on different work; adjusting is the skill.</p>`},
  {h:`Feedback that lands, and your calendar truth`,
   b:`<p><b>Feedback recipe (SBI):</b> Situation → Behavior → Impact. "In Monday's client meeting (S), you gave a date we haven't committed to (B); the client now expects March and sales is escalating (I)." Specific, factual, prompt — infinitely better than vague "be more careful," and it works for praise too.</p>
   <p><b>Your calendar is your real strategy.</b> Claiming clients matter while spending 2% of your week with them means your actual strategy is internal meetings. Audit monthly; protect thinking time like a client meeting; keep asking "what can ONLY I do?" — everything else is delegation fuel.</p>`},
 ],
 words:[
  {w:`Two-way door`, d:`A reversible decision. Decide fast, delegate freely, adjust if wrong.`},
  {w:`One-way door`, d:`Hard-to-reverse. Slow down, gather options, decide senior, eyes open.`},
  {w:`Pre-mortem`, d:`Before a big commitment: "assume it failed — why?" Structured permission for doubts.`},
  {w:`Guardrails`, d:`The boundaries inside which a team decides freely: budget, approvals, escalation triggers.`},
  {w:`SBI`, d:`Situation-Behavior-Impact — the feedback recipe that's specific and factual instead of vague.`},
  {w:`Decider`, d:`The ONE named person who makes a given decision. Committees advise; a person decides.`}],
 quiz:[
  {q:`A dashboard layout choice is stuck in week three of committee review. Diagnosis?`,
   o:[`Healthy rigor`, `A swing-door being treated like a lock-door — decide fast and adjust if wrong`, `Needs more stakeholders`], a:1,
   why:`Reversible + delayed = pure cost. Save the deliberation for doors that lock (like public API promises).`},
  {q:`Strong delegation hands over…`,
   o:[`a detailed task list`, `an outcome plus guardrails — the HOW belongs to them`, `whatever's left over`], a:1,
   why:`Outcomes grow owners; task lists grow bottlenecks (you).`},
  {q:`Useful feedback sounds like…`,
   o:[`"be more careful in meetings"`, `"In Monday's meeting (S), you promised an uncommitted date (B); client now expects March (I)"`, `"nice job lately"`], a:1,
   why:`SBI: specific situation, observable behavior, real impact. Landable, actionable, fair.`}]},

{n:25, e:`💼`, t:`Clients and the money machine`, tag:`How deals work — and how to say no to a giant`,
 deep:`week-4-executive-playbook/day-25-client-engagement-and-commercial-acumen.md`,
 imagine:{e:`🧾`, h:`Imagine a hotel where five guests book entire floors — for decades`,
  p:`This hotel has no walk-ins. Each guest negotiates for a year before checking in, stays 10+ years, pays millions — and every few years invites rival hotels to bid for their floor. Keeping a guest is worth more than winning a new one, and every detail (yes, including the app — YOUR app) gets scored at rebid time. Welcome to custody economics.`},
 secs:[
  {h:`How the money actually works`,
   b:`<p>A big custody deal earns roughly like this: a tiny percentage on assets guarded (Day 1's small-slice-huge-pizza), fees per transaction, currency-exchange income, and lending income. Sounds enormous — but the costs (armies of ops people, technology, 100-market networks) eat most of it. <b>Margins are thin.</b></p>
   <p>Two consequences shape your whole job:</p>
   <ul>
   <li>📉 Fees get squeezed at every renewal → the winning lever is <b>cost-to-serve</b>: every phone call your products replace with self-service drops straight to the bottom line. THIS is digital's provable money story (Day 26 makes it numeric).</li>
   <li>🤝 One giant client = tens of millions a year across many services → their escalations reach the C-suite by lunch, and losing one is a very bad year.</li>
   </ul>`},
  {h:`Your role in winning and keeping`,
   b:``,
   d:{type:`flow`, steps:[
    {e:`📋`, t:`The RFP`, s:`Digital sections are SCORED. Own a library of great, TRUE answers.`},
    {e:`🎬`, t:`The demo`, s:`Rehearsed, using scenarios from THE CLIENT's world. Demos lose deals more often than features do.`},
    {e:`🔍`, t:`Due diligence`, s:`They visit and check the demo was real. Truth in step 1 pays off here.`},
    {e:`📅`, t:`Quarterly reviews`, s:`Your slot = adoption evidence and what's next. Proof, not promises.`},
    {e:`🔁`, t:`The rebid, years later`, s:`Daily product experience quietly decided this long ago.`}]},
   b2:`<div class="callout">💡 Watch for slow leaks: client health rarely fails suddenly. Falling logins, key users quietly leaving, QBRs delegated downward, repetitive complaint tickets — 18 months later, "surprise" rebid. Your usage data (Day 15's telemetry!) is the earliest smoke detector in the firm. Watch it and tell the relationship manager early.</div>`},
  {h:`Saying no to a top-10 client (without losing them)`,
   b:`<p>Your #4 client demands a custom feature only they want. The script:</p>
   <ul>
   <li>👂 <b>Dig for the underlying need</b> — visit, listen fully. Often the real job can be served a standard way.</li>
   <li>💰 <b>Cost it honestly, out loud</b> — "that's the deadline-alerts release for ALL clients, delayed two quarters." Now your no is a trade-off they can respect, not a rejection.</li>
   <li>🎁 <b>Offer the adjacent yes</b> — configuration instead of custom code; an API so THEY build their last mile (Day 15); a paid professional-services route if it's truly worth it to them.</li>
   <li>🤝 <b>Pre-align your own house</b> (Day 14) — they WILL retry the ask above your head; the bank must answer identically.</li>
   </ul>
   <p>Why the line matters: custom code per client is how platforms die — 30 bespoke versions, each blocking every upgrade. Configuration and APIs are how you say yes safely. You are this line's guardian.</p>`},
 ],
 words:[
  {w:`RFP`, d:`The formal months-long questionnaire clients use to choose custodians. Your digital answers get scored.`},
  {w:`QBR`, d:`Quarterly Business Review — the regular health-check meeting with a big client.`},
  {w:`Cost-to-serve`, d:`What it costs to service a client. The margin lever your self-service products directly move.`},
  {w:`Client health`, d:`Early-warning signals (usage, tickets, engagement) that predict renewal risk 18 months out.`},
  {w:`Bespoke`, d:`Custom-built for one client. Tempting, occasionally right, usually the start of platform death.`},
  {w:`Relationship manager`, d:`The bank's owner of a client relationship — your ally for commercial context and early warnings.`}],
 quiz:[
  {q:`Digital's most provable money story in a thin-margin business:`,
   o:[`charging users for the portal`, `cutting cost-to-serve — self-service replacing expensive manual handling`, `selling ads`], a:1,
   why:`Fees compress at renewals; costs are the controllable lever, and your products move it measurably.`},
  {q:`The earliest sign a big client may leave in 18 months:`,
   o:[`an angry letter`, `quiet decline: falling usage, key users gone, delegated QBRs, repetitive tickets`, `a press release`], a:1,
   why:`Attrition leaks before it bursts — and your telemetry sees the leak first. Report it early.`},
  {q:`Top client demands a just-for-them feature. Best answer shape:`,
   o:[`always yes — they're huge`, `understand the need, show the trade-off cost, offer configuration/API alternatives`, `flat no`], a:1,
   why:`The costed no with an adjacent yes keeps client AND platform. Bespoke sprawl kills platforms slowly.`}]},

{n:26, e:`📈`, t:`Proving it with numbers`, tag:`The metrics tree — from north star to Monday's fixes`,
 deep:`week-4-executive-playbook/day-26-metrics-okrs-and-running-the-business.md`,
 imagine:{e:`🩺`, h:`Imagine a doctor with one big question and many small tests`,
  p:`"Is this patient healthy?" is answered through measurements that ladder up: blood pressure, pulse, tests — each meaningful, together conclusive. Your product portfolio needs the same: one big question at the top ("is digital making custody better?"), supported by a tree of measurable vitals. Without it you're asking for budget with anecdotes — and losing to whoever brings numbers.`},
 secs:[
  {h:`Build the tree`,
   b:``,
   d:{type:`stack`, layers:[
    {e:`⭐`, t:`North star: % of client needs met self-service`, s:`One number that captures the mission (yours may differ — pick it deliberately)`},
    {e:`🌿`, t:`Branches: adoption · engagement · quality · value`, s:`Are they using it? Does it work? What does it save?`},
    {e:`🍃`, t:`Leaves: the numbers teams move weekly`, s:`Activation rate · alert-response speed · task success · tickets deflected`}]},
   b2:`<div class="callout">💡 The tree's power: every team's Monday work connects visibly to the mission, and when an executive asks "why fund this?", you walk DOWN the tree with numbers instead of adjectives.</div>`},
  {h:`B2B metric traps (learn them before they bite)`,
   b:`<ul>
   <li>🎭 <b>Registered users is vanity.</b> 5,000 registered, 400 weekly-active: the truth is 400. Measure <b>active per entitled</b>.</li>
   <li>🐋 <b>Averages hide whales.</b> "Usage up 30%!" — one giant client onboarded a team; three mid-size clients quietly went dark (Day 25's smoke!). Always segment by client.</li>
   <li>🔁 <b>High usage can mean PAIN.</b> Twenty daily visits to the fails screen might mean twenty problems. Pair usage numbers with outcome numbers (task success, time-to-resolve).</li>
   <li>💵 <b>Deflection math is your budget weapon:</b> a service call costs real money (say ~$15 fully loaded); alerts + self-service deflecting 40,000 calls/year = $600k/year, recurring. Auditable, renewable, unbeatable in a funding meeting (Day 25's cost-to-serve, quantified).</li>
   </ul>`},
  {h:`OKRs: the tree, turned into quarterly promises`,
   b:`<p>An <b>Objective</b> is a direction ("clients resolve issues without calling us"); <b>Key Results</b> are the season's proof-numbers ("deflection 22%→30% · alert response halved · zero critical-alert misses"). Two rules that keep them honest:</p>
   <ul>
   <li>🎯 KRs are <b>outcomes, not shipping lists</b>. "Launch the alerts feature" is a task; "alert-response time halved" is a result. Ship-and-nobody-uses-it = zero.</li>
   <li>📉 <b>Missing an ambitious KR honestly beats gaming a safe one.</b> The review question is "what did we learn and change?", not "who do we blame?"</li>
   </ul>
   <p>Close the loop in business reviews pyramid-style (Day 23): headline, three drivers, risks with plans, the ask. Numbers first, story around them.</p>`},
 ],
 words:[
  {w:`North star metric`, d:`The single number that best captures your product's mission. The top of the tree.`},
  {w:`Vanity metric`, d:`A number that flatters but doesn't inform decisions (registered users, raw page views).`},
  {w:`Active per entitled`, d:`Of people who COULD use it, how many DO. The honest adoption ratio.`},
  {w:`Deflection`, d:`A need met by self-service instead of a human call — countable, costable, your budget weapon.`},
  {w:`OKR`, d:`Objective (direction) + Key Results (this quarter's proof-numbers). Outcomes, never task lists.`},
  {w:`Segmentation`, d:`Splitting metrics by client/persona so whales can't hide the truth in averages.`}],
 quiz:[
  {q:`5,000 registered users, 400 weekly active. Your honest adoption story is…`,
   o:[`"5,000 users!"`, `400 weekly-active — and measured against how many are entitled`, `the average of both`], a:1,
   why:`Registered is vanity; active-per-entitled is truth. Executives eventually find out which you fed them.`},
  {q:`Total usage +30% this quarter. Before celebrating, you…`,
   o:[`celebrate`, `segment by client — a whale can mask three clients going quiet (attrition smoke!)`, `raise targets`], a:1,
   why:`Averages hide whales. Day 25's early-warning system depends on segmented eyes.`},
  {q:`A strong Key Result sounds like…`,
   o:[`"launch the new alerts module"`, `"average alert-response time halved, zero critical misses"`, `"work very hard on alerts"`], a:1,
   why:`Outcomes, not shipping lists. Shipped-but-unused counts for exactly zero.`}]},

{n:27, e:`🛡️`, t:`Risk, rules and shipping safely`, tag:`Why banks check twice — and how to move fast anyway`,
 deep:`week-4-executive-playbook/day-27-risk-compliance-and-regulation.md`,
 imagine:{e:`✈️`, h:`Imagine why planes are safe`,
  p:`Aviation isn't safe because pilots are brave — it's checklists, co-pilots cross-checking, and independent inspectors. Layers. Banking safety works identically, and here's the part new product leaders miss: <b>you are the pilot, not the passenger</b>. The checking layers double-check — but the first responsibility for your product's risks is yours. Own that, and the layers become allies; dodge it, and they become gates.`},
 secs:[
  {h:`The three layers (and your seat)`,
   b:``,
   d:{type:`stack`, layers:[
    {e:`✈️`, t:`Layer 1: YOU and your teams`, s:`Run the product = own its risks. Wrong data shown, permissions bug, missed alert — yours first.`},
    {e:`🧑‍✈️`, t:`Layer 2: Risk and Compliance`, s:`Set the rules, challenge you, cross-check. Advisers and inspectors, not owners of YOUR risk.`},
    {e:`🔍`, t:`Layer 3: Internal Audit`, s:`Independently checks layers 1 and 2. Reports to the very top.`}]},
   b2:`<div class="callout">💡 The mindset shift: "compliance owns risk" is the amateur view. The professional view: <i>I own my product's risks; the layers help me not miss any.</i> Bosses can hear the difference in one meeting.</div>`},
  {h:`Your product's real risks (name them like an owner)`,
   b:``,
   d:{type:`grid`, cards:[
    {e:`🔢`, t:`Wrong data shown`, s:`Clients act on your screens. Wrong number = misstatement (why lineage matters — Day 20)`},
    {e:`🔓`, t:`A permissions slip`, s:`One client sees another's data = reportable breach (why Day 11 is sacred)`},
    {e:`🔕`, t:`A missed critical alert`, s:`The €12m story (Day 5). Notification proof = your receipts (Day 12)`},
    {e:`⛔`, t:`The portal goes down`, s:`At month-end or a deadline, an outage is a client crisis with notification duties`},
    {e:`🧨`, t:`A change breaks things`, s:`Most incidents follow a change — hence careful releases (below)`},
    {e:`🤖`, t:`AI says something false`, s:`Day 21's hallucination — grounded + supervised, always`}]}},
  {h:`Shipping fast INSIDE the rules`,
   b:`<p>Banks have change controls (approvals, freeze windows) because most incidents follow a change. Good teams move quickly anyway, using tricks that de-risk change itself:</p>
   <ul>
   <li>🎛️ <b>Feature flags:</b> ship OFF, turn on gradually, kill-switch instantly — releasing and launching become separate, reversible steps (two-way doors! Day 24).</li>
   <li>🌊 <b>Progressive rollout:</b> 2 friendly clients → 20 → everyone. Problems surface small.</li>
   <li>🧯 <b>Pre-agreed rollback:</b> "if X breaks, revert in minutes" — written BEFORE launch. Approvers approve faster when reversal is proven.</li>
   </ul>
   <p>And the eternal rule for anything client-facing and new (remember Day 21's AI walkthrough): involve compliance at the <b>idea</b> stage. Week 0, one pager, "here's the concept and its guardrails — what would make it approvable?" That question turns months of late-stage blockage into weeks of co-design (Day 14's currency: no surprises).</p>`},
 ],
 words:[
  {w:`Three lines of defense`, d:`Business owns its risks → risk/compliance set rules and challenge → audit independently checks. You're line one.`},
  {w:`Operational risk`, d:`Risk from things breaking or humans erring — the family your product risks belong to.`},
  {w:`Feature flag`, d:`A remote on/off switch per feature: gradual launch, instant rollback.`},
  {w:`Progressive rollout`, d:`Releasing to a few clients first, then widening. Problems surface small.`},
  {w:`Incident`, d:`Something went wrong for real. Fix, notify honestly (clients/regulators when required), learn blame-free.`},
  {w:`Change freeze`, d:`Periods (month-end, big deadlines) when changes are barred — because most incidents follow changes.`}],
 quiz:[
  {q:`Who owns the risk of a permissions bug in YOUR portal?`,
   o:[`Compliance`, `You and your teams — line one. The other layers check and challenge.`, `The client`], a:1,
   why:`Run the product = own its risks. The layers are cross-checkers, not risk-owners for you.`},
  {q:`Feature flags matter in a bank because they…`,
   o:[`impress engineers`, `make launches gradual and instantly reversible — safe speed inside change controls`, `hide features from auditors`], a:1,
   why:`They turn a lock-door launch into a swing-door one. Approvals come faster when rollback is proven.`},
  {q:`The best moment to involve compliance in a new client-facing idea:`,
   o:[`after building, before launch`, `at the concept stage — "what would make this approvable?"`, `only if they ask`], a:1,
   why:`Week-0 involvement = co-designers. Week-20 surprise = blockers. Their currency is no surprises.`}]},

{n:28, e:`👥`, t:`Building teams across the world`, tag:`Structure, hubs and hiring — the multiplier work`,
 deep:`week-4-executive-playbook/day-28-building-and-scaling-teams.md`,
 imagine:{e:`🎼`, h:`Imagine conducting an orchestra spread across four cities`,
  p:`Strings in Boston, brass in Hyderabad, percussion in Kraków, woodwinds in Bangalore — playing one symphony across time zones. That's a modern bank's product organization. The conductor's real work isn't playing an instrument; it's structure (who sits in which section), trust (sections that never see each other must still play together) and tempo (rituals that keep time). Your ~60 people produce what your STRUCTURE lets them produce.`},
 secs:[
  {h:`Shape teams around client journeys, not org charts`,
   b:``,
   d:{type:`grid`, cards:[
    {e:`🌊`, t:`Journey teams`, s:`One team owns "track my trades," another "corporate actions," another "documents." Long-lived owners (Day 9!), each with PM + engineers + design.`},
    {e:`🧱`, t:`A platform team`, s:`Owns what every journey team shares: permissions, alerts pipeline, design system. Their customers are the other teams.`},
    {e:`🎓`, t:`Enabling specialists`, s:`Float where needed: accessibility, data, research. Teach, then move on.`}]},
   b2:`<div class="callout">💡 The test of good structure: how many OTHER teams must a team talk to before shipping? More hand-offs = slower + more misunderstandings. Restructure to cut hand-offs, not to redraw boxes.</div>`},
  {h:`Global hubs, honestly`,
   b:`<p>Big banks run major centers in Boston, Hyderabad, Bangalore, Kraków and beyond — deep talent, follow-the-sun coverage. One failure mode ruins it: <b>HQ decides, satellites execute.</b> Second-class dynamics demoralize brilliant people and slowly hollow out delivery. The antidotes:</p>
   <ul>
   <li>🏆 <b>Whole journeys owned by hubs</b> — a Hyderabad team OWNS corporate-actions experience end-to-end (PM, design, engineering), not just tickets from Boston.</li>
   <li>🕐 <b>Overlap hours + writing culture</b> — a few shared hours for live conversation; decisions written down (Day 14's log) so nobody wakes up excluded.</li>
   <li>✈️ <b>Deliberate visits</b> — leaders visit hubs, hub leaders present to executives. Presence signals partnership.</li>
   </ul>
   <p>Vendors and consultancies extend capacity fine — with one hard line: <b>never outsource product judgment.</b> Rent hands, never the brain. And insist on knowledge transfer, or it walks out at contract end.</p>`},
  {h:`Hiring and rituals`,
   b:`<p><b>Hire in multiplier order:</b> seniors first (they set standards and make every later hire better), then builders against the biggest bottleneck, then juniors into a structure that can grow them. Tempting shortcut — "five juniors fast, they're cheap" — costs a year of drift.</p>
   <p><b>Rituals carry culture across oceans:</b> demo days (every team shows REAL working software monthly — accountability + celebration + cross-pollination in one hour), ops-shadowing rotations (Day 22's trick, institutionalized), blame-free incident reviews (Day 27), and skip-levels (you, their team member, no manager between — early-warning gold).</p>`},
 ],
 words:[
  {w:`Journey team`, d:`A long-lived team owning one client journey end-to-end — the stable owner-team of Day 9.`},
  {w:`Platform team`, d:`The team whose product is shared internal capability (permissions, alerts, design system) serving other teams.`},
  {w:`GCC`, d:`Global Capability Center — a bank's major delivery hub (Hyderabad, Bangalore, Kraków…). Talent centers, not "outsourcing."`},
  {w:`Hand-off`, d:`Work passing between teams. Each one adds delay and misunderstanding — structure to minimize them.`},
  {w:`Demo day`, d:`Monthly ritual: teams show real working software. Accountability, celebration and alignment in one.`},
  {w:`Skip-level`, d:`Meeting your manager's reports directly, no manager present. How truth reaches you early.`}],
 quiz:[
  {q:`The best test of an org structure:`,
   o:[`how impressive the chart looks`, `how FEW other teams each team needs before it can ship`, `how many managers exist`], a:1,
   why:`Hand-offs are where speed and truth die. Structure to minimize them.`},
  {q:`The classic global-team failure is…`,
   o:[`time zones existing`, `HQ deciding while hubs "just execute" — second-class dynamics`, `too many holidays`], a:1,
   why:`The fix: hubs OWN whole journeys, overlap hours, written decisions, real visits.`},
  {q:`What must never be outsourced?`,
   o:[`testing`, `product judgment — deciding WHAT to build and WHY`, `documentation`], a:1,
   why:`Rent hands when needed; never rent the brain. Judgment is the asset your teams compound.`}]},

{n:29, e:`🪜`, t:`Your career: VP and beyond`, tag:`How promotion really works — and interviews at this level`,
 deep:`week-4-executive-playbook/day-29-path-to-svp-and-interview-prep.md`,
 imagine:{e:`🏛️`, h:`Imagine a jury that decides your case in 5 minutes — without you in the room`,
  p:`Once a year, senior leaders gather to compare promotion candidates. Your case gets minutes, presented by someone else, judged against other candidates. Verdicts hinge on the written evidence and on who speaks up for you. Unfair? Somewhat. Universal? Completely. So build the two things juries respond to: an evidence file, and an advocate in the room.`},
 secs:[
  {h:`Evidence and advocates`,
   b:`<ul>
   <li>📁 <b>The brag file (start this week, 20 min/month):</b> every win with NUMBERS — "deflection 22→31%, ~$540k/yr" — plus praise emails and scope changes. December-you will remember nothing; the file remembers everything, and its numbers come straight from your metrics tree (Day 26).</li>
   <li>🎤 <b>A sponsor, not just mentors.</b> A mentor advises you over coffee; a <b>sponsor spends their own credibility advocating for you in that room</b>. You can't ask for sponsorship like a favor — you earn it by making a senior leader's big priority succeed, visibly, more than once. (It's Day 14's currency game, played upward.)</li>
   <li>📏 <b>The bar is comparative:</b> not "did well this year" but "stronger case than the others on the slate." Distinctive scope — the cross-team thing only you did — beats excellent delivery of the expected.</li>
   </ul>`},
  {h:`What the next level actually looks like`,
   b:``,
   d:{type:`split`,
    a:{h:`🧗 SVP behaviors (the next room)`, items:[`DEFINES which problems matter for the business`,`Horizon: 2–3 years`,`Known outside the firm (industry forums, client executives)`,`EXPORTS leaders — alumni now lead elsewhere`,`Trusted broker between departments`]},
    b:{h:`🧱 VP behaviors (strong today)`, items:[`Solves hard problems handed down`,`Horizon: 2–4 quarters`,`Known inside the firm`,`Builds a strong team`,`Manages stakeholders well`]},},
   b2:`<div class="callout">💡 Self-audit twice a year: one sentence of EVIDENCE per row on the left. Empty rows = your development plan, pre-written.</div>`},
  {h:`Interviews at this level (internal moves count too)`,
   b:`<p>Senior interviews are evidence-based: "tell me about a time you actually..." Prepare once, use for years:</p>
   <ul>
   <li>📖 <b>Ten true stories</b>, each told in 2 minutes as Situation → Task → Action → Result-with-numbers, plus one honest "what I'd do differently." Cover: a turnaround, a conflict resolved, a failure and its lessons, a person you grew, an unpopular right call, a client save.</li>
   <li>🧠 For scenario questions, <b>reason with frameworks out loud</b> — segment the users (Day 10), size the trade-off (Day 9), reversible or not (Day 24). They're hiring your thinking, not trivia recall.</li>
   <li>❓ <b>Your questions signal your level:</b> "What decision rights does this role hold?" · "What's the operating-model tension I'd inherit?" (Day 9) · "Who are this role's three key partners and what do they currently want that they're not getting?" (Day 14). That's VP-grade thinking, out loud.</li>
   </ul>`},
 ],
 words:[
  {w:`Calibration`, d:`The comparative annual process where leaders rank candidates across teams. Where promotions are actually decided.`},
  {w:`Sponsor`, d:`A senior leader who spends their OWN credibility advocating for you in rooms you're not in. Earned, not requested.`},
  {w:`Brag file`, d:`Your running evidence log: wins with numbers, praise, scope. 20 minutes monthly; priceless annually.`},
  {w:`Scope`, d:`The size and ambiguity of what you're trusted to own. Growing it (visibly) IS the promotion case.`},
  {w:`STAR`, d:`Situation, Task, Action, Result — the 2-minute true-story format for evidence-based interviews.`}],
 quiz:[
  {q:`A sponsor differs from a mentor because a sponsor…`,
   o:[`is more senior`, `spends their own credibility advocating for you in the decision room`, `meets you weekly`], a:1,
   why:`Mentors advise; sponsors act — and promotion rooms run on advocates plus evidence.`},
  {q:`The promotion bar at big companies is…`,
   o:[`"had a good year"`, `comparative: a stronger case than the other candidates on the slate`, `years of service`], a:1,
   why:`Calibration compares. Distinctive scope + numbers + an advocate is what wins comparisons.`},
  {q:`The best interview preparation at this level:`,
   o:[`memorizing custody trivia`, `ten true 2-minute stories with numbers, plus frameworks you reason with out loud`, `rehearsing buzzwords`], a:1,
   why:`Evidence-based interviews reward prepared truth and visible thinking, not recall.`}]},

{n:30, e:`🏁`, t:`The whole machine — one story`, tag:`Follow one trade through everything you now know`,
 deep:`week-4-executive-playbook/day-30-capstone-the-full-system.md`,
 imagine:{e:`🛰️`, h:`Imagine watching the whole city from above — and recognizing every street`,
  p:`Thirty days ago this was fog. Today, fly over the whole city one last time and watch a single real scenario move through every district you've learned. If you can retell today's story out loud — to a friend, a whiteboard, a mirror — you understand this business better than most people inside it. Because you know how it CONNECTS.`},
 secs:[
  {h:`One trade's incredible journey`,
   b:`<p>Monday, 10am. A pension fund's manager buys <b>500,000 shares of ACME ($15m)</b>. Watch every day of your journey light up:</p>`,
