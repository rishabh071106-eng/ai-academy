<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My 30-Day Journey — State Street from Zero</title>
<style>
  :root{
    --paper:#f2f5f8; --card:#ffffff; --ink:#1b2a3d; --ink-soft:#516378; --line:#dbe3ea;
    --navy:#0d3b66; --navy-deep:#092a4a; --teal:#0f8b8d; --gold:#e3a92c; --good:#1d8a4e; --bad:#c0392b;
    --w1:#0d3b66; --w2:#0f8b8d; --w3:#5b4ea8; --w4:#a84e5b;
    --radius:14px; --shadow:0 2px 10px rgba(13,59,102,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#0e1622; --card:#182435; --ink:#e8eef5; --ink-soft:#9fb0c3; --line:#2a3a4f;
      --navy:#7db3e8; --navy-deep:#0a1826; --teal:#3ec6c8; --gold:#f0be52; --good:#4fc47f; --bad:#e8705f;
      --w1:#4f8fd0; --w2:#3ec6c8; --w3:#9a8fe0; --w4:#d98795; --shadow:0 2px 10px rgba(0,0,0,.35); }
  }
  :root[data-theme="dark"]{ --paper:#0e1622; --card:#182435; --ink:#e8eef5; --ink-soft:#9fb0c3; --line:#2a3a4f;
      --navy:#7db3e8; --navy-deep:#0a1826; --teal:#3ec6c8; --gold:#f0be52; --good:#4fc47f; --bad:#e8705f;
      --w1:#4f8fd0; --w2:#3ec6c8; --w3:#9a8fe0; --w4:#d98795; --shadow:0 2px 10px rgba(0,0,0,.35); }
  :root[data-theme="light"]{ --paper:#f2f5f8; --card:#ffffff; --ink:#1b2a3d; --ink-soft:#516378; --line:#dbe3ea;
      --navy:#0d3b66; --navy-deep:#092a4a; --teal:#0f8b8d; --gold:#e3a92c; --good:#1d8a4e; --bad:#c0392b;
      --w1:#0d3b66; --w2:#0f8b8d; --w3:#5b4ea8; --w4:#a84e5b; --shadow:0 2px 10px rgba(13,59,102,.08); }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);
       font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
       font-size:17px;line-height:1.65}
  h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif;letter-spacing:.1px}
  h1{text-wrap:balance} h2{text-wrap:balance}
  button{font:inherit;cursor:pointer}
  a{color:var(--teal)}

  /* ---------- top bar ---------- */
  .top{position:sticky;top:0;z-index:20;background:var(--navy-deep);color:#fff;box-shadow:var(--shadow)}
  .top-in{max-width:880px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px}
  .top .logo{font-family:Georgia,serif;font-size:18px;font-weight:700;white-space:nowrap}
  .top .logo span{color:var(--gold)}
  .pbar{flex:1;height:10px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden}
  .pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));border-radius:99px;transition:width .5s ease}
  .pcount{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;color:#cfe0ef}

  .wrap{max-width:880px;margin:0 auto;padding:22px 18px 90px}

  /* ---------- hero ---------- */
  .hero{background:linear-gradient(150deg,var(--navy) 0%,var(--navy-deep) 90%);color:#fff;border-radius:20px;
        padding:34px 30px;margin-bottom:26px;position:relative;overflow:hidden}
  .hero::after{content:"🏦";position:absolute;right:-10px;bottom:-26px;font-size:130px;opacity:.14;transform:rotate(-8deg)}
  .hero .kick{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700;font-family:system-ui,sans-serif}
  .hero h1{margin:10px 0 8px;font-size:clamp(26px,5vw,38px);line-height:1.15}
  .hero p{margin:0;max-width:56ch;color:#d9e6f2;font-size:16px}
  .hero .cta{margin-top:18px;display:inline-block;background:var(--gold);color:#20293a;border:none;border-radius:99px;
             padding:12px 26px;font-weight:700;font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
  .hero .cta:active{transform:translateY(2px);box-shadow:none}

  /* ---------- journey map ---------- */
  .island{border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);margin:20px 0;overflow:hidden;border-top:6px solid var(--wc)}
  .island-head{padding:16px 20px 6px}
  .island-head .wk{font-size:11.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--wc)}
  .island-head h2{margin:4px 0 2px;font-size:21px}
  .island-head p{margin:0 0 8px;color:var(--ink-soft);font-size:14.5px}
  .nodes{display:flex;flex-direction:column;padding:6px 12px 16px}
  .node{display:flex;align-items:center;gap:14px;padding:11px 10px;border-radius:12px;border:none;background:none;text-align:left;width:100%}
  .node:hover{background:color-mix(in srgb, var(--wc) 8%, transparent)}
  .node .dot{width:46px;height:46px;min-width:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
             font-size:21px;background:color-mix(in srgb, var(--wc) 14%, var(--card));border:2.5px solid var(--wc);position:relative}
  .node.done .dot{background:var(--wc);border-color:var(--wc)}
  .node.done .dot::after{content:"✓";position:absolute;right:-4px;bottom:-4px;background:var(--good);color:#fff;
             width:18px;height:18px;border-radius:50%;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid var(--card)}
  .node.next .dot{animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--wc) 45%, transparent)}50%{box-shadow:0 0 0 9px transparent}}
  @media (prefers-reduced-motion: reduce){ .node.next .dot{animation:none} .pbar i{transition:none} }
  .node .nt{flex:1}
  .node .nt b{display:block;font-size:16px;color:var(--ink)}
  .node .nt span{display:block;font-size:13.5px;color:var(--ink-soft)}
  .node .go{font-size:13px;font-weight:700;color:var(--wc);white-space:nowrap}
  .node.next .go{background:var(--wc);color:#fff;border-radius:99px;padding:6px 14px}

  /* ---------- lesson ---------- */
  .crumb{display:inline-flex;align-items:center;gap:8px;background:none;border:1.5px solid var(--line);color:var(--ink-soft);
         border-radius:99px;padding:7px 16px;font-size:14px;margin-bottom:16px}
  .crumb:hover{border-color:var(--teal);color:var(--teal)}
  .lesson-head{border-radius:20px;padding:28px 26px;color:#fff;background:linear-gradient(140deg,var(--wc),color-mix(in srgb,var(--wc) 55%, #000));margin-bottom:22px}
  .lesson-head .day{font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;opacity:.85;font-family:system-ui,sans-serif}
  .lesson-head h1{margin:8px 0 6px;font-size:clamp(24px,4.5vw,32px);line-height:1.18}
  .lesson-head .em{font-size:44px;line-height:1;display:block;margin-bottom:8px}
  .lesson-head p{margin:0;font-size:16.5px;opacity:.93;max-width:58ch}

  .imagine{background:color-mix(in srgb, var(--gold) 13%, var(--card));border:1.5px solid color-mix(in srgb, var(--gold) 45%, transparent);
           border-radius:var(--radius);padding:20px 22px;margin:18px 0;display:flex;gap:16px}
  .imagine .big{font-size:40px;line-height:1.1}
  .imagine h3{margin:0 0 6px;font-size:17px;color:color-mix(in srgb, var(--gold) 60%, var(--ink))}
  .imagine p{margin:0;font-size:16px}

  .sec{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;margin:18px 0}
  .sec h2{margin:0 0 10px;font-size:20px;color:var(--wc)}
  .sec p{margin:9px 0;max-width:66ch}
  .sec ul{margin:8px 0;padding-left:22px;max-width:64ch}
  .sec li{margin:6px 0}
  .sec b{color:var(--ink)}
  .callout{border-left:4px solid var(--teal);background:color-mix(in srgb, var(--teal) 8%, var(--card));
           padding:12px 16px;border-radius:8px;margin:12px 0;font-size:15.5px}

  /* diagram widgets */
  .flow{display:flex;gap:0;overflow-x:auto;padding:14px 4px;align-items:stretch}
  .fstep{min-width:128px;flex:1;background:color-mix(in srgb, var(--wc) 9%, var(--card));border:1.5px solid color-mix(in srgb, var(--wc) 35%, transparent);
         border-radius:12px;padding:12px 10px;text-align:center;position:relative;margin-right:34px}
  .fstep:last-child{margin-right:0}
  .fstep::after{content:"➜";position:absolute;right:-27px;top:50%;transform:translateY(-50%);color:var(--wc);font-size:17px}
  .fstep:last-child::after{content:none}
  .fstep .fe{font-size:27px;display:block}
  .fstep .ft{font-weight:700;font-size:14px;display:block;margin:5px 0 2px;color:var(--ink)}
  .fstep .fs{font-size:12.5px;color:var(--ink-soft);display:block;line-height:1.45}

  .split{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
  @media(max-width:620px){.split{grid-template-columns:1fr}}
  .half{border-radius:12px;padding:14px 16px;border:1.5px solid var(--line)}
  .half.ha{background:color-mix(in srgb, var(--teal) 9%, var(--card));border-color:color-mix(in srgb, var(--teal) 40%, transparent)}
  .half.hb{background:color-mix(in srgb, var(--bad) 7%, var(--card));border-color:color-mix(in srgb, var(--bad) 30%, transparent)}
  .half h4{margin:0 0 8px;font-size:15px}
  .half ul{margin:0;padding-left:18px;font-size:14.5px}
  .half li{margin:5px 0}

  .stack{display:flex;flex-direction:column;gap:8px;margin:14px 0}
  .layer{display:flex;align-items:center;gap:14px;border-radius:12px;padding:12px 16px;
         background:color-mix(in srgb, var(--wc) 9%, var(--card));border:1.5px solid color-mix(in srgb, var(--wc) 30%, transparent)}
  .layer .le{font-size:26px}
  .layer .lt{font-weight:700;font-size:15px;display:block}
  .layer .ls{font-size:13.5px;color:var(--ink-soft);display:block}
  .stack .down{text-align:center;color:var(--wc);font-size:15px;margin:-3px 0}

  .cardgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
  .gcard{background:color-mix(in srgb, var(--wc) 8%, var(--card));border:1.5px solid color-mix(in srgb, var(--wc) 28%, transparent);
         border-radius:12px;padding:14px 12px;text-align:center}
  .gcard .ge{font-size:30px;display:block}
  .gcard .gt{font-weight:700;font-size:14px;display:block;margin:6px 0 3px}
  .gcard .gs{font-size:12.5px;color:var(--ink-soft);line-height:1.45;display:block}

  /* word chips */
  .words{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
  .word{border:1.5px solid var(--wc);background:none;border-radius:12px;padding:9px 14px;font-size:14.5px;color:var(--ink);text-align:left;max-width:100%}
  .word b{color:var(--wc)}
  .word .wd{display:none;margin-top:5px;font-size:14px;color:var(--ink-soft)}
  .word.open{background:color-mix(in srgb, var(--wc) 8%, var(--card))}
  .word.open .wd{display:block}
  .word .tap{font-size:11.5px;color:var(--ink-soft);margin-left:6px}
  .word.open .tap{display:none}

  /* quiz */
  .quiz .qq{margin:16px 0 8px;font-weight:700;font-size:16.5px}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:11px 15px;text-align:left;font-size:15.5px;color:var(--ink)}
  .opt:hover{border-color:var(--teal)}
  .opt.right{border-color:var(--good);background:color-mix(in srgb, var(--good) 12%, var(--card));font-weight:700}
  .opt.wrong{border-color:var(--bad);background:color-mix(in srgb, var(--bad) 10%, var(--card))}
  .why{display:none;margin:8px 0 0;font-size:14.5px;padding:10px 14px;border-radius:10px;background:color-mix(in srgb, var(--teal) 10%, var(--card));border-left:4px solid var(--teal)}
  .why.show{display:block}

  .finish{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:26px 0 10px}
  .done-btn{background:var(--good);color:#fff;border:none;border-radius:99px;padding:13px 30px;font-size:16.5px;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.2)}
  .done-btn:active{transform:translateY(2px);box-shadow:none}
  .done-btn[disabled]{background:var(--ink-soft);opacity:.6}
  .deep-link{font-size:14px;color:var(--ink-soft)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--navy-deep);color:#fff;
         padding:13px 26px;border-radius:99px;font-weight:700;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .3s;z-index:50}
  .toast.show{opacity:1}
  .navrow{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
  .navrow button{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:9px 18px;font-size:14px;color:var(--ink)}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="logo">🧭 Zero to <span>VP</span></div>
    <div class="pbar"><i id="pbarfill" style="width:0%"></i></div>
    <div class="pcount" id="pcount">0 / 30 days</div>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ---------------- state ---------------- */
const KEY='ssb-journey-v1';
let state; try{ state=JSON.parse(localStorage.getItem(KEY))||{done:{}}; }catch(e){ state={done:{}}; }
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
function doneCount(){ return Object.keys(state.done).length; }
function nextDay(){ for(let i=1;i<=30;i++){ if(!state.done[i]) return i; } return 30; }

const WEEKS=[
 {c:'var(--w1)', wk:'Week 1 · Days 1–7', t:'The Business', p:'What this giant bank actually does all day — in plain words.'},
 {c:'var(--w2)', wk:'Week 2 · Days 8–14', t:'Your Craft', p:'Being a product leader: what you build, for whom, and how.'},
 {c:'var(--w3)', wk:'Week 3 · Days 15–21', t:'The Tech', p:'APIs, events, data and AI — explained like you have never coded.'},
 {c:'var(--w4)', wk:'Week 4 · Days 22–30', t:'The Leader', p:'Your first 90 days, your bosses, your clients, your career.'},
];
const REPO='https://github.com/rishabh071106-eng/ai-academy/blob/claude/state-street-vp-bootcamp-wu710b/state-street-vp-bootcamp/';

/* ---------------- rendering helpers ---------------- */
function esc(s){ return s; }
function diagram(d){
  if(!d) return '';
  if(d.type==='flow') return '<div class="flow">'+d.steps.map(s=>
    '<div class="fstep"><span class="fe">'+s.e+'</span><span class="ft">'+s.t+'</span><span class="fs">'+(s.s||'')+'</span></div>').join('')+'</div>';
  if(d.type==='split') return '<div class="split">'+
    '<div class="half ha"><h4>'+d.a.h+'</h4><ul>'+d.a.items.map(i=>'<li>'+i+'</li>').join('')+'</ul></div>'+
    '<div class="half hb"><h4>'+d.b.h+'</h4><ul>'+d.b.items.map(i=>'<li>'+i+'</li>').join('')+'</ul></div></div>';
  if(d.type==='stack') return '<div class="stack">'+d.layers.map((l,i)=>
    (i?'<div class="down">▼</div>':'')+'<div class="layer"><span class="le">'+l.e+'</span><span><span class="lt">'+l.t+'</span><span class="ls">'+(l.s||'')+'</span></span></div>').join('')+'</div>';
  if(d.type==='grid') return '<div class="cardgrid">'+d.cards.map(c=>
    '<div class="gcard"><span class="ge">'+c.e+'</span><span class="gt">'+c.t+'</span><span class="gs">'+(c.s||'')+'</span></div>').join('')+'</div>';
  return '';
}
function weekOf(n){ return n<=7?0 : n<=14?1 : n<=21?2 : 3; }

function renderHome(){
  const nd=nextDay(), dc=doneCount();
  let h='<section class="hero"><div class="kick">A 30-day path · from zero</div>'+
    '<h1>Learn your new world,<br>one small day at a time.</h1>'+
    '<p>No finance background needed. Every day is a 15–20 minute story: one idea, one picture, a few new words, and a tiny quiz. By Day 30 you will understand the whole machine.</p>'+
    '<button class="cta" onclick="go('+nd+')">'+(dc===0?'Start Day 1 →':(dc>=30?'Journey complete! Revisit any day 🎉':'Continue Day '+nd+' →'))+'</button></section>';
  WEEKS.forEach((w,wi)=>{
    h+='<section class="island" style="--wc:'+w.c+'"><div class="island-head"><div class="wk">'+w.wk+'</div><h2>'+w.t+'</h2><p>'+w.p+'</p></div><div class="nodes">';
    DAYS.filter(d=>weekOf(d.n)===wi).forEach(d=>{
      const cls = state.done[d.n]?'done':(d.n===nd?'next':'');
      h+='<button class="node '+cls+'" onclick="go('+d.n+')"><span class="dot">'+d.e+'</span>'+
         '<span class="nt"><b>Day '+d.n+' — '+d.t+'</b><span>'+d.tag+'</span></span>'+
         '<span class="go">'+(state.done[d.n]?'Review':(d.n===nd?'Start':'Open'))+'</span></button>';
    });
    h+='</div></section>';
  });
  document.getElementById('app').innerHTML=h;
  window.scrollTo(0,0); refreshBar();
}

function renderDay(n){
  const d=DAYS.find(x=>x.n===n); if(!d){ renderHome(); return; }
  const w=WEEKS[weekOf(n)];
  let h='<button class="crumb" onclick="go(0)">← Back to my path</button>';
  h+='<div class="lesson-head" style="--wc:'+w.c+'"><span class="day">'+w.wk.split('·')[0]+' · Day '+d.n+' of 30 · ~15 min</span>'+
     '<span class="em">'+d.e+'</span><h1>'+d.t+'</h1><p>'+d.tag+'</p></div>';
  h+='<div class="imagine"><div class="big">'+d.imagine.e+'</div><div><h3>'+d.imagine.h+'</h3><p>'+d.imagine.p+'</p></div></div>';
  d.secs.forEach(s=>{ h+='<section class="sec" style="--wc:'+w.c+'"><h2>'+s.h+'</h2>'+(s.b||'')+diagram(s.d)+(s.b2||'')+'</section>'; });
  h+='<section class="sec" style="--wc:'+w.c+'"><h2>🗝️ New words today</h2><p>Tap a word to see what it means.</p><div class="words">'+
     d.words.map(x=>'<button class="word" onclick="this.classList.toggle(\'open\')"><b>'+x.w+'</b><span class="tap">tap</span><span class="wd">'+x.d+'</span></button>').join('')+'</div></section>';
  h+='<section class="sec quiz" style="--wc:'+w.c+'"><h2>✅ Quick check</h2><p>Pick an answer — you get instant feedback, and wrong guesses are free.</p>';
  d.quiz.forEach((q,qi)=>{
    h+='<div class="qq">'+(qi+1)+'. '+q.q+'</div><div class="opts">'+
       q.o.map((o,oi)=>'<button class="opt" onclick="answer(this,'+n+','+qi+','+oi+')">'+o+'</button>').join('')+'</div>'+
       '<div class="why" id="why-'+n+'-'+qi+'">💡 '+q.why+'</div>';
  });
  h+='</section>';
  h+='<div class="finish"><button class="done-btn" onclick="complete('+n+')">'+(state.done[n]?'Completed ✓ (tap to go on)':'I finished Day '+n+' ✓')+'</button>'+
     '<span class="deep-link">Want the full-depth version? <a href="'+REPO+d.deep+'" target="_blank" rel="noopener">Read the deep-dive chapter ↗</a></span></div>';
  h+='<div class="navrow">'+(n>1?'<button onclick="go('+(n-1)+')">← Day '+(n-1)+'</button>':'<span></span>')+
     (n<30?'<button onclick="go('+(n+1)+')">Day '+(n+1)+' →</button>':'')+'</div>';
  document.getElementById('app').innerHTML=h;
  window.scrollTo(0,0);
}

function answer(btn,n,qi,oi){
  const d=DAYS.find(x=>x.n===n), q=d.quiz[qi];
  const opts=btn.parentElement.querySelectorAll('.opt');
  opts.forEach((o,i)=>{ o.classList.remove('right','wrong'); if(i===q.a) o.classList.add('right'); });
  if(oi!==q.a) btn.classList.add('wrong');
  document.getElementById('why-'+n+'-'+qi).classList.add('show');
}
function complete(n){
  if(!state.done[n]){ state.done[n]=true; save(); toast(doneCount()>=30?'🎉 ALL 30 DAYS DONE — incredible!':'🎉 Day '+n+' done! '+(30-doneCount())+' to go'); }
  go(n<30?0:0);
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }
function refreshBar(){ const c=doneCount(); document.getElementById('pbarfill').style.width=(c/30*100)+'%'; document.getElementById('pcount').textContent=c+' / 30 days'; }
function go(n){ location.hash = n?('day-'+n):''; route(); }
function route(){ const m=location.hash.match(/day-(\d+)/); refreshBar(); if(m) renderDay(+m[1]); else renderHome(); }
window.addEventListener('hashchange', route);

/* ---------------- CONTENT: 30 days ---------------- */
const DAYS=[
/* ============ WEEK 1 — THE BUSINESS ============ */
{n:1, e:`🏦`, t:`What is State Street, really?`, tag:`A bank that guards money instead of lending it`,
 deep:`week-1-securities-services/day-01-state-street-and-custody-banking.md`,
 imagine:{e:`🧥`, h:`Imagine a giant coat check`,
  p:`You go to a theatre and hand over your coat. You get ticket #4021. The coat room never wears your coat and never sells it — it just keeps it perfectly safe, and hands it back when you show the ticket. Now imagine a coat check that guards <b>40 trillion dollars</b> of the world's investments. That is State Street. It doesn't own that money — it protects it, counts it, and reports on it. This job is called being a <b>custodian</b>.`},
 secs:[
  {h:`Not the bank you're picturing`,
   b:`<p>When you hear "bank," you probably think of the place with your savings account and home loans. State Street is a different animal. It almost never deals with regular people. Its customers are giant organizations, and its main job is <b>safekeeping</b>.</p>`,
   d:{type:`split`,
      a:{h:`🏦 State Street (a custodian bank)`, items:[`Customers: pension funds, investment companies`,`Job: keep their investments safe and organized`,`Earns: small fees on HUGE amounts`,`Like: a vault + accountant + messenger`]},
      b:{h:`🏪 A normal bank`, items:[`Customers: people and businesses`,`Job: hold deposits, give out loans`,`Earns: interest on loans`,`Like: a shop for money`]}}},
  {h:`Who are the customers?`,
   b:`<p>State Street's clients are the organizations that manage the world's savings — including, indirectly, yours and your family's:</p>`,
   d:{type:`grid`, cards:[
    {e:`👵`, t:`Pension funds`, s:`Save money so millions of people can retire`},
    {e:`📊`, t:`Asset managers`, s:`Companies that invest other people's money (mutual funds, ETFs)`},
    {e:`🛡️`, t:`Insurance companies`, s:`Invest premiums so they can pay claims later`},
    {e:`🌐`, t:`Sovereign funds`, s:`Whole countries' savings accounts`}]},
   b2:`<div class="callout">💡 <b>Key idea:</b> when a pension fund "keeps its money at State Street," the money is still the pension fund's. State Street just guards it, moves it when told to, and keeps perfect records. Perfect records are the entire product.</div>`},
  {h:`How does it make money?`,
   b:`<p>Mostly through <b>tiny fees on gigantic amounts</b>. If you charge just 0.01% per year for safekeeping $40 trillion, that's $4 billion. Small slice, enormous pizza. There are a few other streams too:</p>`,
   d:{type:`grid`, cards:[
    {e:`🔐`, t:`Safekeeping fees`, s:`A tiny % for guarding assets`},
    {e:`🧾`, t:`Transaction fees`, s:`A few dollars each time something moves`},
    {e:`💱`, t:`Currency exchange`, s:`Helping clients swap dollars, euros, yen`},
    {e:`🤝`, t:`Lending shares`, s:`Safely lending out assets for extra income`},
    {e:`💻`, t:`Software and data`, s:`Selling the tools and the numbers themselves`}]}},
  {h:`And where do YOU fit in?`,
   b:`<p>All that guarding and counting happens in big internal systems. But clients need to <b>see</b> it — on websites, dashboards and apps. That layer of screens and connections is called the <b>digital experience</b>, and it's exactly what you'll lead. You own the windows into the machine.</p>`,
   d:{type:`stack`, layers:[
    {e:`🧑‍💼`, t:`Clients`, s:`Pension funds, asset managers — they want to see their stuff`},
    {e:`📱`, t:`YOUR WORLD: portal, apps, alerts, reports`, s:`The windows clients look through`},
    {e:`⚙️`, t:`Operations teams`, s:`Thousands of people processing and checking`},
    {e:`🏛️`, t:`Core systems (the ledgers)`, s:`The giant record books that hold the truth`}]}},
 ],
 words:[
  {w:`Custodian`, d:`A bank whose job is keeping other people's investments safe — not lending or spending them.`},
  {w:`Asset`, d:`Anything valuable that's owned: shares of a company, bonds, cash.`},
  {w:`AUC`, d:`"Assets Under Custody" — the total value of everything a custodian is guarding. State Street's is over $40 trillion.`},
  {w:`Institutional investor`, d:`A big organization that invests (pension fund, insurance company) — as opposed to an individual person.`},
  {w:`Portal`, d:`The secure website where clients log in to see their accounts, reports and alerts. Your product!`}],
 quiz:[
  {q:`A pension fund keeps $1 billion "at State Street." Whose money is it?`,
   o:[`State Street's — it was deposited`, `The pension fund's — State Street just guards it`, `It's split 50/50`], a:1,
   why:`Custody means safekeeping, not owning. Like the coat check: holding the coat doesn't make it theirs.`},
  {q:`How does a custodian mainly earn money?`,
   o:[`Interest on loans, like a normal bank`, `Tiny fees on very large amounts it safeguards`, `Buying and selling shares for profit`], a:1,
   why:`Small percentage × trillions of dollars = billions in fees. That's the custody business model.`},
  {q:`What part of the machine will YOU own?`,
   o:[`The vaults and ledgers`, `The operations teams`, `The screens, apps and connections clients use to see everything`], a:2,
   why:`You lead Digital Experience — the windows into the machine. Clients judge the whole bank by them.`}]},

{n:2, e:`🌍`, t:`Where do the assets actually live?`, tag:`The chain of keepers that stretches around the world`,
 deep:`week-1-securities-services/day-02-asset-servicing-lifecycle.md`,
 imagine:{e:`🎫`, h:`Imagine luggage on a round-the-world trip`,
  p:`You check a suitcase in Boston for a flight to Tokyo. You keep a claim ticket. Your airline hands the bag to a partner airline, which hands it to Tokyo airport's storage. The bag sits in ONE place, but a chain of trusted keepers each has a record of who it belongs to. Investments work the same way: your client's German shares physically "sit" in Germany's national vault, and a chain of custodians holds the tickets.`},
 secs:[
  {h:`The chain of keepers`,
   b:`<p>Here's the secret: when you "own a share," these days nothing paper moves at all. There's a national electronic vault in each country (called a <b>CSD</b> — central securities depository) that records who owns what. Everyone else in the chain just keeps tickets pointing down the line:</p>`,
   d:{type:`stack`, layers:[
    {e:`👵`, t:`The investor (a pension fund)`, s:`"I own 1,000 shares of a German carmaker"`},
    {e:`🏦`, t:`Global custodian (State Street)`, s:`Keeps the pension fund's official record`},
    {e:`🤝`, t:`Local helper (sub-custodian in Germany)`, s:`State Street's trusted partner on the ground`},
    {e:`🏛️`, t:`Germany's national vault (the CSD)`, s:`The final electronic record for ALL German shares`}]},
   b2:`<div class="callout">💡 One global custodian connects clients to <b>100+ countries</b> through local helpers. That network is a huge part of what clients pay for — they'd never build it themselves.</div>`},
  {h:`Getting a new client on board`,
   b:`<p>Before any of this works, a new client has to be "onboarded" — like a very serious airport check-in:</p>`,
   d:{type:`flow`, steps:[
    {e:`🪪`, t:`Prove identity`, s:`KYC — "know your customer" checks against fraud and crime`},
    {e:`📝`, t:`Sign agreements`, s:`Contracts, fee schedules, instructions`},
    {e:`🗂️`, t:`Open accounts`, s:`One per market, per fund — often hundreds`},
    {e:`🔗`, t:`Connect systems`, s:`Portal logins, data feeds, message links`},
    {e:`✅`, t:`Go live`, s:`Assets transfer in and daily life begins`}]}},
  {h:`The daily chores (this is "asset servicing")`,
   b:`<p>Once assets are sitting safely, they constantly produce little tasks. Companies pay dividends. Foreign governments take tax that must be claimed back. Shareholders get to vote. The custodian handles all of it:</p>`,
   d:{type:`grid`, cards:[
    {e:`💰`, t:`Collect income`, s:`Catch every dividend and interest payment`},
    {e:`🧾`, t:`Reclaim tax`, s:`Get clients' over-paid foreign tax refunded`},
    {e:`🗳️`, t:`Voting`, s:`Pass shareholder votes to the real owner`},
    {e:`📈`, t:`Report`, s:`Show clients exactly what they hold, daily`}]},
   b2:`<p>Each chore looks small. Multiply by millions of holdings across 100 countries, every day — that's why custodians employ tens of thousands of people and why <b>your screens</b> matter: they're how clients watch all of this happening.</p>`},
 ],
 words:[
  {w:`CSD`, d:`Central Securities Depository — a country's official electronic vault recording who owns every share and bond there.`},
  {w:`Sub-custodian`, d:`A local bank in a foreign country that acts as the global custodian's hands and feet in that market.`},
  {w:`Onboarding`, d:`The careful process of setting up a new client: identity checks, contracts, accounts, connections.`},
  {w:`KYC`, d:`"Know Your Customer" — the legal duty to verify who a client really is, to keep criminals out of the system.`},
  {w:`Position`, d:`How much of one thing an account holds. "1,000 shares of ACME" is a position.`}],
 quiz:[
  {q:`Where does the FINAL official record of German shares live?`,
   o:[`At State Street in Boston`, `In Germany's national vault (its CSD)`, `On paper certificates in a safe`], a:1,
   why:`Each country's CSD is the bottom of the chain — everyone above holds records pointing down to it.`},
  {q:`Why does a pension fund pay for a global custodian instead of going directly to 100 countries?`,
   o:[`It's legally forbidden to go direct`, `The custodian's network and expertise in every market would cost a fortune to rebuild`, `Custodians invest the money better`], a:1,
   why:`The 100-market network of local helpers, rules and connections IS the product clients buy.`},
  {q:`Which of these is "asset servicing"?`,
   o:[`Catching dividends and reclaiming foreign tax for clients`, `Choosing which shares clients should buy`, `Lending money to companies`], a:0,
   why:`Servicing = all the chores that owned assets generate. Custodians never choose investments — that's the client's job.`}]},

{n:3, e:`⚡`, t:`How a trade actually happens`, tag:`From "buy!" to done — in just one day (T+1)`,
 deep:`week-1-securities-services/day-03-trade-lifecycle-and-t1-settlement.md`,
 imagine:{e:`🏠`, h:`Imagine buying a house — at superspeed`,
  p:`Buying a house has steps: you agree a price, lawyers check paperwork, then on completion day keys and money swap at the same moment. Buying shares is the same — agree, check, swap — except the whole thing now finishes <b>the next business day</b>. That deadline is called <b>T+1</b>: Trade day, plus one.`},
 secs:[
  {h:`The five steps of every trade`,
   b:`<p>Millions of trades happen daily, and every single one walks these steps:</p>`,
   d:{type:`flow`, steps:[
    {e:`🎯`, t:`1. Decide and buy`, s:`The client's fund manager buys 100,000 shares`},
    {e:`🤝`, t:`2. Agree details`, s:`Both sides confirm: what, how many, what price`},
    {e:`✅`, t:`3. Affirm`, s:`Formal "yes, correct!" — due by 9pm SAME day in the US`},
    {e:`🔁`, t:`4. Settle`, s:`Next day: shares and money swap at the same instant`},
    {e:`📗`, t:`5. Record`, s:`Custodian updates the client's accounts`}]},
   b2:`<div class="callout">💡 Step 4 is the magic moment. The swap is <b>simultaneous</b> — shares only move if money moves, so nobody can run off with one side. This is called <b>DvP</b>: Delivery versus Payment.</div>`},
  {h:`Why "next day" changed everything`,
   b:`<p>Until 2024, US trades had two days to finish (T+2). Now it's one (T+1). Losing a day sounds small — it isn't:</p>
      <ul>
      <li>⏰ <b>Same-evening deadlines.</b> Paperwork that had a leisurely day now must be confirmed by 9pm on trade day.</li>
      <li>🌏 <b>Timezone squeeze.</b> A buyer in Tokyo has almost no overlap with New York hours to fix problems.</li>
      <li>💱 <b>Cash must be ready faster.</b> Foreign buyers need dollars a day earlier.</li>
      </ul>
      <p>Less time to check means machines and instant status screens had to replace phone calls and next-morning emails. <b>T+1 made your digital products mission-critical.</b></p>`},
  {h:`When trades go wrong: fails`,
   b:`<p>Sometimes on swap day one side isn't ready — seller doesn't have the shares in place, buyer doesn't have the cash. The trade <b>fails</b> (it's late, not cancelled). Fails cost money: penalties (in Europe, automatic fines), funding costs, and angry clients.</p>`,
   d:{type:`split`,
    a:{h:`😌 Settled (the goal)`, items:[`Both sides ready`,`Swap happens on time`,`Everyone forgets about it instantly`]},
    b:{h:`😰 Failed (the exception)`, items:[`One side not ready`,`Penalty fines can start ticking`,`Ops teams investigate and chase`,`Clients want to see WHY, live, on your portal`]}},
   b2:`<p>Notice the pattern you'll meet all month: <b>the boring 99% takes care of itself — products earn their keep on the painful 1%</b>. Great custody screens show the exceptions first.</p>`},
 ],
 words:[
  {w:`T+1`, d:`Trades finish one business day after they're made. "T" is trade day.`},
  {w:`Settlement`, d:`The final swap: shares delivered, money paid, simultaneously.`},
  {w:`DvP`, d:`Delivery versus Payment — the rule that shares and cash move together or not at all.`},
  {w:`Affirmation`, d:`The formal same-day "yes, these trade details are correct" — due by 9pm ET in the US.`},
  {w:`Fail`, d:`A trade that didn't complete on time because one side wasn't ready. It gets fixed late, often with penalties.`},
  {w:`SSI`, d:`Standing Settlement Instructions — the saved "delivery address" for where a client's shares and cash should go.`}],
 quiz:[
  {q:`You buy shares on Tuesday in the US. When must the swap finish?`,
   o:[`Tuesday night`, `Wednesday (the next business day)`, `Friday (end of week)`], a:1,
   why:`T+1 = trade day plus one business day. Tuesday trade → Wednesday settlement.`},
  {q:`What clever rule stops a fraudster taking shares without paying?`,
   o:[`A human watches every trade`, `DvP — delivery and payment happen simultaneously or not at all`, `Buyers always pay a week early`], a:1,
   why:`Delivery-versus-Payment makes the swap atomic. No payment, no shares.`},
  {q:`Why did T+1 make digital products MORE important?`,
   o:[`It didn't — less time means fewer screens`, `Deadlines got so tight that live status and instant alerts replaced phone calls`, `Regulators required prettier websites`], a:1,
   why:`With hours instead of days to fix problems, clients need real-time visibility — that's your product.`}]},

{n:4, e:`🧮`, t:`What's a fund worth today? (NAV)`, tag:`The one number, computed fresh every single night`,
 deep:`week-1-securities-services/day-04-fund-accounting-and-nav.md`,
 imagine:{e:`🍋`, h:`Imagine a lemonade stand with 4 partners`,
  p:`You and three friends run a lemonade stand. Tonight you count: $60 cash in the box, lemons worth $20, and you owe $8 for sugar. Total value: 60 + 20 − 8 = $72. Four equal partners, so each share is worth <b>$18</b>. Congratulations — you just calculated a <b>NAV</b>: Net Asset Value. Investment funds do exactly this, every night, with billions of dollars.`},
 secs:[
  {h:`The recipe (it's genuinely this simple)`,
   b:`<p>A fund is a big pot of investments owned by many people in shares. Every evening, someone must answer: <i>what is one share worth today?</i></p>`,
   d:{type:`flow`, steps:[
    {e:`📈`, t:`Add up assets`, s:`Every share, bond and dollar, at today's prices`},
    {e:`➖`, t:`Subtract debts`, s:`Bills, fees owed, unpaid purchases`},
    {e:`➗`, t:`Divide by shares`, s:`Split by how many fund shares exist`},
    {e:`🏷️`, t:`Publish NAV`, s:`Tonight's official price per share`}]},
   b2:`<div class="callout">💡 Why it matters: <b>people buy and sell fund shares at this exact number</b>. If it's wrong, someone paid too much or got too little — with real money.</div>`},
  {h:`Why it takes an army every night`,
   b:`<p>The formula is easy. The inputs are the hard part. Every evening, for each of thousands of funds:</p>
   <ul>
   <li>🌍 <b>Thousands of prices</b> stream in — and some are stale or missing (a Tokyo price is 14 hours old by New York's evening).</li>
   <li>🔍 <b>Sanity checks</b> flag anything weird — a price that jumped 40% is probably a typo, not reality.</li>
   <li>🧾 <b>Every fee and dividend</b> must be counted, down to the day.</li>
   <li>👀 <b>A human signs off</b> — if the fund moved very differently from its market, someone finds out why BEFORE publishing.</li>
   </ul>
   <p>All between the 4pm market close and roughly 10pm. Every. Single. Night.</p>`},
  {h:`When the number is wrong`,
   b:`<p>Mistakes happen — a price feed drops a decimal, a dividend gets missed. If the published NAV was wrong by more than a small threshold (often about half a percent), there's a painful cleanup:</p>`,
   d:{type:`flow`, steps:[
    {e:`😱`, t:`Error found`, s:`Days later, a check catches it`},
    {e:`🧮`, t:`Recalculate`, s:`Every affected night, redone correctly`},
    {e:`🔎`, t:`Find victims`, s:`Everyone who bought or sold at wrong prices`},
    {e:`💸`, t:`Compensate`, s:`Pay back every loss — often the custodian pays`}]},
   b2:`<p><b>Your angle:</b> clients want a dashboard showing tonight's NAV, whether it's on time, and why it moved. "Is the NAV out yet?" is one of the most common phone calls your products can eliminate.</p>`},
 ],
 words:[
  {w:`Fund`, d:`A shared pot of investments owned by many investors together, divided into shares.`},
  {w:`NAV`, d:`Net Asset Value — what one share of a fund is worth: (assets − debts) ÷ number of shares.`},
  {w:`Fund accounting`, d:`The team and systems that calculate the NAV every night.`},
  {w:`Accrual`, d:`Counting costs bit-by-bit daily (like a fee of 1% a year charged as a tiny slice each day) instead of in one lump.`},
  {w:`ETF`, d:`A fund whose shares trade on a stock exchange all day, like a share — but it still gets a nightly NAV.`}],
 quiz:[
  {q:`A fund has $500m of assets, owes $20m, and has 40m shares. NAV per share?`,
   o:[`$12.50`, `$12.00`, `$11.50`], a:1,
   why:`(500 − 20) ÷ 40 = $12.00. You can genuinely do this on a napkin — the lemonade math scales.`},
  {q:`Why is a wrong NAV a big deal?`,
   o:[`It looks bad in the newspaper`, `People actually bought and sold at that wrong price, so real money must be paid back`, `The computers must be rebooted`], a:1,
   why:`The NAV is a transaction price, not a report. Errors above the threshold mean recalculating and compensating.`},
  {q:`What's the smart "sanity check" before publishing a NAV?`,
   o:[`Compare the fund's move to its market — a big unexplained gap means investigate first`, `Check the number is positive`, `Ask the client if it looks right`], a:0,
   why:`If the market rose 0.2% and the fund shows +1.4%, something's off — a bad price, a missed dividend. Catch it before it publishes.`}]},

{n:5, e:`📣`, t:`When companies make announcements`, tag:`Corporate actions — and the deadlines that bite`,
 deep:`week-1-securities-services/day-05-corporate-actions.md`,
 imagine:{e:`📋`, h:`Imagine school permission slips`,
  p:`Some school notes are just FYI: "picture day is Friday" — nothing to do. But some MUST be signed and returned by a deadline: "sign by Friday or your child misses the trip." Companies send investors both kinds. A dividend just arrives (FYI). But an offer like "sell us your shares at a 25% bonus price — answer by the 15th" needs a decision. Miss THAT deadline and your client loses real money. These announcements are called <b>corporate actions</b>.`},
 secs:[
  {h:`Three flavors of announcement`,
   b:``,
   d:{type:`grid`, cards:[
    {e:`😌`, t:`Automatic`, s:`Dividends, share splits. Just happens — custodian books it correctly. No decision.`},
    {e:`⚠️`, t:`Your choice`, s:`"Want to sell us your shares at a premium?" Optional — but deadline-bound. HIGHEST RISK.`},
    {e:`🤔`, t:`Happens, but pick a form`, s:`"Dividend: cash or extra shares?" It happens either way; silence gets the default.`}]},
   b2:`<div class="callout">💡 The middle one is where careers and lawsuits happen. An optional offer worth millions, a hard deadline, and a client who never saw the notice = disaster.</div>`},
  {h:`The journey of one announcement`,
   b:`<p>Follow one "your choice" offer through the machine:</p>`,
   d:{type:`flow`, steps:[
    {e:`📰`, t:`Company announces`, s:`News arrives from several sources — often disagreeing on details!`},
    {e:`🧹`, t:`Clean it up`, s:`Custodian compares sources, builds ONE trusted version`},
    {e:`🧮`, t:`Who's affected?`, s:`Find every client holding that share`},
    {e:`📨`, t:`Notify + remind`, s:`Tell them the terms and the deadline. Then remind. Then escalate.`},
    {e:`☑️`, t:`Collect answers`, s:`Client decides on the portal or by message`},
    {e:`💸`, t:`Execute and pay`, s:`Pass elections to market; money and shares move`}]}},
  {h:`The horror story (why this matters)`,
   b:`<p>A real pattern the industry knows well: a client holds €80m of a bank's shares. The bank offers new shares at a big discount — deadline in 12 days. The notice goes to a message queue nobody watches. Reminder emails land in the inbox of someone on holiday. Deadline passes. The client's holding loses <b>~€12 million</b> in value, and the custodian pays a big share of it.</p>
   <p>Look at what actually failed: not the vaults, not the math — <b>the last mile of human attention</b>. Notices sent but not <i>seen</i>.</p>
   <div class="callout">🎯 That last mile is literally your job description: readable event pages, deadline alerts that escalate louder as time runs out, an "answer online" button, and a tracker showing who hasn't responded. Day 12 builds this.</div>`},
 ],
 words:[
  {w:`Corporate action`, d:`Any company event that affects its investors: dividends, splits, buyout offers, votes.`},
  {w:`Dividend`, d:`A cash payout a company gives its shareholders, usually a few times a year.`},
  {w:`Election`, d:`The client's answer to a choice-type corporate action ("I accept the offer for 60% of my shares").`},
  {w:`Deadline (cutoff)`, d:`The date by which an election must arrive. The custodian sets its own deadline a bit earlier than the market's, to have time to process.`},
  {w:`Golden record`, d:`The one cleaned-up, trusted version of an announcement, built by comparing several messy sources.`},
  {w:`Record date`, d:`The snapshot day — whoever holds the shares on this date gets the dividend or the offer rights.`}],
 quiz:[
  {q:`Which corporate action type is the most dangerous operationally?`,
   o:[`A dividend that pays automatically`, `An optional offer with a deadline that a client might miss`, `A share split`], a:1,
   why:`Optional + deadline + big money = the classic multi-million loss when a notice goes unseen.`},
  {q:`Why does the custodian "clean up" announcements before telling clients?`,
   o:[`To translate them into English`, `Because different sources often disagree on details, and clients must get ONE trusted version`, `To shorten them`], a:1,
   why:`Building the golden record is a core custodian skill — a wrong deadline in it poisons everything downstream.`},
  {q:`In the €12m horror story, what actually failed?`,
   o:[`The math was wrong`, `The vault lost the shares`, `The notifications were sent but never actually SEEN by a human in time`], a:2,
   why:`The last mile of attention failed — which is exactly what better alerts, escalation and portal design fix.`}]},

{n:6, e:`💸`, t:`How banks talk and money moves`, tag:`SWIFT: the world's most serious messaging app`,
 deep:`week-1-securities-services/day-06-swift-payments-and-cash-management.md`,
 imagine:{e:`✉️`, h:`Imagine a WhatsApp where every message is legally binding`,
  p:`Banks in different countries constantly need to tell each other things: "pay this," "deliver those shares," "here's your statement." They can't use email — too easy to fake. So 11,000+ banks share one ultra-secure messaging network called <b>SWIFT</b>, where every message follows a strict template and really means something. Fun fact: SWIFT moves <b>no money itself</b>. It's only the messages — like texting "I sent the rent" is not the same as the bank transfer.`},
 secs:[
  {h:`Messages in strict uniforms`,
   b:`<p>A SWIFT message isn't free text — it's a form where every box has a meaning, so a computer in Tokyo can read what a computer in Boston sent, instantly and without confusion. Each message type has a code. The custody world's greatest hits:</p>
   <ul>
   <li>📩 <b>MT541</b> — "receive these shares and pay for them" (a settlement instruction, from Day 3)</li>
   <li>📣 <b>MT564</b> — "here's a corporate action announcement" (from Day 5)</li>
   <li>☑️ <b>MT565</b> — "here's my election/answer"</li>
   <li>📊 <b>MT535</b> — "here's your statement of holdings"</li>
   <li>💰 <b>MT900-series</b> — cash confirmations and statements</li>
   </ul>
   <p>The industry is slowly moving from these older "MT" telegram-style messages to a richer modern format (<b>ISO 20022</b>) — like upgrading from SMS to full email. Both will coexist for years, and your products must read both.</p>`},
  {h:`So how does money ACTUALLY move?`,
   b:`<p>Banks keep accounts <i>at each other</i>. A US bank keeps a euro account at a European partner bank; that's called a <b>nostro</b> ("our account at yours"). "Sending money to Europe" really means: adjust balances in these linked accounts and confirm by message.</p>`,
   d:{type:`flow`, steps:[
    {e:`🏦`, t:`Boston bank`, s:`"Pay €10m from my euro account"`},
    {e:`✉️`, t:`SWIFT message`, s:`Secure, standard instruction`},
    {e:`🏦`, t:`Frankfurt partner`, s:`Moves €10m out of the nostro account`},
    {e:`🏛️`, t:`Euro payment rail`, s:`Central-bank system completes it`},
    {e:`✅`, t:`Confirmation back`, s:`"Done" message returns`}]},
   b2:`<div class="callout">💡 Every country has payment "rails" (the US has Fedwire, Europe has TARGET2). And every rail has <b>closing times</b>. Miss the cutoff and the money leaves TOMORROW — which, in a T+1 world, can mean a failed trade.</div>`},
  {h:`Why cash is a product problem too`,
   b:`<p>Clients hold cash balances in many currencies at the custodian, and they care about three things your screens must answer instantly:</p>
   <ul>
   <li>💵 <b>How much cash do I have, right now, in each currency?</b></li>
   <li>📅 <b>Will I have enough tomorrow</b> for the trades that are settling? (Being short = failed trades or expensive overdrafts)</li>
   <li>😴 <b>Is idle cash earning something?</b> (Big balances often auto-move into overnight earning — a "sweep")</li>
   </ul>`},
 ],
 words:[
  {w:`SWIFT`, d:`The secure global messaging network banks use to instruct and confirm — messages only, never the money itself.`},
  {w:`MT564`, d:`The SWIFT message type that announces a corporate action to a client. (565 = the answer back.)`},
  {w:`ISO 20022`, d:`The modern, richer message format slowly replacing old MT messages — SMS upgrading to email.`},
  {w:`Nostro`, d:`"Our account at your bank" — how banks hold foreign currency with partners abroad.`},
  {w:`Cutoff`, d:`The daily closing time of a payment system. After it, your payment waits until tomorrow.`},
  {w:`Sweep`, d:`Automatically moving idle end-of-day cash into something that earns overnight interest.`}],
 quiz:[
  {q:`What does SWIFT actually move?`,
   o:[`Money`, `Messages about money and securities`, `Gold between vaults`], a:1,
   why:`SWIFT is the messaging layer. The money moves separately on payment rails and between linked bank accounts.`},
  {q:`A payment misses the day's cutoff. What happens?`,
   o:[`It's cancelled forever`, `It goes tomorrow — which can make a T+1 trade fail`, `It costs double`], a:1,
   why:`Cutoffs are hard closing times. In a next-day settlement world, a one-day cash delay can break a trade.`},
  {q:`What is a "nostro" account?`,
   o:[`A secret account`, `Our bank's own account held at a partner bank abroad, in their currency`, `A client's retirement account`], a:1,
   why:`Nostro = "ours at yours." It's how a Boston bank can hold and pay euros in Frankfurt.`}]},

{n:7, e:`🧩`, t:`Week 1 wrap: the machine, assembled`, tag:`One picture, one story, one victory lap`,
 deep:`week-1-securities-services/day-07-week-1-capstone-and-case-studies.md`,
 imagine:{e:`🏭`, h:`Imagine the factory tour, end to end`,
  p:`Six days ago, "custodian bank" meant nothing to you. Now you can walk the whole factory floor: the vault chain that holds the world's assets, the daily trade swaps, the nightly worth-counting, the announcement machine, and the money-messaging system underneath. Today: connect it into ONE picture you'll carry forever.`},
 secs:[
  {h:`The whole business on one screen`,
   b:``,
   d:{type:`stack`, layers:[
    {e:`🧑‍💼`, t:`Clients (Day 1)`, s:`Pension funds and asset managers who own everything`},
    {e:`📱`, t:`Your digital layer`, s:`Portal, alerts, reports — how clients watch it all`},
    {e:`⚡`, t:`Trades settle T+1 (Day 3)`, s:`Shares and cash swap simultaneously — DvP`},
    {e:`📣`, t:`Corporate actions (Day 5)`, s:`Announcements, elections, deadlines`},
    {e:`🧮`, t:`NAV every night (Day 4)`, s:`Assets − debts ÷ shares, signed off, published`},
    {e:`💸`, t:`SWIFT and cash (Day 6)`, s:`The messages and money-rails underneath`},
    {e:`🌍`, t:`The keeper chain (Day 2)`, s:`Sub-custodians and national vaults worldwide`}]},
   b2:`<div class="callout">🧠 <b>The one-sentence version:</b> a custodian keeps perfect records of who owns what, moves things safely when told to, handles every chore ownership creates, and shows clients all of it — and YOU own the showing.</div>`},
  {h:`Three mini-stories to test yourself against`,
   b:`<p><b>Story A — the late trade.</b> A client's big buy isn't affirmed by the 9pm deadline. Next day it fails to settle; penalty clocks start. <i>Where does the client look first?</i> Your portal. If they learn about it from a phone call the next afternoon, your product failed too.</p>
   <p><b>Story B — the wrong NAV.</b> A pricing feed drops a decimal; the NAV is 0.9% too high for three days. Investors traded at wrong prices; compensation is owed. <i>What could have caught it sooner?</i> The movement check — and a dashboard making the weird jump impossible to miss.</p>
   <p><b>Story C — the missed offer.</b> A rich buyout offer expires unanswered because notices went unseen (Day 5's €12m story). <i>The fix isn't more messages</i> — it's escalating alerts, an answer-online button, and a "who hasn't responded" tracker.</p>
   <p>Notice: in all three stories, the core machine mostly worked — <b>the visibility layer decided the outcome</b>. That's your job in one insight.</p>`},
  {h:`Your Week 1 badge exam`,
   b:`<p>The quiz below is a little longer today — six questions across the whole week. Ace it and Week 2 awaits: you stop learning what the bank does, and start learning how to <b>build products</b> for it.</p>`},
 ],
 words:[
  {w:`Asset servicing`, d:`The umbrella name for everything Week 1 covered: safekeeping plus all the chores of ownership.`},
  {w:`Exception`, d:`The one thing out of a hundred that went wrong and needs a human. Great custody products are exception-first.`},
  {w:`Book of record`, d:`The system holding the official truth about holdings and cash. Everything you display traces back to one.`}],
 quiz:[
  {q:`The chain, bottom to top: where's the final truth about who owns a share?`,
   o:[`The national vault (CSD) of that share's country`, `The client's spreadsheet`, `The stock exchange`], a:0,
   why:`Day 2: the CSD is the bottom of the keeper chain — everyone above holds tickets pointing to it.`},
  {q:`DvP protects everyone by…`,
   o:[`insuring every trade`, `making shares and cash move simultaneously or not at all`, `requiring a manager's signature`], a:1,
   why:`Day 3: the atomic swap. No cash, no shares.`},
  {q:`NAV in one formula:`,
   o:[`assets ÷ debts`, `(assets − debts) ÷ number of shares`, `yesterday's price + today's news`], a:1,
   why:`Day 4: the lemonade-stand math, at billion-dollar scale.`},
  {q:`The most dangerous corporate action is…`,
   o:[`an automatic dividend`, `an optional offer with a deadline`, `a share split`], a:1,
   why:`Day 5: optional + deadline + unseen notice = the industry's classic disaster.`},
  {q:`SWIFT is best described as…`,
   o:[`the pipe money flows through`, `banking's secure, structured messaging network`, `a stock exchange`], a:1,
   why:`Day 6: messages only. Money moves on payment rails and nostro accounts.`},
  {q:`The deep lesson of the three mini-stories:`,
   o:[`core systems always fail`, `outcomes were decided by the VISIBILITY layer — alerts, status, dashboards`, `clients don't read anything`], a:1,
   why:`The machine mostly worked; seeing (or not seeing) decided the damage. That visibility layer is your product.`}]},
/* ============ WEEK 2 — YOUR CRAFT ============ */
{n:8, e:`🎯`, t:`Product strategy, minus the jargon`, tag:`Choosing what to build when your customers are giants`,
 deep:`week-2-product-and-digital-experience/day-08-product-strategy-in-financial-services.md`,
 imagine:{e:`🍽️`, h:`Imagine cooking for 5 food critics, not 5,000 diners`,
  p:`A street-food stall serves thousands of strangers; if one dislikes lunch, no big deal. Now imagine a restaurant with only five customers — each a famous critic who pays millions a year, visits with a checklist, and compares you to two rival restaurants every visit. THAT is building products at a custodian: few, enormous, demanding clients with multi-year contracts. Everything about product strategy changes.`},
 secs:[
  {h:`How this world differs from normal tech`,
   b:``,
   d:{type:`split`,
    a:{h:`🏦 Your world (B2B, institutional)`, items:[`Dozens of huge clients, not millions of users`,`Deals won through months-long formal evaluations (RFPs)`,`The person who BUYS is not the person who USES`,`One unhappy giant client = a crisis meeting`]},
    b:{h:`📱 A consumer app`, items:[`Millions of small users`,`Users choose in seconds in an app store`,`Buyer = user`,`One unhappy user = a bad review`]}},
   b2:`<div class="callout">💡 Biggest mind-shift: your portal is <b>rarely paid for directly</b>. It wins deals, keeps clients from leaving, and cuts the cost of serving them. Its value shows up in someone else's numbers — you must learn to prove it (Day 26).</div>`},
  {h:`Strategy = answering 3 questions, honestly`,
   b:``,
   d:{type:`flow`, steps:[
    {e:`🧭`, t:`1. Where do we play?`, s:`Which clients, which problems? (You can't do everything)`},
    {e:`🏆`, t:`2. How do we win?`, s:`What will WE do meaningfully better than rivals?`},
    {e:`🧱`, t:`3. What must be true?`, s:`Skills, systems, money needed — and do we have them?`}]},
   b2:`<p>Example answer for your role: <i>"We win the operations teams. Rivals show prettier marketing pages; we make the daily painful 1% — fails, deadlines, breaks — the fastest to spot and fix in the industry."</i> Notice how it says <b>no</b> to lots of things. A strategy that says no to nothing is a wish, not a strategy.</p>`},
  {h:`Build it, buy it, or partner?`,
   b:`<p>For every capability, ask three questions in order:</p>
   <ul>
   <li>🥇 <b>Is this how we win?</b> (our special sauce) → <b>Build it</b>, own it, invest deep.</li>
   <li>🧰 <b>Is it necessary but standard?</b> (video calls, e-signatures) → <b>Buy it</b>, don't reinvent.</li>
   <li>🤝 <b>Is it valuable but someone else's specialty?</b> → <b>Partner</b> and integrate.</li>
   </ul>
   <p>Classic mistake in banks: building bland versions of things you could buy, while UNDER-investing in the thing that actually differentiates you. Guard your builders' hours for the special sauce.</p>`},
 ],
 words:[
  {w:`B2B`, d:`Business-to-business: your customers are companies, not consumers. Fewer, bigger, slower, more demanding.`},
  {w:`RFP`, d:`Request For Proposal — the huge formal questionnaire big clients send when choosing a provider. Digital sections are scored!`},
  {w:`Strategy`, d:`Choosing where to play and how to win — which requires clearly saying NO to other options.`},
  {w:`Differentiator`, d:`The thing you do meaningfully better than rivals — the reason a client picks you.`},
  {w:`Retention`, d:`Keeping existing clients. In this industry, keeping a giant client is worth more than most new sales.`}],
 quiz:[
  {q:`Your portal usually earns money by…`,
   o:[`monthly subscription fees from users`, `helping win deals, keep clients and cut service costs`, `showing ads`], a:1,
   why:`Digital is rarely a paid line item — it powers revenue and savings that show up elsewhere. Prove it or lose budget.`},
  {q:`A strategy is real when it…`,
   o:[`lists everything you could ever build`, `clearly says NO to some clients and problems`, `matches the biggest competitor exactly`], a:1,
   why:`"Where to play" means choosing. A plan with no NOs is a wish list.`},
  {q:`E-signature capability for your portal: build or buy?`,
   o:[`Build — everything in-house is safer`, `Buy — it's standard plumbing, not your special sauce`, `Skip it`], a:1,
   why:`Save your builders for differentiators. Standard capabilities are bought and integrated.`}]},

{n:9, e:`🗺️`, t:`Roadmaps and choosing what's first`, tag:`Too many good ideas, one team — now what?`,
 deep:`week-2-product-and-digital-experience/day-09-product-operating-model-and-roadmaps.md`,
 imagine:{e:`🎒`, h:`Imagine packing one backpack for a year abroad`,
  p:`Everything on your bed looks essential. But the bag holds 15 things. So you rank: what do I need FIRST? What's heavy but rarely used? What can I buy later if needed? Product priorities are exactly this — everyone's idea is "essential," the team is one backpack, and your job is the honest ranking (plus explaining, kindly, why someone's hairdryer didn't make it).`},
 secs:[
  {h:`A fair way to rank ideas`,
   b:`<p>Arguments about priorities get poisonous when they're opinion vs opinion. Scoring frameworks make them numbers vs numbers. The simplest good one, <b>RICE</b>:</p>
   <ul>
   <li>📏 <b>Reach</b> — how many clients/users does this touch?</li>
   <li>💥 <b>Impact</b> — how much does it help each of them?</li>
   <li>🎯 <b>Confidence</b> — how sure are we about those guesses?</li>
   <li>⚖️ <b>Effort</b> — how much work?</li>
   </ul>
   <p>Score = (Reach × Impact × Confidence) ÷ Effort. Watch it work on three real ideas:</p>`,
   d:{type:`grid`, cards:[
    {e:`📣`, t:`Deadline alerts for offers`, s:`Touches every client · prevents disasters · small build → score: HUGE. Do first!`},
    {e:`🔌`, t:`Settlement status API`, s:`Top clients only · big impact for them · medium build → score: strong. Next.`},
    {e:`🎨`, t:`Dashboard visual refresh`, s:`Everyone sees it · mild benefit · medium build → score: modest. It waits.`}]},
   b2:`<div class="callout">💡 The score isn't the boss — it's the <b>honesty machine</b>. You can overrule it (a legal deadline, a strategic bet) but you say so out loud, in front of the numbers.</div>`},
  {h:`Roadmaps: promise carefully`,
   b:`<p>A roadmap is a communication tool, and its shape should match how sure you are:</p>
   <ul>
   <li>📆 <b>Dates roadmap</b> ("API ships March 31") — only for true commitments: regulatory deadlines, contract promises. Dates you publish become dates you owe.</li>
   <li>🌊 <b>Now / Next / Later</b> — honest about uncertainty. "Now" is being built; "Next" is likely; "Later" is direction, not promise.</li>
   </ul>
   <p>Why it matters: salespeople will show clients whatever roadmap exists. If it has dates, those dates just became contractual in the client's mind. Give sales a special "safe-to-share" version with confidence labels.</p>`},
  {h:`Teams: rented crews vs owner-teams`,
   b:``,
   d:{type:`split`,
    a:{h:`🏡 Owner-team (aim for this)`, items:[`Stays on the product for years`,`Owns an OUTCOME ("cut fail-related calls 30%")`,`Learns the domain deeply, compounds`,`Cares about quality — they'll live with it`]},
    b:{h:`🚚 Project crew (the old way)`, items:[`Assembled for one project, then scattered`,`Owns a task list, not a result`,`Knowledge walks away at the end`,`"Done" means "handed over," not "working well"`]}},
   b2:`<p>Big banks historically fund project-crews. The industry is shifting to owner-teams — expect to fight this battle, gently and repeatedly, with the funding process (Day 14 teaches how).</p>`},
 ],
 words:[
  {w:`Roadmap`, d:`The plan of what you'll build and roughly when — really a promise-management tool.`},
  {w:`RICE`, d:`A scoring formula for ranking ideas: Reach × Impact × Confidence ÷ Effort.`},
  {w:`Backlog`, d:`The ranked to-do list of everything a team might build.`},
  {w:`OKR`, d:`Objective and Key Results — a goal ("clients self-serve more") plus numbers proving it ("tickets down 25%").`},
  {w:`Now/Next/Later`, d:`A roadmap format sorted by certainty instead of fake precise dates.`}],
 quiz:[
  {q:`Why score ideas with something like RICE?`,
   o:[`Scores are always right`, `It turns opinion-fights into transparent number-conversations`, `Regulators require it`], a:1,
   why:`The score is an honesty machine — you can overrule it, but visibly and with reasons.`},
  {q:`When are exact DATES right on a roadmap?`,
   o:[`Always — dates motivate teams`, `Only for real commitments like regulations and contracts`, `Never`], a:1,
   why:`Published dates become owed dates. Use Now/Next/Later where certainty is honestly lower.`},
  {q:`Why prefer teams that stay on a product for years?`,
   o:[`Cheaper salaries`, `Domain knowledge compounds, and owners care about outcomes, not handovers`, `Fewer meetings`], a:1,
   why:`Owner-teams learn deeply and live with their quality. Project crews scatter, taking the knowledge with them.`}]},

{n:10, e:`🧑‍💻`, t:`Meet your users (they're not who you think)`, tag:`A day in the life of the people on your screens`,
 deep:`week-2-product-and-digital-experience/day-10-customer-journey-and-ux-for-institutional-clients.md`,
 imagine:{e:`🚦`, h:`Imagine designing an air-traffic control screen`,
  p:`An air-traffic controller doesn't want a beautiful, minimal, calming app. They want ALL the information, dense and instant, with anything abnormal screaming for attention. Your real users — operations analysts at client firms — are the same. They live in your portal 6 hours a day, hunting for the 1% that went wrong. Designing for them is designing for professionals under pressure, not shoppers browsing.`},
 secs:[
  {h:`The cast of characters`,
   b:`<p>"The client" is actually several very different people sharing one login page:</p>`,
   d:{type:`grid`, cards:[
    {e:`🔍`, t:`Operations analyst`, s:`In your portal ALL DAY. Hunts exceptions: fails, breaks, deadlines. Wants speed and density.`},
    {e:`🧮`, t:`Fund controller`, s:`Watches NAVs and month-end reports. Wants accuracy, timeliness, proof.`},
    {e:`📈`, t:`Portfolio manager`, s:`Rarely logs in. Wants one number ("what do I hold?") — fast, or via their own systems.`},
    {e:`💼`, t:`The executive sponsor`, s:`Never logs in. Decides at renewal whether you were worth it. Sees only summaries and moods.`}]},
   b2:`<div class="callout">💡 Classic trap: designing for the executive who buys (loves clean dashboards) instead of the analyst who uses (needs dense tables). The analyst's daily experience becomes the mood the executive hears about at renewal.</div>`},
  {h:`Walk a mile: one journey, mapped`,
   b:`<p>The best design tool is embarrassingly simple: pick one real task and walk it step by step, noting where it hurts. Example — analyst investigates a failed trade:</p>`,
   d:{type:`flow`, steps:[
    {e:`🔔`, t:`Finds out`, s:`Ideally your alert — not the counterparty phoning!`},
    {e:`🔎`, t:`Looks it up`, s:`Search must work with any reference number they have`},
    {e:`🕵️`, t:`Diagnoses`, s:`WHY did it fail? Status history, missing pieces, whose side?`},
    {e:`📞`, t:`Acts`, s:`Chase counterparty, fix instruction — can they do it HERE?`},
    {e:`📝`, t:`Reports`, s:`Tell their boss — is there an exportable summary?`}]},
   b2:`<p>Each step has a question — and each "no" in those answers is a support ticket, a phone call, or a frustrated client. Map 5 journeys like this in your first months and you'll know more than most.</p>`},
  {h:`Rules of thumb for professional-grade screens`,
   b:`<ul>
   <li>🚨 <b>Exceptions first.</b> Don't celebrate the 99% that's fine; surface the 1% that isn't, sorted by urgency.</li>
   <li>📋 <b>Tables beat tiles.</b> Analysts compare and scan; dense, sortable, filterable tables are their power tool.</li>
   <li>🕐 <b>Say how fresh the data is.</b> "As of 06:00" on every screen. Guessing freshness destroys trust (remember NAV night!).</li>
   <li>📤 <b>Let everything export.</b> They live in Excel too. Fighting it loses; making exports great wins.</li>
   <li>♿ <b>Accessible by default.</b> Keyboard-only operation, readable contrast — professional users, enterprise requirement, and the right thing.</li>
   </ul>`},
 ],
 words:[
  {w:`Persona`, d:`A sketch of one user type — their goals, pressures and pains — so you design for someone real, not "the client."`},
  {w:`User journey`, d:`The step-by-step path someone takes to finish a real task, with the pain points marked.`},
  {w:`Exception-first`, d:`Design principle: show what needs attention before what's fine.`},
  {w:`UX`, d:`User experience — how it feels to get a task done: speed, clarity, confidence. Not decoration.`},
  {w:`Accessibility`, d:`Designing so people with different abilities can fully use it — keyboards, screen readers, contrast.`}],
 quiz:[
  {q:`Who actually spends the most hours in your portal?`,
   o:[`The client's CEO`, `Operations analysts hunting exceptions`, `Portfolio managers`], a:1,
   why:`Analysts live there daily. Design for their density and speed — their experience becomes the account's mood.`},
  {q:`"Exception-first" means…`,
   o:[`hide all problems`, `show the things that went wrong, biggest urgency first`, `only executives see errors`], a:1,
   why:`Air-traffic-control thinking: the abnormal must scream; the normal can whisper.`},
  {q:`Why label data freshness ("as of 06:00") everywhere?`,
   o:[`It looks technical`, `Because acting on data that's older than it looks destroys trust and causes real mistakes`, `Regulators require timestamps on marketing pages`], a:1,
   why:`Professionals make decisions from your screens. They must know exactly how current the picture is.`}]},

{n:11, e:`🔐`, t:`Who's allowed to see what?`, tag:`Logins, permissions, and the hotel-keycard trick`,
 deep:`week-2-product-and-digital-experience/day-11-identity-and-access-management.md`,
 imagine:{e:`🏨`, h:`Imagine running a 5,000-room hotel`,
  p:`Every guest gets a keycard. Housekeeping's cards open a whole floor; the manager's opens everything; your card opens YOUR room only. Nobody stands at each door checking ID — the card system enforces it all, silently, and logs every door opened. Your portal needs exactly this: thousands of users from hundreds of client firms, each seeing precisely their own accounts and nothing more. One wrong door = one client seeing another's money = catastrophe.`},
 secs:[
  {h:`Two different questions, always in order`,
   b:``,
   d:{type:`flow`, steps:[
    {e:`🪪`, t:`1. WHO are you?`, s:`Authentication — prove your identity (password + phone code, or company login)`},
    {e:`🗝️`, t:`2. WHAT may you do?`, s:`Authorization — which accounts you can SEE, which actions you can TAKE`}]},
   b2:`<div class="callout">💡 Keep these separate in your head forever. Auth-<b>entication</b> = the passport check. Auth-<b>orization</b> = the visa. Most login-related product debates are about one or the other, and confusing them muddles everything.</div>`},
  {h:`Permissions get complicated FAST`,
   b:`<p>A client firm has 40 staff. Some may only VIEW some funds. Some may APPROVE payments on certain accounts, up to certain amounts. Auditors see everything, touch nothing. And it changes weekly as people join, move and leave. Two tools tame it:</p>
   <ul>
   <li>👥 <b>Roles</b> (job-title keycards): define "Viewer," "Ops Analyst," "Approver" once, hand them out. Simple, auditable.</li>
   <li>🎛️ <b>Fine-grained rules</b> on top: "Approver, but only for the Europe funds, only under $10m."</li>
   </ul>
   <p>The magic feature clients love: <b>let their own admins manage their own users</b>. The client's admin adds the new joiner, removes the leaver — instantly, without emailing you. Faster for them, safer for the bank, and it removes a whole category of support tickets.</p>`},
  {h:`Extra locks for dangerous doors`,
   b:`<p>Viewing a balance and approving a $17 million election are not equally risky — so don't protect them equally:</p>`,
   d:{type:`grid`, cards:[
    {e:`👀`, t:`Just looking`, s:`Normal login is enough`},
    {e:`🔁`, t:`Step-up check`, s:`Big action? Re-confirm identity right then (fresh phone prompt)`},
    {e:`👥`, t:`Four-eyes rule`, s:`Huge action? A SECOND person at the client must approve`},
    {e:`📜`, t:`Everything logged`, s:`Who did what, when — forever. Auditors will ask.`}]},
   b2:`<p>Remember Day 5's corporate-action elections? Now you know why they end with a second approver and a fresh identity check. Security choices ARE product design.</p>`},
 ],
 words:[
  {w:`Authentication`, d:`Proving who you are (password, phone code, fingerprint). The passport check.`},
  {w:`Authorization`, d:`What you're allowed to see and do once you're in. The visa.`},
  {w:`MFA`, d:`Multi-factor authentication — password PLUS something else (phone prompt), so a stolen password alone is useless.`},
  {w:`Role`, d:`A named bundle of permissions ("Ops Analyst") assigned to people — the job-title keycard.`},
  {w:`Entitlements`, d:`The full detailed map of who may see and do what, per account and function.`},
  {w:`SSO`, d:`Single sign-on — users log in with their own company's account, and the company can switch it off the day they leave.`}],
 quiz:[
  {q:`Authentication vs authorization:`,
   o:[`Same thing, two spellings`, `First proves WHO you are; second decides WHAT you may do`, `One for staff, one for clients`], a:1,
   why:`Passport, then visa. Every access conversation should name which one it's about.`},
  {q:`Why let client firms manage their own users?`,
   o:[`It shifts blame to them`, `Faster for them, safer for everyone (leavers removed same-day), and far fewer support tickets`, `It's legally required`], a:1,
   why:`Delegated administration is the quietly killer feature of institutional portals.`},
  {q:`A user approves a $17m election. What should the system have done?`,
   o:[`Nothing special — they were logged in`, `Fresh identity re-check plus a second approver, all logged`, `Sent an email afterwards`], a:1,
   why:`Match protection to risk: step-up auth + four-eyes + audit trail for the dangerous doors.`}]},

{n:12, e:`🔔`, t:`The art of the perfect nudge`, tag:`Alerts that save millions (without becoming spam)`,
 deep:`week-2-product-and-digital-experience/day-12-alerts-and-notifications-platforms.md`,
 imagine:{e:`⏰`, h:`Imagine a friend who reminds you of things`,
  p:`A good friend texts "your flight's at 7am tomorrow — checked in yet?" A bad friend texts forty times a day about everything, so you mute them and MISS the flight text. Notifications live on this knife-edge. Remember Day 5's €12 million missed deadline? The notices were sent, muted-by-overload, unseen. Today: how to be the good friend, as a platform.`},
 secs:[
  {h:`One pipeline for the whole company`,
   b:`<p>The mistake every big company makes: each app builds its own emails. Result: chaos, no shared preferences, no record. The fix: <b>one central notification pipeline</b> every product plugs into:</p>`,
   d:{type:`flow`, steps:[
    {e:`⚡`, t:`Something happens`, s:`Trade fails, deadline nears, NAV publishes, statement lands`},
    {e:`🧠`, t:`Who cares?`, s:`Match the event to entitled, subscribed people (Day 11's map!)`},
    {e:`🎛️`, t:`How do THEY want it?`, s:`Their channel and timing preferences`},
    {e:`✍️`, t:`Compose`, s:`Clear message, right language and timezone`},
    {e:`📬`, t:`Deliver`, s:`In-app, email, SMS, or straight into client systems`},
    {e:`📜`, t:`Record`, s:`Proof of what was sent, to whom, when — forever`}]}},
  {h:`Beating alert fatigue (the €12m lesson)`,
   b:`<ul>
   <li>🚦 <b>Not everything is urgent.</b> Three levels: 🔴 act now, 🟡 today, ⚪ FYI (bundled into one daily digest). Guard the red level jealously — it only works if it's rare.</li>
   <li>📈 <b>Escalate, don't repeat.</b> Deadline unanswered? Get LOUDER and WIDER: 5 days out → analyst, in-app. 2 days → analyst + their boss, +email. 1 day → also the client's ops head, +SMS. Same message 40 times = muted; widening circle = seen.</li>
   <li>🎛️ <b>Let users tune it</b> — per event type, per account, digest vs instant. A tuned notification is a read notification.</li>
   <li>🌍 <b>Timezones must be perfect.</b> "Deadline 17:00" — whose 17:00? Ambiguity here loses real money.</li>
   </ul>`},
  {h:`Proof matters as much as delivery`,
   b:`<p>When something goes wrong ("we were never told!"), the notification record is the bank's defense: what was sent, to whom, when, delivered to which address, opened or not. This is why the pipeline logs everything permanently — it's not bureaucracy, it's the receipts.</p>
   <div class="callout">🎯 <b>Your product-owner test for any alert idea:</b> Who exactly gets this? Why them? How do they mute the noise but never the critical? What's our proof it arrived? What happens if it's ignored?</div>`},
 ],
 words:[
  {w:`Notification platform`, d:`One shared pipeline all products use to reach people — instead of every app sending its own emails.`},
  {w:`Alert fatigue`, d:`When too many notifications teach people to ignore ALL of them — including the vital one.`},
  {w:`Escalation`, d:`Getting louder and wider as a deadline nears: more urgency, more channels, more senior people.`},
  {w:`Digest`, d:`Bundling non-urgent updates into one summary message instead of many pings.`},
  {w:`Webhook`, d:`A notification sent machine-to-machine — straight into the client's own systems, no human inbox involved.`}],
 quiz:[
  {q:`The deep cause of alert fatigue:`,
   o:[`Emails are old-fashioned`, `Too much noise teaches people to ignore everything — including the critical alert`, `Notifications cost too much`], a:1,
   why:`The bad friend problem. Guarding the urgent tier is what keeps it believable.`},
  {q:`A client hasn't answered a big offer, deadline in 2 days. Best move?`,
   o:[`Resend the same message hourly`, `Escalate: add their manager, add another channel, raise urgency`, `Wait — it's their responsibility`], a:1,
   why:`Wider and louder beats repetition. The widening circle is what finally gets seen.`},
  {q:`Why keep permanent records of every notification?`,
   o:[`Marketing analytics`, `They're the receipts when someone claims "we were never told"`, `To reuse old messages`], a:1,
   why:`Proof of notification protects the bank in disputes — remember who pays when elections are missed.`}]},

{n:13, e:`📄`, t:`The document factory`, tag:`Statements, reports — and why nothing may be deleted`,
 deep:`week-2-product-and-digital-experience/day-13-document-management-and-client-reporting.md`,
 imagine:{e:`🖨️`, h:`Imagine a printing press with a legal department`,
  p:`Every month-end, a factory inside the bank prints (digitally) millions of statements, valuations and tax papers. Each must reach exactly the right reader, be findable in seconds years later — and by LAW, many can never be edited or deleted, like ink that can't be unprinted. Boring? This "factory" is the product clients touch most often. A missing statement at board-meeting time is a crisis.`},
 secs:[
  {h:`A document's life story`,
   b:``,
   d:{type:`flow`, steps:[
    {e:`🏭`, t:`Generate`, s:`Month-end: millions of documents composed from the books`},
    {e:`🏷️`, t:`Label`, s:`Tag each: which client, account, period, type — labels make search work`},
    {e:`🔐`, t:`Protect`, s:`Only entitled eyes see it (Day 11 again!)`},
    {e:`📬`, t:`Notify`, s:`"Your statement is ready" (Day 12 again!)`},
    {e:`🗄️`, t:`Retain`, s:`Kept unchangeable for years — the law says so`},
    {e:`🗑️`, t:`Eventually purge`, s:`After the legal period, deletion is also a rule`}]},
   b2:`<div class="callout">💡 See how the platform pieces snap together? Documents use the permission map from Day 11 and the notification pipeline from Day 12. Platform capabilities compound — that's why you build them once, centrally.</div>`},
  {h:`The unbreakable-ink rule`,
   b:`<p>Financial regulators require records kept in a form that <b>cannot be altered or deleted</b> — even by the bank itself — for set periods (often ~7 years). Storage is literally configured to refuse edits, like writing in permanent ink.</p>
   <p>Why so strict? If a dispute reaches court, the statement from March 2021 must be provably EXACTLY what the client saw. That's also why "just fix the typo in last month's statement" is never simple: the original stays; a correction is issued alongside it.</p>`},
  {h:`From paper-thinking to data-thinking`,
   b:`<p>Watch clients climb this ladder — and help them climb:</p>`,
   d:{type:`stack`, layers:[
    {e:`📄`, t:`PDF statements`, s:`Fine for boards and filing cabinets`},
    {e:`🔎`, t:`Searchable portal library`, s:`Find any doc in seconds — filters, no folder-diving`},
    {e:`📊`, t:`Interactive reports`, s:`Explore the numbers on screen, then export`},
    {e:`🔌`, t:`Raw data feeds`, s:`Numbers flow into the client's own systems — no documents at all`}]},
   b2:`<p>Sophisticated clients want the bottom rungs; smaller ones the top. Your portfolio serves the whole ladder — and the same underlying numbers must agree at every rung (a Week 3 obsession).</p>`},
 ],
 words:[
  {w:`Statement`, d:`The official periodic document listing an account's holdings, values and activity.`},
  {w:`Metadata`, d:`Labels on a document (client, date, type) — what makes millions of documents searchable.`},
  {w:`Retention`, d:`The legal duty to keep records, unaltered, for a set number of years.`},
  {w:`WORM`, d:`"Write Once, Read Many" — storage that physically refuses edits and deletes. The unbreakable ink.`},
  {w:`E-delivery`, d:`Delivering documents via portal/notification instead of post — with proof of delivery.`}],
 quiz:[
  {q:`Why can't the bank just edit last month's statement to fix a typo?`,
   o:[`The file format is read-only`, `Regulations require originals kept unchangeable; corrections are issued alongside`, `It can, if a manager agrees`], a:1,
   why:`Court-proof records mean the original stays forever; you add a correction, never replace.`},
  {q:`What makes millions of documents findable in seconds?`,
   o:[`Faster hard drives`, `Good labels (metadata) on every document`, `Fewer documents`], a:1,
   why:`Search is only as good as the tagging. Metadata design is real product work.`},
  {q:`A top client says "stop sending PDFs, send the numbers into our systems." This is…`,
   o:[`laziness`, `the natural top of the maturity ladder — data feeds instead of documents`, `impossible in banking`], a:1,
   why:`Sophisticated clients consume data, not paper. Serving the whole ladder is the strategy.`}]},

{n:14, e:`🤝`, t:`Getting a bank to say yes`, tag:`Stakeholders: the level where products live or die`,
 deep:`week-2-product-and-digital-experience/day-14-stakeholder-management-and-week-2-capstone.md`,
 imagine:{e:`🎬`, h:`Imagine directing a movie you don't fully control`,
  p:`A film director owns the vision but controls almost nothing directly: the studio funds it, actors perform it, lawyers clear it, censors rate it. Your roadmap is the same. Compliance can block a launch, operations can quietly not adopt it, sales promises things you never planned, and technology owns the builders. Directing without owning is the actual job of a VP — and there's a craft to it.`},
 secs:[
  {h:`Know what each partner treasures`,
   b:`<p>Influence is bartering, and each group trades in a different currency:</p>`,
   d:{type:`grid`, cards:[
    {e:`⚙️`, t:`Operations`, s:`Treasure: fewer manual chores. Bring tools that kill their pain — they'll champion you.`},
    {e:`🛡️`, t:`Compliance`, s:`Treasure: NO surprises. Involve them at the IDEA stage and they're partners, not blockers.`},
    {e:`💼`, t:`Sales`, s:`Treasure: stories that win deals. Give demos and safe roadmaps — they amplify you to clients.`},
    {e:`💻`, t:`Technology`, s:`Treasure: realistic plans and clear priorities. Respect constraints — get craftsmanship back.`},
    {e:`☎️`, t:`Client service`, s:`Treasure: advance warning and fewer angry calls. They hear EVERYTHING first — goldmine.`},
