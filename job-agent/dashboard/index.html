<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Hunt Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232a78d6'/><path d='M10 12h12v11H10z M13 12V9h6v3' fill='none' stroke='white' stroke-width='2.2' stroke-linejoin='round'/></svg>">
<style>
:root {
  color-scheme: light;
  --bg: #f6f6f4;
  --surface: #ffffff;
  --surface-2: #f0efec;
  --border: #e4e2dd;
  --text: #0b0b0b;
  --text-2: #52514e;
  --muted: #8a8883;
  --accent: #2a78d6;
  --accent-soft: #e6effb;
  --series-1: #2a78d6; /* LinkedIn */
  --series-2: #eb6834; /* Naukri */
  --series-3: #1baf7a;
  --seq-1: #86b6ef; --seq-2: #3987e5; --seq-3: #1c5cab;
  --good: #0f7b3f; --good-bg: #e3f4ea;
  --warn: #9a6200; --warn-bg: #fdf1d8;
  --crit: #b42318; --crit-bg: #fde8e7;
  --info: #1c5cab; --info-bg: #e6effb;
  --violet: #4a3aa7; --violet-bg: #ecebf8;
  --aqua: #0b7a55; --aqua-bg: #e0f4ec;
  --neutral-bg: #efeeeb;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --border: #2f2f2c;
    --text: #ffffff; --text-2: #c3c2b7; --muted: #8f8d85;
    --accent: #3987e5; --accent-soft: #1d2a3b;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
    --seq-1: #184f95; --seq-2: #2a78d6; --seq-3: #6da7ec;
    --good: #5fd08c; --good-bg: #183223; --warn: #f2bd4f; --warn-bg: #342a14;
    --crit: #f08a83; --crit-bg: #3a1c1a; --info: #86b6ef; --info-bg: #1d2a3b;
    --violet: #a99ff0; --violet-bg: #27243d; --aqua: #5ccfa3; --aqua-bg: #16302a;
    --neutral-bg: #2a2a27;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --border: #2f2f2c;
  --text: #ffffff; --text-2: #c3c2b7; --muted: #8f8d85;
  --accent: #3987e5; --accent-soft: #1d2a3b;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
  --seq-1: #184f95; --seq-2: #2a78d6; --seq-3: #6da7ec;
  --good: #5fd08c; --good-bg: #183223; --warn: #f2bd4f; --warn-bg: #342a14;
  --crit: #f08a83; --crit-bg: #3a1c1a; --info: #86b6ef; --info-bg: #1d2a3b;
  --violet: #a99ff0; --violet-bg: #27243d; --aqua: #5ccfa3; --aqua-bg: #16302a;
  --neutral-bg: #2a2a27;
  --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.45 ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 24px 16px 64px; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.brand { display: flex; align-items: center; gap: 12px; }
.logo { width: 40px; height: 40px; border-radius: 11px; background: linear-gradient(135deg, var(--series-1), #6c5ce7); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 17px; }
h1 { font-size: 21px; margin: 0; letter-spacing: -.3px; }
.sub { color: var(--text-2); font-size: 13px; }
.actions { display: flex; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 7px 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.07); }
.icon-btn { width: 34px; height: 34px; padding: 0; justify-content: center; }
.live { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); display: inline-block; }

.kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 16px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.kpi { padding: 14px 16px; }
.kpi .label { color: var(--text-2); font-size: 12.5px; }
.kpi .value { font-size: 28px; font-weight: 650; letter-spacing: -.5px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi .hint { color: var(--muted); font-size: 12px; }
.kpi.attention { cursor: pointer; }
.kpi.attention .value { color: var(--warn); }

.grid2 { display: grid; grid-template-columns: 1.7fr 1fr; gap: 12px; margin-bottom: 16px; }
.panel { padding: 16px 18px; }
.panel h2 { font-size: 14px; margin: 0; font-weight: 620; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.axis text { fill: var(--muted); font-size: 11px; }
.gridline { stroke: var(--border); stroke-width: 1; }
.tooltip { position: absolute; pointer-events: none; background: var(--text); color: var(--bg); padding: 7px 10px; border-radius: 8px; font-size: 12px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); opacity: 0; transition: opacity .12s; z-index: 5; }
.tooltip b { font-weight: 650; }

.funnel { display: flex; flex-direction: column; gap: 11px; margin-top: 6px; }
.funnel .row { display: grid; grid-template-columns: 92px 1fr 44px; align-items: center; gap: 10px; font-size: 13px; }
.funnel .bar { height: 22px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
.funnel .bar > div { height: 100%; border-radius: 4px; min-width: 4px; transition: width .4s ease; }
.funnel .num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.funnel-note { color: var(--muted); font-size: 12px; margin-top: 12px; }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.search { flex: 1 1 220px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 10px; padding: 7px 11px; background: var(--bg); }
.search input { border: 0; outline: 0; background: transparent; width: 100%; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--border); background: var(--surface); padding: 5px 11px; border-radius: 999px; cursor: pointer; font-size: 12.5px; color: var(--text-2); }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.chip .n { opacity: .65; margin-left: 4px; font-variant-numeric: tabular-nums; }
select.sel { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 6px 10px; }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 550; padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr.job:hover td { background: var(--surface-2); }
tr.job { cursor: pointer; }
.job-title { font-weight: 600; }
.job-co { color: var(--text-2); font-size: 13px; }
.why { color: var(--muted); font-size: 12px; margin-top: 2px; }
.tier { display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; color: var(--text-2); background: var(--surface-2); vertical-align: 1px; white-space: nowrap; }
.focus { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: -6px 0 16px; }
.focus-label { color: var(--text-2); font-size: 12.5px; margin-right: 4px; }
.platform { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-2); }
.platform i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.score { display: flex; align-items: center; gap: 8px; min-width: 96px; }
.score .track { flex: 1; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.score .fill { height: 100%; border-radius: 3px; }
.score span { font-variant-numeric: tabular-nums; font-size: 12.5px; width: 30px; text-align: right; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 12.5px; font-weight: 550; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status-select { appearance: none; border: 0; cursor: pointer; padding-right: 12px; }
.date { color: var(--text-2); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.links { display: flex; gap: 10px; font-size: 13px; white-space: nowrap; }
.empty { text-align: center; padding: 48px 16px; color: var(--text-2); }
.empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }
code { background: var(--surface-2); padding: 1px 6px; border-radius: 5px; font-size: 12.5px; }

tr.detail td { background: var(--surface-2); padding: 14px 18px 18px; cursor: default; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; }
.detail-grid h4 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 550; text-transform: uppercase; letter-spacing: .6px; }
.detail-grid ul { margin: 0; padding-left: 18px; }
.tag { display: inline-block; background: var(--crit-bg); color: var(--crit); border-radius: 6px; padding: 1px 8px; margin: 0 4px 4px 0; font-size: 12.5px; }
.timeline { list-style: none; padding: 0 !important; margin: 0; }
.timeline li { padding-left: 14px; position: relative; margin-bottom: 6px; font-size: 13px; }
.timeline li::before { content: ""; position: absolute; left: 0; top: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.timeline time { color: var(--muted); font-size: 12px; margin-right: 6px; }
textarea.notes { width: 100%; min-height: 76px; border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; background: var(--surface); resize: vertical; }
.saved { color: var(--good); font-size: 12px; opacity: 0; transition: opacity .2s; }
.saved.show { opacity: 1; }

.table-wrap { overflow-x: auto; }
.foot { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; padding: 10px 14px; flex-wrap: wrap; gap: 8px; }

dialog { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); padding: 0; width: min(460px, calc(100vw - 32px)); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog form { padding: 20px; display: grid; gap: 12px; }
dialog h3 { margin: 0 0 4px; }
dialog label { display: grid; gap: 4px; font-size: 13px; color: var(--text-2); }
dialog input, dialog select { border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; background: var(--bg); }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
.banner { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; display: none; }


.agent { padding: 16px 18px; margin-bottom: 16px; }
.agents { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 12px; margin-bottom: 16px; }
.agents .agent { margin-bottom: 0; }
.agent-group { grid-column: 1 / -1; margin: 8px 0 -4px; font-size: 13px; font-weight: 600; color: var(--text-2); }
.agent-group .n { opacity: .6; margin-left: 6px; font-weight: 500; }
.agent.profile-only .agent-controls, .agent.profile-only .mode-hint, .agent.profile-only [data-el="btn"] { display: none; }
.agent-note { margin-top: 6px; font-size: 12px; color: var(--muted); }
.agents-line { color: var(--text-2); font-size: 12.5px; margin: -4px 0 10px; }
.agent-title .pf { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 7px; vertical-align: 1px; }
.agents .seg button { padding: 6px 10px; font-size: 12.5px; }
.agent .keep { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
@media (max-width: 1080px) { .agents { grid-template-columns: 1fr; } }

.agent-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.agent-state { display: flex; align-items: center; gap: 12px; }
.agent-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); flex: none; }
.agent-dot.run { background: var(--good); box-shadow: 0 0 0 0 var(--good); animation: pulse 1.6s infinite; }
.agent-dot.wait { background: var(--warn); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 55%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
.agent-title { font-weight: 620; }
.agent-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 7px 12px; cursor: pointer; color: var(--text-2); font-size: 13px; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.seg button:disabled { cursor: not-allowed; opacity: .6; }
.num-input { width: 64px; border: 1px solid var(--border); border-radius: 10px; padding: 6px 8px; background: var(--surface); }
.btn.go { background: var(--good); border-color: var(--good); color: #fff; min-width: 96px; justify-content: center; }
.btn.stop { background: var(--crit); border-color: var(--crit); color: #fff; min-width: 96px; justify-content: center; }
.mode-hint { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
.ask { margin-top: 14px; background: var(--warn-bg); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.ask-q { color: var(--text); font-weight: 560; }
.now { margin-top: 12px; border: 1px solid var(--border, rgba(127,127,127,.25)); border-radius: 12px; padding: 10px 12px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.now[hidden] { display: none; }
.now-job { min-width: 0; font-weight: 560; overflow-wrap: anywhere; }
.now-job small { display: block; font-size: 11.5px; letter-spacing: .5px; text-transform: uppercase; opacity: .65; font-weight: 600; margin-bottom: 2px; }
.ask-q small { display: block; color: var(--warn); font-weight: 600; font-size: 11.5px; letter-spacing: .5px; text-transform: uppercase; margin-bottom: 2px; }
.ask-btns { display: flex; gap: 8px; }
.logbox { margin-top: 12px; background: #0f1012; color: #d8d6cf; border-radius: 10px; font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 10px 12px; max-height: 240px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
.logbox .err, .logbox .warn { color: #f2bd4f; }
.logbox .ok { color: #5fd08c; }
.logbox .sys { color: #86b6ef; }
.logbox .ask { all: unset; color: #f0a0c8; display: block; }
.log-toggle { background: none; border: 0; color: var(--text-2); cursor: pointer; font-size: 12.5px; padding: 0; margin-top: 10px; }
.msg-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 13px; white-space: pre-wrap; }
.msg-actions { display: flex; gap: 10px; align-items: center; margin-top: 6px; font-size: 12.5px; flex-wrap: wrap; }
.msg-actions button { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-size: 12.5px; }
.msg-edit { width: 100%; min-height: 150px; border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; background: var(--surface); resize: vertical; font-size: 13px; line-height: 1.5; }
.msg-subject { width: 100%; border: 1px solid var(--border); border-radius: 9px; padding: 7px 10px; background: var(--surface); font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.msg-actions .btn.primary { padding: 5px 12px; font-size: 12.5px; color: #fff; }
.badge-sent { color: var(--good); font-weight: 600; }
.badge-draft { color: var(--muted); }

@media (max-width: 1080px) { .kpis { grid-template-columns: repeat(3, 1fr); } .grid2 { grid-template-columns: 1fr; } }
@media (max-width: 720px) {
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .hide-sm { display: none; }
  .detail-grid { grid-template-columns: 1fr; }
  td, th { padding: 10px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo" id="initials">JA</div>
      <div>
        <h1 id="heading">Job Hunt Tracker</h1>
        <div class="sub" id="subheading">Applications from the job agent · LinkedIn, Naukri &amp; more</div>
      </div>
    </div>
    <div class="actions">
      <span class="live" title="Refreshes every 15 seconds"><i></i><span id="updated">Live</span></span>
      <button class="btn go" id="startAllBtn" title="Start every site's agent with the settings on its card">▶ Start all</button>
      <button class="btn stop" id="stopAllBtn" title="Stop every running agent">■ Stop all</button>
      <button class="btn" id="profilesBtn" title="Update her profile on every site from the resume (one site after another)">↻ Update all profiles</button>
      <button class="btn" id="logsBtn" title="Download today's agent logs and a summary of where jobs got stuck (send this file to get problems fixed)">⇩ Logs</button>
      <button class="btn" id="exportBtn" title="Download CSV">⇩ CSV</button>
      <button class="btn primary" id="addBtn">+ Add job</button>
      <button class="btn icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg></button>
    </div>
  </header>

  <div class="agents-line" id="agentsLine"></div>
  <section class="agents" id="agents"></section>

  <div class="banner" id="banner"></div>

  <section class="kpis" id="kpis"></section>
  <div class="focus" id="focus" title="Which of her stacks the applied jobs are about — the agent takes jobs in this order"></div>

  <section class="grid2">
    <div class="card panel">
      <div class="panel-head">
        <h2>Applications per day <span class="sub">· last 21 days</span></h2>
        <div class="legend" id="legend"></div>
      </div>
      <div class="chart" id="daily"><div class="tooltip" id="tip"></div></div>
    </div>
    <div class="card panel">
      <div class="panel-head"><h2>Pipeline</h2><span class="sub" id="pipelineSub"></span></div>
      <div class="funnel" id="funnel"></div>
      <div class="funnel-note" id="funnelNote"></div>
    </div>
  </section>

  <section class="card">
    <div class="toolbar">
      <label class="search"><span aria-hidden="true">⌕</span><input id="q" placeholder="Search company, title, location…" autocomplete="off"></label>
      <div class="chips" id="statusChips"></div>
      <select class="sel" id="platformSel" aria-label="Platform">
        <option value="">All platforms</option>
      </select>
      <select class="sel" id="tierSel" aria-label="Stack" title="Magento, PHP, React, Node, front end or full stack jobs">
        <option value="">All stacks</option>
      </select>
      <select class="sel" id="sortSel" aria-label="Sort">
        <option value="recent">Most recent</option><option value="priority">Magento → PHP → React</option><option value="score">Best match</option><option value="company">Company A–Z</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Job</th><th class="hide-sm">Platform</th><th class="hide-sm">Match</th><th>Status</th><th class="hide-sm">Date</th><th class="hide-sm">Links</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="foot"><span id="count"></span><span>Click a row for match details, history and notes.</span></div>
  </section>
</div>

<dialog id="addDialog">
  <form method="dialog" id="addForm">
    <h3>Add a job you applied to yourself</h3>
    <label>Company<input name="company" required></label>
    <label>Job title<input name="title" required></label>
    <label>Link<input name="url" type="url" placeholder="https://"></label>
    <label>Platform<select name="platform"><option value="linkedin">LinkedIn</option><option value="naukri">Naukri</option><option value="other">Company site / other</option></select></label>
    <label>Status<select name="status"></select></label>
    <div class="dialog-actions"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">Add</button></div>
  </form>
</dialog>

<script>
const STATUS = {
  applied:         { label: "Applied",         fg: "var(--info)",   bg: "var(--info-bg)" },
  interview:       { label: "Interview",       fg: "var(--violet)", bg: "var(--violet-bg)" },
  offer:           { label: "Offer",           fg: "var(--good)",   bg: "var(--good-bg)" },
  rejected:        { label: "Rejected",        fg: "var(--crit)",   bg: "var(--crit-bg)" },
  needs_attention: { label: "Retrying",        fg: "var(--warn)",   bg: "var(--warn-bg)" },
  external:        { label: "Apply on site",   fg: "var(--aqua)",   bg: "var(--aqua-bg)" },
  shortlisted:     { label: "Shortlisted",     fg: "var(--text-2)", bg: "var(--neutral-bg)" },
  unable:          { label: "Couldn't apply",  fg: "var(--crit)",   bg: "var(--crit-bg)" },
  skipped:         { label: "Skipped",         fg: "var(--muted)",  bg: "var(--neutral-bg)" },
  withdrawn:       { label: "Withdrawn",       fg: "var(--muted)",  bg: "var(--neutral-bg)" },
};
let PLATFORM = { linkedin: { label: "LinkedIn", color: "var(--series-1)" }, naukri: { label: "Naukri", color: "var(--series-2)" }, other: { label: "Other", color: "var(--muted)" } };
const platformOf = (k) => PLATFORM[k] ?? { label: k ? k[0].toUpperCase() + k.slice(1) : "Other", color: PLATFORM.other.color };
// Which of her stacks a job is about, in the order the agent takes jobs (Magento → PHP → React → Node →
// front end → full stack). The agent stores it on each job; older rows are classified here from the title.
let TIER_DEFS = [
  { name: "Magento", keywords: ["magento", "adobe commerce"] }, { name: "PHP", keywords: ["php", "laravel", "wordpress", "woocommerce"] },
  { name: "React", keywords: ["react", "reactjs", "react.js", "next.js", "nextjs", "typescript"] }, { name: "Node", keywords: ["node.js", "nodejs", "node js", "node", "mern"] },
  { name: "Front end", keywords: ["front end", "frontend", "front-end", "ui developer", "web developer", "javascript", "html", "css"] },
  { name: "Full stack", keywords: ["full stack", "fullstack", "full-stack", "shopify", "e-commerce", "ecommerce"] },
];
let TIER_RES = [];
const tierNames = () => [...TIER_DEFS.map((t) => t.name), "Other"];
function setTiers(list) {
  if (Array.isArray(list) && list.length) TIER_DEFS = list;
  TIER_RES = TIER_DEFS.map((t) => new RegExp(`(^|[^a-z])(${t.keywords.map((k) => k.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|")})([^a-z0-9]|$)`, "i"));
  const sel = $("#tierSel");
  if (sel) sel.innerHTML = `<option value="">All stacks</option>` + tierNames().map((n) => `<option value="${esc(n)}" ${state.tier === n ? "selected" : ""}>${esc(n)}</option>`).join("");
}
function tierOfRow(r) {
  if (r.tier) return r.tier;
  if (!TIER_RES.length) setTiers();
  for (const text of [r.title || "", (r.matchReasons || []).join(" ")]) {
    const i = text ? TIER_RES.findIndex((re) => re.test(text)) : -1;
    if (i >= 0) return TIER_DEFS[i].name;
  }
  return "Other";
}
const tierIndex = (r) => { const i = tierNames().indexOf(tierOfRow(r)); return i < 0 ? 99 : i; };
const APPLIED_LIKE = new Set(["applied", "interview", "offer", "rejected", "withdrawn"]);

const state = { rows: [], statuses: Object.keys(STATUS), filter: "active", q: "", platform: "", tier: "", sort: "recent", open: new Set() };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const day = (d) => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`; };
const fmtDate = (d) => d ? new Date(d).toLocaleDateString(undefined, { day: "numeric", month: "short" }) : "—";
const ago = (d) => {
  const s = (Date.now() - new Date(d)) / 1000;
  if (s < 3600) return `${Math.max(1, Math.round(s / 60))}m ago`;
  if (s < 86400) return `${Math.round(s / 3600)}h ago`;
  return `${Math.round(s / 86400)}d ago`;
};

// Theme toggle (remembered per browser).
try { const t = localStorage.getItem("ja-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
$("#themeBtn").onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("ja-theme", document.documentElement.dataset.theme); } catch {}
};

async function load() {
  try {
    const r = await fetch("/api/applications", { cache: "no-store" });
    const data = await r.json();
    state.rows = data.rows;
    $("#banner").style.display = "none";
    $("#updated").textContent = "Updated " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  } catch {
    $("#banner").style.display = "block";
    $("#banner").textContent = "Can't reach the dashboard server. Start it with “npm run dashboard” in the job-agent folder.";
  }
  render();
}

function render() {
  renderKpis();
  renderDaily();
  renderFunnel();
  renderChips();
  // Don't redraw the table under someone typing a note or editing a message.
  if (!document.activeElement?.matches("#rows textarea, #rows input")) renderTable();
}

function renderKpis() {
  const rows = state.rows;
  const applied = rows.filter((r) => APPLIED_LIKE.has(r.status));
  const weekAgo = Date.now() - 7 * 864e5;
  const thisWeek = applied.filter((r) => r.appliedAt && new Date(r.appliedAt) > weekAgo).length;
  const interviews = rows.filter((r) => r.status === "interview" || r.status === "offer").length;
  const responded = rows.filter((r) => ["interview", "offer", "rejected"].includes(r.status)).length;
  const attention = rows.filter((r) => r.status === "needs_attention" || r.status === "external").length;
  const scored = applied.filter((r) => r.matchScore != null);
  const avg = scored.length ? Math.round(scored.reduce((a, r) => a + r.matchScore, 0) / scored.length) : null;
  const today = applied.filter((r) => r.appliedAt && day(r.appliedAt) === day(new Date())).length;
  const k = [
    { label: "Applied", value: applied.length, hint: `${today} today` },
    { label: "This week", value: thisWeek, hint: "last 7 days" },
    { label: "Interviews", value: interviews, hint: rows.some((r) => r.status === "offer") ? `${rows.filter((r) => r.status === "offer").length} offer 🎉` : "incl. offers" },
    { label: "Response rate", value: applied.length ? Math.round((responded / applied.length) * 100) + "%" : "—", hint: `${responded} heard back` },
    { label: "Avg. match", value: avg != null ? avg + "%" : "—", hint: "of applied jobs" },
    { label: "In progress", value: attention, hint: `agent retries these · ${rows.filter((r) => r.status === "unable").length} couldn't apply`, cls: "attention" },
  ];
  $("#kpis").innerHTML = k.map((x) => `<div class="card kpi ${x.cls ?? ""}" ${x.cls ? 'role="button" tabindex="0" title="Show these jobs"' : ""}>
    <div class="label">${x.label}</div><div class="value">${x.value}</div><div class="hint">${x.hint}</div></div>`).join("");
  const att = $("#kpis .attention");
  att.onclick = att.onkeydown = (e) => { if (e.type === "keydown" && e.key !== "Enter") return; state.filter = "todo"; render(); document.querySelector(".toolbar").scrollIntoView({ behavior: "smooth" }); };
  const byTier = {};
  for (const r of applied) { const t = tierOfRow(r); byTier[t] = (byTier[t] || 0) + 1; }
  const focus = $("#focus");
  focus.innerHTML = applied.length ? `<span class="focus-label">Applied by stack</span>` + tierNames().map((n) => `<button class="chip" aria-pressed="${state.tier === n}" data-t="${esc(n)}">${esc(n)}<span class="n">${byTier[n] || 0}</span></button>`).join("") : "";
  focus.querySelectorAll(".chip").forEach((b) => (b.onclick = () => { state.tier = state.tier === b.dataset.t ? "" : b.dataset.t; $("#tierSel").value = state.tier; renderTable(); renderKpis(); }));
}

function renderDaily() {
  const days = 21;
  const buckets = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(Date.now() - i * 864e5);
    buckets.push({ key: day(d), date: d, counts: {} });
  }
  const idx = Object.fromEntries(buckets.map((b, i) => [b.key, i]));
  for (const r of state.rows) {
    if (!r.appliedAt || !APPLIED_LIKE.has(r.status)) continue;
    const i = idx[day(r.appliedAt)];
    if (i != null) buckets[i].counts[r.platform || "other"] = (buckets[i].counts[r.platform || "other"] ?? 0) + 1;
  }
  const W = 720, H = 220, L = 28, R = 8, T = 10, B = 26;
  const total = (b) => Object.values(b.counts).reduce((a, v) => a + v, 0);
  const order = [...Object.keys(PLATFORM).filter((k) => k !== "other"), ...new Set(buckets.flatMap((b) => Object.keys(b.counts)).filter((k) => !PLATFORM[k]))];
  const max = Math.max(4, ...buckets.map(total));
  const step = Math.ceil(max / 4);
  const top = step * 4;
  const bw = (W - L - R) / days;
  const barW = Math.min(22, bw * 0.62);
  const y = (v) => T + (H - T - B) * (1 - v / top);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Applications per day, last ${days} days"><g class="axis">`;
  for (let v = 0; v <= top; v += step) svg += `<line class="gridline" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  buckets.forEach((b, i) => {
    if (i % 3 === 0 || i === days - 1) svg += `<text x="${L + bw * i + bw / 2}" y="${H - 6}" text-anchor="middle">${b.date.toLocaleDateString(undefined, { day: "numeric", month: "short" })}</text>`;
  });
  svg += `</g>`;
  buckets.forEach((b, i) => {
    const x = L + bw * i + (bw - barW) / 2;
    const segs = order.filter((k) => b.counts[k] > 0).map((k) => [k, platformOf(k).color]);
    let base = 0;
    segs.forEach(([k, color], si) => {
      const y0 = y(base), y1 = y(base + b.counts[k]);
      const isTop = si === segs.length - 1;
      const h = Math.max(0, y0 - y1 - (si > 0 ? 2 : 0)); // 2px surface gap between stacked segments
      const r = isTop ? Math.min(4, h / 2, barW / 2) : 0;
      svg += `<path d="${roundedTop(x, y1, barW, h, r)}" fill="${color}"/>`;
      base += b.counts[k];
    });
    svg += `<rect class="hit" data-i="${i}" x="${L + bw * i}" y="${T}" width="${bw}" height="${H - T - B}" fill="transparent"/>`;
  });
  svg += `</svg>`;
  const host = $("#daily");
  host.querySelector("svg")?.remove();
  host.insertAdjacentHTML("afterbegin", svg);
  const tip = $("#tip");
  host.querySelectorAll(".hit").forEach((el) => {
    el.onmouseenter = () => {
      const b = buckets[+el.dataset.i];
      const rect = host.getBoundingClientRect(), r = el.getBoundingClientRect();
      tip.innerHTML = `<b>${b.date.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" })}</b><br>${order.filter((k) => b.counts[k] > 0).map((k) => `${platformOf(k).label} ${b.counts[k]}`).join(" · ") || "no applications"}`;
      tip.style.left = r.left - rect.left + r.width / 2 + "px";
      tip.style.top = (y(total(b)) / H) * rect.height + "px";
      tip.style.opacity = 1;
      el.setAttribute("fill", "rgba(127,127,127,.08)");
    };
    el.onmouseleave = () => { tip.style.opacity = 0; el.setAttribute("fill", "transparent"); };
  });
}
function roundedTop(x, y, w, h, r) {
  if (h <= 0) return "";
  return `M${x},${y + h} V${y + r} Q${x},${y} ${x + r},${y} H${x + w - r} Q${x + w},${y} ${x + w},${y + r} V${y + h} Z`;
}

function renderFunnel() {
  const c = (f) => state.rows.filter(f).length;
  const applied = c((r) => APPLIED_LIKE.has(r.status));
  const stages = [
    { label: "Matched", n: c((r) => r.status !== "skipped"), color: "var(--seq-1)" },
    { label: "Applied", n: applied, color: "var(--seq-2)" },
    { label: "Interview", n: c((r) => r.status === "interview" || r.status === "offer"), color: "var(--seq-3)" },
    { label: "Offer", n: c((r) => r.status === "offer"), color: "var(--good)" },
  ];
  const max = Math.max(1, stages[0].n);
  $("#funnel").innerHTML = stages.map((s) => `<div class="row"><span>${s.label}</span>
    <div class="bar"><div style="width:${(s.n / max) * 100}%;background:${s.color}"></div></div><span class="num">${s.n}</span></div>`).join("");
  const scanned = state.rows.length;
  const skipped = c((r) => r.status === "skipped");
  $("#pipelineSub").textContent = `${scanned} jobs reviewed`;
  $("#funnelNote").textContent = scanned ? `${skipped} skipped as poor fits · ${c((r) => r.status === "rejected")} rejections so far` : "";
}

const FILTERS = [
  { key: "active", label: "Active", test: (r) => r.status !== "skipped" && r.status !== "withdrawn" && r.status !== "unable" },
  { key: "todo", label: "In progress", test: (r) => r.status === "needs_attention" || r.status === "external" || r.status === "shortlisted" },
  { key: "applied", label: "Applied", test: (r) => r.status === "applied" },
  { key: "interview", label: "Interviews", test: (r) => r.status === "interview" || r.status === "offer" },
  { key: "rejected", label: "Rejected", test: (r) => r.status === "rejected" },
  { key: "unable", label: "Couldn't apply", test: (r) => r.status === "unable" },
  { key: "skipped", label: "Skipped", test: (r) => r.status === "skipped" },
  { key: "all", label: "All", test: () => true },
];
function renderChips() {
  $("#statusChips").innerHTML = FILTERS.map((f) => `<button class="chip" aria-pressed="${state.filter === f.key}" data-k="${f.key}">${f.label}<span class="n">${state.rows.filter(f.test).length}</span></button>`).join("");
  $("#statusChips").querySelectorAll(".chip").forEach((b) => (b.onclick = () => { state.filter = b.dataset.k; render(); }));
}

function visibleRows() {
  const f = FILTERS.find((x) => x.key === state.filter) ?? FILTERS[0];
  const q = state.q.toLowerCase();
  const rows = state.rows.filter((r) => f.test(r)
    && (!state.platform || r.platform === state.platform)
    && (!state.tier || tierOfRow(r) === state.tier)
    && (!q || `${r.company} ${r.title} ${r.location} ${r.notes}`.toLowerCase().includes(q)));
  const when = (r) => new Date(r.appliedAt || r.updatedAt || r.foundAt).getTime();
  rows.sort(state.sort === "priority" ? (a, b) => tierIndex(a) - tierIndex(b) || when(b) - when(a)
    : state.sort === "score" ? (a, b) => (b.matchScore ?? -1) - (a.matchScore ?? -1)
    : state.sort === "company" ? (a, b) => String(a.company).localeCompare(b.company)
    : (a, b) => when(b) - when(a));
  return rows;
}

function lastNote(r) {
  const h = [...(r.history ?? [])].reverse().find((x) => x.note);
  const gaps = r.status === "skipped" && r.missingSkills?.length ? ` · missing ${r.missingSkills.slice(0, 3).join(", ")}` : "";
  return (r.lastNote || h?.note || "") + gaps;
}
function scoreColor(s) { return s >= 85 ? "var(--seq-3)" : s >= 70 ? "var(--seq-2)" : "var(--seq-1)"; }

function renderTable() {
  const rows = visibleRows();
  $("#count").textContent = `${rows.length} of ${state.rows.length} jobs`;
  if (!state.rows.length) {
    $("#rows").innerHTML = `<tr><td colspan="6" class="empty"><b>No applications yet</b>Run <code>npm run agent</code> to start applying, or <code>npm run demo-data</code> to preview with sample data.</td></tr>`;
    return;
  }
  if (!rows.length) { $("#rows").innerHTML = `<tr><td colspan="6" class="empty"><b>Nothing here</b>Try another filter.</td></tr>`; return; }
  $("#rows").innerHTML = rows.map((r) => {
    const st = STATUS[r.status] ?? STATUS.shortlisted;
    const p = platformOf(r.platform);
    const open = state.open.has(r.id);
    const opts = state.statuses.map((s) => `<option value="${s}" ${s === r.status ? "selected" : ""}>${(STATUS[s] ?? { label: s }).label}</option>`).join("");
    return `<tr class="job" data-id="${esc(r.id)}" aria-expanded="${open}">
      <td><div class="job-title">${esc(r.title) || "<span class=sub>(untitled)</span>"}${tierOfRow(r) !== "Other" ? `<span class="tier">${esc(tierOfRow(r))}</span>` : ""}</div><div class="job-co">${esc(r.company)}${r.location ? " · " + esc(r.location) : ""}</div>${r.status === "skipped" || r.status === "needs_attention" ? `<div class="why">${esc(lastNote(r))}</div>` : ""}</td>
      <td class="hide-sm"><span class="platform"><i style="background:${p.color}"></i>${p.label}</span></td>
      <td class="hide-sm">${r.matchScore != null ? `<div class="score" title="Match ${r.matchScore}%"><div class="track"><div class="fill" style="width:${r.matchScore}%;background:${scoreColor(r.matchScore)}"></div></div><span>${r.matchScore}</span></div>` : '<span class="date">—</span>'}</td>
      <td><select class="pill status-select" data-id="${esc(r.id)}" style="color:${st.fg};background:${st.bg}" aria-label="Status">${opts}</select></td>
      <td class="hide-sm"><span class="date" title="${esc(r.appliedAt || r.foundAt)}">${fmtDate(r.appliedAt || r.foundAt)}</span></td>
      <td class="hide-sm"><div class="links">${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">Job ↗</a>` : ""}${r.resumeFile ? `<a href="/files/${esc(r.resumeFile)}" target="_blank">Resume</a>` : ""}</div></td>
    </tr>${open ? detailRow(r) : ""}`;
  }).join("");

  $("#rows").querySelectorAll("tr.job").forEach((tr) => (tr.onclick = (e) => {
    if (e.target.closest("select, a")) return;
    const id = tr.dataset.id;
    state.open.has(id) ? state.open.delete(id) : state.open.add(id);
    renderTable();
  }));
  $("#rows").querySelectorAll(".status-select").forEach((s) => (s.onchange = () => patch(s.dataset.id, { status: s.value })));
  $("#rows").querySelectorAll("textarea.notes").forEach((t) => {
    let timer;
    t.oninput = () => { clearTimeout(timer); timer = setTimeout(async () => { await patch(t.dataset.id, { notes: t.value }, false); const ok = t.parentElement.querySelector(".saved"); ok.classList.add("show"); setTimeout(() => ok.classList.remove("show"), 1200); }, 600); };
  });
}

function detailRow(r) {
  const reasons = (r.matchReasons ?? []).map((x) => `<li>${esc(x)}</li>`).join("") || "<li>—</li>";
  const missing = (r.missingSkills ?? []).map((x) => `<span class="tag">${esc(x)}</span>`).join("") || '<span class="sub">None flagged</span>';
  const hist = [...(r.history ?? [])].reverse().map((h) => `<li><time>${fmtDate(h.at)} · ${ago(h.at)}</time>${esc((STATUS[h.status] ?? { label: h.status }).label)}${h.note ? ` — <span class="sub">${esc(h.note)}</span>` : ""}</li>`).join("");
  return `<tr class="detail"><td colspan="6"><div class="detail-grid">
    <div><h4>Why it matches</h4><ul>${reasons}</ul><h4 style="margin-top:12px">Gaps</h4>${missing}</div>
    <div><h4>History</h4><ul class="timeline">${hist || "<li>—</li>"}</ul>${messageBlock(r)}</div>
    <div><h4>Notes <span class="saved">✓ saved</span></h4><textarea class="notes" data-id="${esc(r.id)}" placeholder="Recruiter name, interview date, salary discussed…">${esc(r.notes)}</textarea>
      <div class="links" style="margin-top:8px">${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">Open job ↗</a>` : ""}${r.resumeFile ? `<a href="/files/${esc(r.resumeFile)}" target="_blank">Tailored resume (PDF)</a>` : ""}</div></div>
  </div></td></tr>`;
}

async function patch(id, body, rerender = true) {
  const r = await fetch(`/api/applications/${encodeURIComponent(id)}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) return;
  const row = await r.json();
  state.rows = state.rows.map((x) => (x.id === id ? row : x));
  if (rerender) render();
}

$("#q").oninput = (e) => { state.q = e.target.value; renderTable(); };
$("#platformSel").onchange = (e) => { state.platform = e.target.value; renderTable(); };
$("#tierSel").onchange = (e) => { state.tier = e.target.value; renderTable(); renderKpis(); };
$("#sortSel").onchange = (e) => { state.sort = e.target.value; renderTable(); };

$("#addForm").status.innerHTML = ["applied", "interview", "offer", "rejected", "shortlisted"].map((s) => `<option value="${s}">${STATUS[s].label}</option>`).join("");
$("#addBtn").onclick = () => $("#addDialog").showModal();
$("#addDialog").onclose = async () => {
  if ($("#addDialog").returnValue !== "ok") return;
  const body = Object.fromEntries(new FormData($("#addForm")));
  await fetch("/api/applications", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  $("#addForm").reset();
  load();
};

$("#logsBtn").onclick = () => { window.location.href = "/api/logs"; };
$("#exportBtn").onclick = () => {
  const cols = ["company", "title", "stack", "platform", "status", "matchScore", "appliedAt", "location", "url", "notes"];
  const csv = [cols.join(","), ...visibleRows().map((r) => cols.map((c) => `"${String(c === "stack" ? tierOfRow(r) : r[c] ?? "").replace(/"/g, '""')}"`).join(","))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = `applications-${day(new Date())}.csv`;
  a.click();
};

fetch("/api/profile").then((r) => r.json()).then((p) => {
  if (!p.name) return;
  const first = p.name.split(" ")[0];
  $("#heading").textContent = `${first}'s Job Hunt`;
  $("#initials").textContent = p.name.split(" ").map((w) => w[0]).slice(0, 2).join("");
  if (p.headline) $("#subheading").textContent = `${p.headline} · 50 job sites`;
  if (p.sourceResume?.name) $("#subheading").textContent += ` · resume: ${p.sourceResume.name} (${new Date(p.sourceResume.mtimeMs).toLocaleDateString(undefined, { day: "numeric", month: "short" })})`;
  document.title = `${first}'s Job Hunt`;
}).catch(() => {});

function messageBlock(r) {
  const m = r.hiringMessage;
  if (!m?.full) return "";
  const c = r.hiringContact;
  const who = c?.name ? (c.profileUrl ? `<a href="${esc(c.profileUrl)}" target="_blank" rel="noopener">${esc(c.name)} ↗</a>` : esc(c.name)) : "the hiring team";
  const sent = r.messageStatus === "sent";
  const st = sent ? `<span class="badge-sent">✓ Sent on LinkedIn${r.messageSentAt ? " · " + fmtDate(r.messageSentAt) : ""}</span>`
    : `<span class="badge-draft">Draft${r.messageNote ? " · " + esc(r.messageNote) : ""}</span>`;
  const canSend = !sent && r.platform === "linkedin";
  return `<h4 style="margin-top:14px">Message to ${who}${c?.title ? ` <span style="text-transform:none;letter-spacing:0">· ${esc(c.title)}</span>` : ""}</h4>
    ${m.subject ? `<input class="msg-subject" data-id="${esc(r.id)}" value="${esc(m.subject)}" aria-label="Subject" ${sent ? "readonly" : ""}>` : ""}
    <textarea class="msg-edit" data-id="${esc(r.id)}" ${sent ? "readonly" : ""} aria-label="Message">${esc(m.full)}</textarea>
    <div class="msg-actions">${st}
      ${canSend ? `<button class="btn primary send-msg" data-id="${esc(r.id)}">Send on LinkedIn</button>` : ""}
      <button data-copy-from="${esc(r.id)}">Copy message</button>
      ${m.short ? `<button data-copy="${esc(m.short)}">Copy short note</button>` : ""}
      <span class="saved">✓ saved</span></div>`;
}
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-copy], [data-copy-from]");
  if (b) {
    e.stopPropagation();
    const text = b.dataset.copy ?? document.querySelector(`textarea.msg-edit[data-id="${CSS.escape(b.dataset.copyFrom)}"]`)?.value ?? "";
    const label = b.textContent;
    try { await navigator.clipboard.writeText(text); b.textContent = "✓ Copied"; } catch { b.textContent = "Copy failed"; }
    setTimeout(() => (b.textContent = label), 1500);
    return;
  }
  const sendBtn = e.target.closest(".send-msg");
  if (!sendBtn) return;
  e.stopPropagation();
  const id = sendBtn.dataset.id;
  const row = state.rows.find((x) => x.id === id);
  if (!confirm(`Send this message to ${row?.hiringContact?.name || "the hiring team"} at ${row?.company} on LinkedIn now?`)) return;
  await flushMessageEdits();
  sendBtn.disabled = true;
  sendBtn.textContent = "Sending… (watch the agent's Chrome)";
  try {
    const r = await (await fetch(`/api/applications/${encodeURIComponent(id)}/send-message`, { method: "POST" })).json();
    if (r.result?.status !== "sent") alert(`Not sent: ${r.result?.note || "unknown error"}`);
  } catch { alert("Couldn't reach the dashboard server"); }
  load();
});
let msgTimer, pendingMsg = null;
async function flushMessageEdits() {
  clearTimeout(msgTimer);
  if (!pendingMsg) return;
  const { id, el } = pendingMsg;
  pendingMsg = null;
  const subject = document.querySelector(`input.msg-subject[data-id="${CSS.escape(id)}"]`)?.value;
  const full = document.querySelector(`textarea.msg-edit[data-id="${CSS.escape(id)}"]`)?.value ?? "";
  await patch(id, { hiringMessage: { full, ...(subject != null ? { subject } : {}) } }, false);
  const ok = el.closest("td")?.querySelector(".msg-actions .saved");
  if (ok) { ok.classList.add("show"); setTimeout(() => ok.classList.remove("show"), 1200); }
}
document.addEventListener("input", (e) => {
  const el = e.target.closest("textarea.msg-edit, input.msg-subject");
  if (!el) return;
  pendingMsg = { id: el.dataset.id, el };
  clearTimeout(msgTimer);
  msgTimer = setTimeout(flushMessageEdits, 700);
});

// ---- Agent control: one independent agent per platform ------------------
const MODE_HINT = {
  "dry-run": "Practice: finds jobs, scores them, writes tailored resumes and messages. Applies to nothing.",
  review: "Ask before submit: fills each application, then waits for you to press Yes here.",
  auto: "Fully automatic: fills and submits on its own; when stuck, the AI navigator works it out. It never waits for you: a job that needs a person (CAPTCHA, SMS code) is set aside and retried later.",
};
const MODE_NAME = { "dry-run": "Practice", review: "Ask before submit", auto: "Fully automatic" };
let AG = {};
let agentsBuilt = false;
const el = (k, name) => document.querySelector(`.agent[data-p="${k}"] [data-el="${name}"]`);
const savePrefs = () => { try { localStorage.setItem("ja-agents", JSON.stringify(Object.fromEntries(Object.entries(AG).map(([k, a]) => [k, { mode: a.mode, max: a.max, review: a.review, keepGoing: a.keepGoing, retry: a.retry }])))); } catch {} };
function paintMode(k) {
  el(k, "seg").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === AG[k].mode));
  el(k, "hint").textContent = MODE_HINT[AG[k].mode];
}
/** One card per site listed by the server (config.json → platforms). */
function buildAgents(list) {
  PLATFORM = { ...Object.fromEntries(list.map((p) => [p.key, { label: p.label, color: p.color }])), other: { label: "Other", color: "var(--muted)" } };
  $("#legend").innerHTML = list.map((p) => `<span><i style="background:${p.color}"></i>${esc(p.label)}</span>`).join("");
  const sel = $("#platformSel");
  if (sel) sel.innerHTML = `<option value="">All platforms</option>${list.map((p) => `<option value="${p.key}">${esc(p.label)}</option>`).join("")}<option value="other">Other</option>`;
  const GROUP_ORDER = ["India", "Aggregators", "Remote boards", "Talent networks", "Global & relocation"];
  const groupIdx = (g) => { const i = GROUP_ORDER.indexOf(g || ""); return i < 0 ? GROUP_ORDER.length : i; };
  const ordered = [...list].sort((a, b) => groupIdx(a.group) - groupIdx(b.group));
  AG = Object.fromEntries(ordered.map((p) => [p.key, { label: p.label, color: p.color, group: p.group || "", profileOnly: !!p.profileOnly, notes: p.notes || "", needs: p.needs || "", mode: "auto", max: 1000, review: 0, keepGoing: true, retry: true, since: 0, running: false, queued: false, pending: null, logOpen: false }]));
  try {
    const saved = JSON.parse(localStorage.getItem("ja-agents") || "{}");
    for (const k of Object.keys(AG)) Object.assign(AG[k], saved[k] ?? {});
  } catch {}
  let lastGroup = null;
  $("#agents").innerHTML = Object.entries(AG).map(([k, a]) => `${a.group !== lastGroup && list.some((p) => p.group) ? `<h3 class="agent-group">${esc((lastGroup = a.group) || "Other sites")}<span class="n">${Object.values(AG).filter((x) => x.group === a.group).length} sites</span></h3>` : ""}
  <div class="card agent${a.profileOnly ? " profile-only" : ""}" data-p="${k}">
    <div class="agent-top">
      <div class="agent-state">
        <span class="agent-dot" data-el="dot"></span>
        <div><div class="agent-title"><i class="pf" style="background:${a.color}"></i>${esc(a.label)} agent · <span data-el="title">idle</span></div><div class="sub" data-el="sub">Choose a mode and press Start</div></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center"><button class="btn" data-el="profileBtn" title="Bring her profile on this site in line with the resume (headline, experience, skills, education, resume file). Pauses for you only if the site asks for a code.">↻ Update profile</button><button class="btn go" data-el="btn">▶ Start</button></div>
    </div>
    ${a.notes || a.needs || a.profileOnly ? `<div class="agent-note">${a.profileOnly ? "Profile-only site: companies find her profile here, there is no job list to search. " : ""}${esc(a.notes)}${a.needs ? ` <b>Needs you:</b> ${esc(a.needs)}.` : ""}</div>` : ""}
    <div class="agent-controls" style="margin-top:12px">
      <div class="seg" data-el="seg" role="group" aria-label="${esc(a.label)} mode">
        <button data-v="dry-run">Practice</button><button data-v="review">Ask before submit</button><button data-v="auto">Fully automatic</button>
      </div>
      <label class="sub" title="Stop after this many applications">Apply to <input class="num-input" data-el="max" type="number" min="1" max="2000" value="${a.max}"></label>
      <label class="sub" title="Stop after reviewing this many jobs (0 = all of them)">Review <small>(0 = all)</small> <input class="num-input" data-el="review" type="number" min="0" max="5000" value="${a.review}" placeholder="all"></label>
      <label class="sub keep" title="Don't stop until the target is reached: go through more result pages, and check again for new postings when everything has been reviewed"><input type="checkbox" data-el="keep" ${a.keepGoing ? "checked" : ""}> Keep going until done</label>
      <label class="sub keep" title="First go back to jobs found earlier that aren't applied yet (needs attention, apply on site, shortlisted)"><input type="checkbox" data-el="retry" ${a.retry !== false ? "checked" : ""}> Retry unfinished first</label>
    </div>
    <div class="mode-hint" data-el="hint"></div>
    <div class="now" data-el="now" hidden><div class="now-job"><small>Working on</small><span data-el="nowText"></span></div><button class="btn" data-el="skip" title="Drop this job and move to the next one">⏭ Skip this job</button></div>
    <div data-el="ask"></div>
    <button class="log-toggle" data-el="logToggle">▸ Show live log</button>
    <div class="logbox" data-el="log" hidden></div>
  </div>`).join("");
  for (const k of Object.keys(AG)) {
    paintMode(k);
    el(k, "seg").onclick = (e) => { const b = e.target.closest("button"); if (!b || AG[k].running) return; AG[k].mode = b.dataset.v; paintMode(k); savePrefs(); };
    el(k, "max").onchange = (e) => { AG[k].max = Number(e.target.value) || 1000; savePrefs(); };
    el(k, "review").onchange = (e) => { AG[k].review = Math.max(0, Number(e.target.value) || 0); savePrefs(); };
    el(k, "keep").onchange = (e) => { AG[k].keepGoing = e.target.checked; savePrefs(); };
    el(k, "retry").onchange = (e) => { AG[k].retry = e.target.checked; savePrefs(); };
    el(k, "logToggle").onclick = () => toggleLog(k);
    el(k, "btn").onclick = () => startStop(k);
    el(k, "profileBtn").onclick = () => updateProfile(k);
    el(k, "skip").onclick = () => skipJob(k);
  }
  try {
    if ("Notification" in window && Notification.permission === "default")
      document.querySelectorAll(".agent [data-el=btn]").forEach((b) => b.addEventListener("click", () => Notification.requestPermission(), { once: true }));
  } catch {}
  agentsBuilt = true;
  render();
}
async function skipJob(k) {
  el(k, "skip").disabled = true;
  try {
    const r = await fetch("/api/agent/skip", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ platform: k }) });
    if (!r.ok) alert((await r.json()).error || "Couldn't skip");
  } finally {
    setTimeout(() => (el(k, "skip").disabled = false), 4000);
    pollAgent();
  }
}
function toggleLog(k, open = !AG[k].logOpen) {
  AG[k].logOpen = open;
  el(k, "log").hidden = !open;
  el(k, "logToggle").textContent = (open ? "▾ Hide" : "▸ Show") + " live log";
  if (open) el(k, "log").scrollTop = 1e9;
}
async function updateProfile(k) {
  if (AG[k].running || AG[k].queued) return alert(`${AG[k].label} is running or waiting in the queue. Stop it first, then update the profile.`);
  const btn = el(k, "profileBtn");
  btn.disabled = true;
  try {
    const r = await fetch("/api/agent/start", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ platform: k, mode: "review", task: "profile", max: 1, review: 0, keepGoing: false, retry: false }) });
    const data = await r.json();
    if (!r.ok) alert(data.error || "Something went wrong");
    else { AG[k].since = 0; el(k, "log").innerHTML = ""; toggleLog(k, true); }
  } finally {
    btn.disabled = false;
    pollAgent();
  }
}
async function startStop(k) {
  const btn = el(k, "btn");
  btn.disabled = true;
  const starting = !AG[k].running && !AG[k].queued;
  try {
    const r = await fetch(starting ? "/api/agent/start" : "/api/agent/stop", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ platform: k, mode: AG[k].mode, max: AG[k].max, review: AG[k].review, keepGoing: AG[k].keepGoing, retry: AG[k].retry !== false }) });
    const data = await r.json();
    if (!r.ok) alert(data.error || "Something went wrong");
    else if (starting) { AG[k].since = 0; el(k, "log").innerHTML = ""; toggleLog(k, true); }
  } finally {
    btn.disabled = false;
    pollAgent();
  }
}

$("#startAllBtn").onclick = async () => {
  // Profile-only sites (talent networks) have nothing to search; ↻ Update all profiles covers them.
  for (const k of Object.keys(AG)) if (!AG[k].running && !AG[k].queued && !AG[k].profileOnly) await startStop(k);
};
$("#profilesBtn").onclick = async () => {
  for (const k of Object.keys(AG)) if (!AG[k].running && !AG[k].queued) await updateProfile(k);
};
$("#stopAllBtn").onclick = async () => {
  try { await fetch("/api/agent/stop", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ platform: "all" }) }); } catch {}
  pollAgent();
};

function lineClass(t, kind) {
  if (kind === "sys") return "sys";
  if (kind === "ask") return "ask";
  if (kind === "err" || /failed|error|couldn't|needs_attention/i.test(t)) return "err";
  if (/✔|applied \(|tailored resume|✉ Sent|Connected|back on your Naukri/i.test(t)) return "ok";
  return "";
}

let pollTimer;
let tiersLoaded = false;
async function pollAgent() {
  clearTimeout(pollTimer);
  let anyRunning = false;
  try {
    const q = new URLSearchParams(Object.fromEntries(Object.entries(AG).map(([k, a]) => [k, a.since])));
    const { platforms, tiers, profiles, runs, maxConcurrent, rotateMinutes, queue } = await (await fetch(`/api/agent?${q}`, { cache: "no-store" })).json();
    if (!agentsBuilt && platforms?.length) buildAgents(platforms);
    if (maxConcurrent) {
      const n = Object.values(runs).filter((r) => r.running).length;
      $("#agentsLine").textContent = `${platforms.length} sites · ${maxConcurrent} agents run at a time (${n} running${queue?.length ? `, ${queue.length} waiting in the queue` : ""})${rotateMinutes ? ` · each job agent gets ${rotateMinutes} min, then the next site takes over` : ""} · change maxConcurrentAgents in config.json for a stronger Mac`;
    }
    if (!tiersLoaded && tiers?.length) { tiersLoaded = true; setTiers(tiers); renderTable(); }
    window.__profiles = profiles || {};
    let newLines = false;
    for (const [k, s] of Object.entries(runs)) {
      if (!AG[k]) continue;
      const wasRunning = AG[k].running;
      AG[k].running = s.running;
      AG[k].queued = !!s.queued;
      anyRunning ||= s.running;
      if (s.log.length) {
        newLines = true;
        AG[k].since = s.log[s.log.length - 1].n;
        const box = el(k, "log");
        const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
        box.insertAdjacentHTML("beforeend", s.log.map((l) => `<div class="${lineClass(l.text, l.kind)}">${esc(new Date(l.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }))}  ${esc(l.text)}</div>`).join(""));
        while (box.children.length > 600) box.firstChild.remove();
        if (atBottom) box.scrollTop = box.scrollHeight;
      }
      renderAgent(k, s);
      if (wasRunning && !s.running) newLines = true;
    }
    if (newLines) load();
  } catch {}
  const waiting = Object.values(AG).some((a) => a.pending != null);
  document.title = (waiting ? "⚠ " : "") + document.title.replace(/^⚠ /, "");
  pollTimer = setTimeout(pollAgent, anyRunning ? 1500 : 6000);
}

const profileLine = (k) => { const p = window.__profiles?.[k]; return p?.at ? ` · profile synced ${ago(p.at)}${p.resume ? ` with ${p.resume}` : ""}` : " · profile not synced yet"; };
const appliedSince = (k, t) => state.rows.filter((r) => r.platform === k && r.appliedAt && new Date(r.appliedAt).getTime() >= (t || 0)).length;
function renderAgent(k, s) {
  const a = AG[k], btn = el(k, "btn");
  a.lastStatus = s;
  const cur = s.running && s.current;
  el(k, "now").hidden = !cur;
  if (cur) el(k, "nowText").textContent = `${cur.tier ? `[${cur.tier}] ` : ""}${cur.title}${cur.company ? ` · ${cur.company}` : ""}${cur.matchScore != null ? ` · ${cur.matchScore}% match` : ""}`;
  el(k, "dot").className = "agent-dot" + (s.pending ? " wait" : s.running ? " run" : "");
  const mins = s.startedAt ? Math.max(0, Math.round(((s.running ? Date.now() : s.endedAt) - s.startedAt) / 60000)) : 0;
  const modeName = MODE_NAME[s.options?.mode] ?? "";
  if (s.queued) { el(k, "title").textContent = "in the queue"; el(k, "sub").textContent = `Waiting for a free slot (${s.queuePos ? `#${s.queuePos} in line` : "next"}) · starts by itself`; }
  else if (s.pending) { el(k, "title").textContent = "waiting for you"; el(k, "sub").textContent = `${modeName} · running ${mins} min`; }
  else if (s.running) { el(k, "title").textContent = "running"; el(k, "sub").textContent = `${modeName} · ${mins} min · applied ${appliedSince(k, s.startedAt)}/${s.options?.max ?? "?"}${s.restarts ? ` · restarted ${s.restarts}×` : ""} · keep the agent's Chrome open`; }
  else if (s.endedAt && s.fatal) { el(k, "title").textContent = "stopped"; el(k, "sub").innerHTML = `<span style="color:var(--crit)">⚠ ${esc(s.fatal)}</span>`; }
  else if (s.endedAt) { el(k, "title").textContent = "idle"; el(k, "sub").textContent = `Last run finished ${ago(s.endedAt)} (${modeName}, ${mins} min)` + profileLine(k); }
  else { el(k, "title").textContent = "idle"; el(k, "sub").textContent = "Choose a mode and press Start" + profileLine(k); }
  btn.className = "btn " + (s.running || s.queued ? "stop" : "go");
  btn.textContent = s.queued ? "✕ Leave queue" : s.running ? "■ Stop" : "▶ Start";
  el(k, "dot").className = "agent-dot" + (s.pending ? " wait" : s.running ? " run" : "");
  el(k, "profileBtn").disabled = s.running || !!s.queued;
  if (s.running && s.options?.task === "profile") el(k, "title").textContent = s.pending ? "profile · needs you" : "updating profile";
  el(k, "seg").querySelectorAll("button").forEach((b) => (b.disabled = s.running || !!s.queued));
  el(k, "max").disabled = el(k, "review").disabled = el(k, "keep").disabled = el(k, "retry").disabled = s.running || !!s.queued;
  if (s.running && s.options?.mode && s.options.mode !== a.mode) { a.mode = s.options.mode; paintMode(k); }

  const key = s.pending ? s.pending.id : null;
  if (key === a.pending) return;
  a.pending = key;
  if (!s.pending) { el(k, "ask").innerHTML = ""; return; }
  const choices = s.pending.choices?.length ? s.pending.choices : [{ label: "Continue", value: "" }];
  const until = s.pending.timeoutMs ? ` · skips in ${Math.round(s.pending.timeoutMs / 60000)} min if nobody answers` : "";
  el(k, "ask").innerHTML = `<div class="ask" role="alert"><div class="ask-q"><small>${a.label} agent needs you${until}</small>${esc(s.pending.question)}</div>
    <div class="ask-btns">${choices.map((c, i) => `<button class="btn ${i === 0 ? "primary" : ""}" data-ans="${esc(c.value)}">${esc(c.label)}</button>`).join("")}</div></div>`;
  el(k, "ask").querySelectorAll("[data-ans]").forEach((b) => (b.onclick = async () => {
    el(k, "ask").querySelectorAll("button").forEach((x) => (x.disabled = true));
    await fetch("/api/agent/answer", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ platform: k, id: s.pending.id, answer: b.dataset.ans }) });
    pollAgent();
  }));
  try { if (document.hidden && "Notification" in window && Notification.permission === "granted") new Notification(`${a.label} agent needs you`, { body: s.pending.question }); } catch {}
}

pollAgent();

load();
setInterval(() => { if (!document.hidden && !document.activeElement?.matches("textarea, .toolbar input, .detail input, .row input")) load(); }, 15000);
</script>
